<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TAS-1 Ops</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="adm">
  <header class="adm-h"><span class="brand">TAS-1 <b>Ops</b></span><span class="sp" style="flex:1"></span><a class="btn" href="/wall" target="_blank" rel="noopener" style="min-height:32px;padding:6px 12px;font-size:12px;text-decoration:none">대형 화면</a><button class="btn" type="button" id="out" style="min-height:32px;padding:6px 12px;font-size:12px" hidden>로그아웃</button></header>

  <form id="login" class="f adm-login">
    <h2>관리자 로그인</h2>
    <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="formerr" id="lerr"></div>
    <button class="btn solid" type="submit">로그인</button>
    <p style="font-size:12.5px;color:var(--muted)">비밀번호는 서버에서 <code>tas1-game admin-password</code> 로 다시 만들 수 있습니다. 5회 틀리면 30분 잠깁니다.</p>
  </form>

  <div id="dash" hidden>
    <div class="cards" id="cards"></div>
    <div class="adm-row">
      <div class="panel">
        <div class="panel-h"><h3>참가자</h3><span class="sp"></span><input id="q" placeholder="이름·학번·학과 검색" aria-label="검색"><a class="btn" href="/api/admin/export.csv" style="min-height:32px;padding:6px 12px;font-size:12px;text-decoration:none">CSV 내보내기</a></div>
        <div class="tbl"><table><thead><tr><th>#</th><th>학번</th><th>이름</th><th>학과</th><th>전화번호</th><th>공식</th><th>전체</th><th>목표점수</th><th>최고고도</th><th>등록</th><th>최근</th><th></th></tr></thead><tbody id="players"></tbody></table></div>
      </div>
    </div>
    <div class="adm-row two-col">
      <div class="panel"><div class="panel-h"><h3>차단된 IP</h3></div><div id="bans"></div></div>
      <div class="panel"><div class="panel-h"><h3>서로게이트 결과표</h3></div><div id="lut" class="mono" style="font-size:12px;color:var(--soft);white-space:pre-wrap"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/static/js/admin.js"></script>
</body>
</html>
