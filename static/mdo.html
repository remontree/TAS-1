<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUSI — MDO</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/vendor/react.production.min.js" crossorigin></script>
  <script src="/vendor/react-dom.production.min.js" crossorigin></script>
  <script src="/vendor/prop-types.min.js" crossorigin></script>
  <script src="/vendor/babel.min.js"></script>
  <script src="/vendor/Recharts.js"></script>
  <style>
    /* ======================================================
       IBM Carbon Design System v11 — White Theme
       ====================================================== */
    :root, [data-theme="light"] {
      --cds-background:              #ffffff;
      --cds-layer-01:                #f4f4f4;
      --cds-layer-02:                #ffffff;
      --cds-layer-accent-01:         #e0e0e0;
      --cds-field-01:                #f4f4f4;
      --cds-border-subtle-00:        #e0e0e0;
      --cds-border-subtle-01:        #c6c6c6;
      --cds-border-strong-01:        #8d8d8d;
      --cds-text-primary:            #161616;
      --cds-text-secondary:          #525252;
      --cds-text-placeholder:        #a8a8a8;
      --cds-text-on-color:           #ffffff;
      --cds-text-on-color-disabled:  #8d8d8d;
      --cds-text-helper:             #6f6f6f;
      --cds-text-inverse:            #ffffff;
      --cds-text-warning:            #8e6a00;
      --cds-background-inverse:      #393939;
      --cds-link-primary:            #0f62fe;
      --cds-interactive:             #0f62fe;
      --cds-interactive-hover:       #0050e6;
      --cds-button-secondary:        #393939;
      --cds-button-secondary-hover:  #474747;
      --cds-button-tertiary:         #0f62fe;
      --cds-button-tertiary-hover:   #0050e6;
      --cds-button-tertiary-hover-text: #ffffff;
      --cds-button-disabled:         #c6c6c6;
      --cds-button-danger:           #da1e28;
      --cds-button-danger-hover:     #b81921;
      --cds-support-error:           #da1e28;
      --cds-support-success:         #24a148;
      --cds-support-warning:         #f1c21b;
      --cds-support-info:            #0043ce;
      --cds-accent-gold:             #b28600;
      --cds-focus:                   #0f62fe;
      --cds-highlight:               #d0e2ff;
      --cds-overlay:                 rgba(22,22,22,0.5);
      --cds-hover-ui:                #e8e8e8;
      --cds-hover-row:               #e8e8e8;
      --cds-notif-error-bg:          #fff1f1;
      --cds-notif-success-bg:        #defbe6;
      --cds-notif-warning-bg:        #fcf4d6;
      --cds-notif-info-bg:           #edf5ff;
      --cds-tag-blue-bg:             #d0e2ff;
      --cds-tag-blue-text:           #0043ce;
      --cds-tag-green-bg:            #a7f0ba;
      --cds-tag-green-text:          #0e6027;
      --cds-tag-red-bg:              #ffd7d9;
      --cds-tag-red-text:            #a2191f;
      --cds-tag-gray-bg:             #e0e0e0;
      --cds-tag-gray-text:           #161616;
      --cds-drop-bg:                 #edf5ff;
      --cds-drop-border:             #0f62fe;
      --cds-log-bg:                  #161616;
      --cds-log-text:                #6fdc8c;
      --cds-log-border:              #24a148;
      --cds-grain-bg:                #ffffff;
      --cds-grain-grid:              #e0e0e0;
      --cds-grain-casing:            #525252;
    }

    /* ======================================================
       IBM Carbon Design System v11 — Gray 100 Theme
       ====================================================== */
    [data-theme="dark"] {
      --cds-background:              #161616;
      --cds-layer-01:                #262626;
      --cds-layer-02:                #393939;
      --cds-layer-accent-01:         #393939;
      --cds-field-01:                #262626;
      --cds-border-subtle-00:        #393939;
      --cds-border-subtle-01:        #525252;
      --cds-border-strong-01:        #6f6f6f;
      --cds-text-primary:            #f4f4f4;
      --cds-text-secondary:          #c6c6c6;
      --cds-text-placeholder:        #6f6f6f;
      --cds-text-on-color:           #ffffff;
      --cds-text-on-color-disabled:  #8d8d8d;
      --cds-text-helper:             #a8a8a8;
      --cds-text-inverse:            #161616;
      --cds-text-warning:            #f1c21b;
      --cds-background-inverse:      #f4f4f4;
      --cds-link-primary:            #78a9ff;
      --cds-interactive:             #0f62fe;
      --cds-interactive-hover:       #0050e6;
      --cds-button-secondary:        #6f6f6f;
      --cds-button-secondary-hover:  #5e5e5e;
      --cds-button-tertiary:         #ffffff;
      --cds-button-tertiary-hover:   #f4f4f4;
      --cds-button-tertiary-hover-text: #161616;
      --cds-button-disabled:         #6f6f6f;
      --cds-button-danger:           #da1e28;
      --cds-button-danger-hover:     #b81921;
      --cds-support-error:           #fa4d56;
      --cds-support-success:         #42be65;
      --cds-support-warning:         #f1c21b;
      --cds-support-info:            #4589ff;
      --cds-accent-gold:             #d2a106;
      --cds-focus:                   #ffffff;
      --cds-highlight:               #001d6c;
      --cds-overlay:                 rgba(0,0,0,0.65);
      --cds-hover-ui:                #333333;
      --cds-hover-row:               #333333;
      --cds-notif-error-bg:          #262626;
      --cds-notif-success-bg:        #262626;
      --cds-notif-warning-bg:        #262626;
      --cds-notif-info-bg:           #262626;
      --cds-tag-blue-bg:             #0043ce;
      --cds-tag-blue-text:           #d0e2ff;
      --cds-tag-green-bg:            #198038;
      --cds-tag-green-text:          #a7f0ba;
      --cds-tag-red-bg:              #da1e28;
      --cds-tag-red-text:            #ffd7d9;
      --cds-tag-gray-bg:             #525252;
      --cds-tag-gray-text:           #f4f4f4;
      --cds-drop-bg:                 #262626;
      --cds-drop-border:             #78a9ff;
      --cds-log-bg:                  #262626;
      --cds-log-text:                #6fdc8c;
      --cds-log-border:              #42be65;
      --cds-grain-bg:                #161616;
      --cds-grain-grid:              #393939;
      --cds-grain-casing:            #c6c6c6;
    }

    /* ── Smooth theme transition ────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      transition: background-color .2s ease, border-color .2s ease, color .15s ease;
    }
    .cds-accordion__arrow { transition: transform .25s cubic-bezier(.25,.46,.45,.94) !important; }

    html { font-size:16px; -webkit-font-smoothing:antialiased; }
    body {
      font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--cds-background); color:var(--cds-text-primary);
      line-height:1.5; overflow-x:hidden;
    }

    @keyframes fadeInUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn    { from{opacity:0} to{opacity:1} }
    @keyframes spin { to{transform:rotate(360deg)} }
    .animate-fadeInUp { animation:fadeInUp .4s cubic-bezier(.25,.46,.45,.94) forwards; }
    .animate-fadeIn   { animation:fadeIn .3s ease forwards; }

    /* ======================================================
       Carbon Header (always dark) — 시뮬레이터 페이지와 동일
       ====================================================== */
    .cds-header {
      position:fixed;top:0;left:0;right:0;z-index:8000;
      height:48px; background:#161616;
      display:flex;align-items:center;padding:0 16px;
      border-bottom:1px solid #393939;
    }
    .cds-header__name { color:#f4f4f4;font-size:14px;font-weight:600;letter-spacing:.16px;display:flex;align-items:center;gap:8px; }
    .cds-header__divider { color:#6f6f6f;font-weight:300;margin:0 2px; }
    .cds-header__page { color:#c6c6c6;font-weight:400; }
    .cds-header__nav  { margin-left:auto;display:flex;align-items:center;gap:8px; }
    .theme-toggle {
      background:transparent;border:1px solid #6f6f6f;
      height:32px;padding:0 12px;text-decoration:none;
      font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;
      letter-spacing:.32px;cursor:pointer;display:flex;align-items:center;gap:6px;
      color:#c6c6c6;transition:background .15s,border-color .15s,color .15s;
    }
    .theme-toggle:hover { background:#2c2c2c;border-color:#c6c6c6;color:#f4f4f4; }
    .theme-toggle--active { background:#0f62fe;border-color:#0f62fe;color:#ffffff; }
    .theme-toggle--active:hover { background:#0050e6;border-color:#0050e6;color:#ffffff; }

    /* ======================================================
       Layout
       ====================================================== */
    .app-container { margin-top:48px;display:flex;min-height:calc(100vh - 48px); }
    .config-panel {
      width:400px;min-width:400px;background:var(--cds-layer-01);
      border-right:1px solid var(--cds-border-subtle-00);
      overflow-y:auto;height:calc(100vh - 48px);position:sticky;top:48px;
    }
    .config-panel::-webkit-scrollbar { width:4px; }
    .config-panel::-webkit-scrollbar-thumb { background:var(--cds-border-subtle-01);border-radius:2px; }
    .config-header { padding:24px 24px 16px;border-bottom:1px solid var(--cds-border-subtle-00); }
    .config-header h2 { font-size:20px;font-weight:600;color:var(--cds-text-primary);margin-bottom:4px; }
    .config-header p  { font-size:12px;color:var(--cds-text-helper);letter-spacing:.32px; }
    .config-actions { padding:12px 24px;display:flex;gap:8px;border-bottom:1px solid var(--cds-border-subtle-00);flex-wrap:wrap; }
    .result-panel  { flex:1;padding:32px;overflow-y:auto;min-width:0; }

    /* ======================================================
       Accordion
       ====================================================== */
    .cds-accordion { border-top:1px solid var(--cds-border-subtle-00); }
    .cds-accordion__item { border-bottom:1px solid var(--cds-border-subtle-00); }
    .cds-accordion__heading {
      width:100%;background:transparent;border:none;
      padding:10px 24px 10px 48px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;
      color:var(--cds-text-primary);cursor:pointer;display:flex;align-items:center;
      position:relative;text-align:left;min-height:40px;
      transition:background .15s;letter-spacing:.16px;
    }
    .cds-accordion__heading:hover { background:var(--cds-hover-ui); }
    .cds-accordion__arrow { position:absolute;left:16px;width:16px;height:16px;fill:var(--cds-text-primary); }
    .cds-accordion__item--open .cds-accordion__arrow { transform:rotate(90deg); }
    .cds-accordion__content { padding:0 24px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px; }
    .full-width { grid-column:1/-1; }

    /* ======================================================
       Form / Input
       ====================================================== */
    .cds-form-item { display:flex;flex-direction:column; }
    .cds-label { font-size:12px;color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px;line-height:16px; }
    .cds-text-input {
      width:100%;height:40px;padding:0 16px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--cds-text-primary);
      background:var(--cds-field-01);border:none;border-bottom:1px solid var(--cds-border-strong-01);
      outline:none;transition:border-color .15s,box-shadow .15s,background .2s;
    }
    .cds-text-input:focus { border-bottom-color:var(--cds-focus);box-shadow:inset 0 -2px 0 0 var(--cds-focus); }
    .cds-text-input:disabled { color:var(--cds-text-placeholder);cursor:not-allowed; }
    .cds-helper-text { font-size:12px;color:var(--cds-text-helper);margin-top:4px;letter-spacing:.32px; }
    .config-panel .cds-text-input { background:var(--cds-layer-02); }
    .input-unit-wrap { position:relative; }
    .input-unit-wrap .cds-text-input { padding-right:56px;font-family:'IBM Plex Mono',monospace; }
    .input-unit { position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--cds-text-helper);font-family:'IBM Plex Mono',monospace;pointer-events:none; }
    .target-block { padding:16px 24px;display:flex;flex-direction:column;gap:16px; }
    .target-derived {
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 12px;background:var(--cds-layer-02);border-left:3px solid var(--cds-interactive);
      font-size:12px;color:var(--cds-text-secondary);letter-spacing:.32px;
    }
    .target-derived strong { font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary);font-weight:500;font-size:13px; }

    /* ======================================================
       Buttons
       ====================================================== */
    .cds-btn {
      display:inline-flex;align-items:center;gap:8px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:400;letter-spacing:.16px;
      border:none;cursor:pointer;padding:11px 64px 11px 16px;min-height:40px;white-space:nowrap;
    }
    .cds-btn svg { fill:currentColor;width:16px;height:16px; }
    .cds-btn--primary  { background:var(--cds-interactive);color:#fff; }
    .cds-btn--primary:hover  { background:var(--cds-interactive-hover); }
    .cds-btn--primary:disabled { background:var(--cds-button-disabled);color:var(--cds-text-on-color-disabled);cursor:not-allowed; }
    .cds-btn--danger { background:var(--cds-button-danger);color:#fff; }
    .cds-btn--danger:hover { background:var(--cds-button-danger-hover); }
    .cds-btn--danger:disabled { background:var(--cds-button-disabled);color:var(--cds-text-on-color-disabled);cursor:not-allowed; }
    .cds-btn--tertiary {
      background:transparent;color:var(--cds-button-tertiary);
      border:1px solid var(--cds-button-tertiary);padding:10px 63px 10px 15px;
    }
    .cds-btn--tertiary:hover { background:var(--cds-button-tertiary-hover);color:var(--cds-button-tertiary-hover-text);border-color:var(--cds-button-tertiary-hover); }
    .cds-btn--ghost { background:transparent;color:var(--cds-link-primary);padding:11px 16px; }
    .cds-btn--ghost:hover { background:var(--cds-hover-ui); }
    .cds-btn--compact { padding-right:16px; }

    /* ======================================================
       Data Table / Notifications / Tags
       ====================================================== */
    .cds-data-table { width:100%;border-collapse:collapse;font-size:13px; }
    .cds-data-table th { padding:8px 12px;text-align:left;font-weight:600;font-size:12px;letter-spacing:.16px;color:var(--cds-text-primary);border-bottom:1px solid var(--cds-border-subtle-01);background:var(--cds-layer-accent-01); }
    .cds-data-table td { padding:7px 12px;border-bottom:1px solid var(--cds-border-subtle-00);color:var(--cds-text-secondary);font-family:'IBM Plex Mono',monospace;font-size:12px; }
    .cds-data-table td.num { text-align:right;color:var(--cds-text-primary); }
    .cds-data-table td.label { font-family:'IBM Plex Sans',sans-serif; }
    .cds-data-table tbody tr:hover { background:var(--cds-hover-row); }

    .cds-notification { display:flex;align-items:flex-start;gap:12px;padding:13px 16px;font-size:14px;border-left:3px solid;margin-bottom:16px;animation:fadeInUp .3s ease; }
    .cds-notification--error   { background:var(--cds-notif-error-bg);border-color:var(--cds-support-error); }
    .cds-notification--success { background:var(--cds-notif-success-bg);border-color:var(--cds-support-success); }
    .cds-notification--warning { background:var(--cds-notif-warning-bg);border-color:var(--cds-support-warning); }
    .cds-notification__title    { font-weight:600;margin-bottom:2px;color:var(--cds-text-primary); }
    .cds-notification__subtitle { font-size:13px;color:var(--cds-text-secondary); }
    .cds-notification__close    { margin-left:auto;background:none;border:none;cursor:pointer;padding:4px;color:var(--cds-text-secondary); }

    .cds-tag { display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;letter-spacing:.32px; }
    .cds-tag--blue  { background:var(--cds-tag-blue-bg);color:var(--cds-tag-blue-text); }
    .cds-tag--green { background:var(--cds-tag-green-bg);color:var(--cds-tag-green-text); }
    .cds-tag--red   { background:var(--cds-tag-red-bg);color:var(--cds-tag-red-text); }
    .cds-tag--gray  { background:var(--cds-tag-gray-bg);color:var(--cds-tag-gray-text); }
    .tag-dot { width:8px;height:8px;border-radius:50%;background:currentColor; }
    .tag-dot--live { animation:livePulse 1.2s ease-in-out infinite; }
    @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.7)} }

    /* ======================================================
       Cards / sections
       ====================================================== */
    .chart-card { background:var(--cds-layer-01);border:1px solid var(--cds-border-subtle-00);padding:20px;min-width:0;animation:fadeInUp .4s ease both; }
    .chart-card__title    { font-size:14px;font-weight:600;color:var(--cds-text-primary);margin-bottom:4px;letter-spacing:.16px;display:flex;align-items:center;gap:8px; }
    .chart-card__subtitle { font-size:12px;color:var(--cds-text-helper);margin-bottom:16px;letter-spacing:.32px; }
    .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px; }
    .grid-3 { display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:16px; }
    @media(max-width:1300px){ .grid-3{grid-template-columns:1fr;} }
    .mini-title { font-size:12px;font-weight:600;color:var(--cds-text-secondary);margin-bottom:4px; }
    .empty-mini { height:280px;display:flex;align-items:center;justify-content:center;color:var(--cds-text-helper);font-size:13px; }
    .section-title    { font-size:20px;font-weight:600;color:var(--cds-text-primary);margin-bottom:8px; }
    .section-subtitle { font-size:14px;color:var(--cds-text-secondary);margin-bottom:24px; }
    .mono { font-family:'IBM Plex Mono',monospace; }
    .recharts-tooltip-wrapper { z-index:100; }
    .custom-tooltip { background:var(--cds-background-inverse);color:var(--cds-text-inverse);padding:10px 14px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3); }
    .custom-tooltip .label { font-weight:600;margin-bottom:4px; }
    .custom-tooltip .value { font-family:'IBM Plex Mono',monospace; }

    /* ======================================================
       MDO — run status
       ====================================================== */
    .run-status { display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px; }
    .run-status__gen { font-size:28px;font-weight:300;letter-spacing:-.4px;color:var(--cds-text-primary); }
    .run-status__gen span { font-size:14px;color:var(--cds-text-helper);margin-left:4px;font-weight:400; }
    .run-status__meta { margin-left:auto;display:flex;gap:24px;font-size:12px;color:var(--cds-text-helper);letter-spacing:.32px; }
    .run-status__meta strong { display:block;font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary);font-size:16px;font-weight:400; }
    .gen-track { display:flex;gap:2px;height:8px;margin-bottom:24px; }
    .cds-select {
      width:100%;height:40px;padding:0 12px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--cds-text-primary);
      background:var(--cds-layer-02);border:none;border-bottom:1px solid var(--cds-border-strong-01);outline:none;cursor:pointer;
    }
    .cds-select:disabled { color:var(--cds-text-placeholder);cursor:not-allowed; }
    .mode-switch { display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--cds-border-strong-01); }
    .mode-switch button {
      height:40px;border:none;background:transparent;color:var(--cds-text-secondary);font:inherit;font-size:13px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .mode-switch button + button { border-left:1px solid var(--cds-border-strong-01); }
    .mode-switch button.active { background:var(--cds-interactive);color:#fff; }
    .mode-switch button:disabled { cursor:not-allowed;opacity:.6; }
    .strat-track { display:flex;gap:2px;height:28px;margin:4px 0 12px; }
    .strat-seg { flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden; }
    .strat-seg > div { display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-family:'IBM Plex Mono',monospace;min-height:0; }
    .strat-seg--empty { background:var(--cds-layer-accent-01); }
    .strat-legend { display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--cds-text-secondary); }
    .strat-legend i { display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px; }
    .strat-legend strong { font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary);font-weight:500;margin-left:4px; }
    .gen-seg { flex:1;background:var(--cds-layer-accent-01);position:relative;overflow:hidden; }
    .gen-seg--done { background:var(--cds-interactive); }
    .gen-seg--feasible { background:var(--cds-support-success); }
    .gen-seg__fill { position:absolute;inset:0 auto 0 0;background:var(--cds-interactive);transition:width .4s ease; }
    .gen-seg--active .gen-seg__fill {
      background-image:repeating-linear-gradient(-45deg, rgba(255,255,255,.28) 0 6px, transparent 6px 12px);
      background-size:17px 17px;animation:stripes .6s linear infinite;
    }
    @keyframes stripes { to { background-position:17px 0; } }

    /* KPI tiles */
    .kpi-row { display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--cds-border-subtle-00);border:1px solid var(--cds-border-subtle-00);margin-bottom:16px; }
    .kpi { background:var(--cds-layer-01);padding:16px;min-width:0; }
    .kpi__label { font-size:11px;font-weight:600;letter-spacing:.64px;text-transform:uppercase;color:var(--cds-text-helper);margin-bottom:6px; }
    .kpi__value { font-size:28px;font-weight:300;font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary);letter-spacing:-.6px;line-height:1.15;white-space:nowrap; }
    .kpi__unit { font-size:13px;color:var(--cds-text-helper);margin-left:4px;letter-spacing:0; }
    .kpi__sub { font-size:12px;color:var(--cds-text-helper);margin-top:6px;letter-spacing:.32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .kpi__sub--ok { color:var(--cds-support-success); }
    .kpi__sub--bad { color:var(--cds-support-error); }
    .kpi--flash { animation:kpiFlash 1.4s ease; }
    @keyframes kpiFlash { 0%{box-shadow:inset 0 -3px 0 var(--cds-support-success);background:var(--cds-notif-success-bg)} 100%{box-shadow:inset 0 -3px 0 transparent} }
    .kpi-bar { height:4px;background:var(--cds-layer-accent-01);margin-top:8px;display:flex; }
    .kpi-bar > div { height:100%;transition:width .4s ease; }

    /* Pipeline flow */
    .flow { display:flex;align-items:stretch;margin-bottom:16px;background:var(--cds-layer-01);border:1px solid var(--cds-border-subtle-00);padding:16px 12px; }
    .flow-node { flex:1;min-width:0;padding:10px 12px;border:1px solid var(--cds-border-subtle-00);background:var(--cds-layer-02);position:relative; }
    .flow-node--active { border-color:var(--cds-interactive);box-shadow:0 0 0 1px var(--cds-interactive), 0 0 16px -2px var(--cds-interactive); }
    .flow-node__step { font-size:10px;font-weight:600;letter-spacing:.64px;text-transform:uppercase;color:var(--cds-text-helper); }
    .flow-node__name { font-size:13px;font-weight:600;color:var(--cds-text-primary);margin:2px 0 6px; }
    .flow-node__nums { display:flex;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;flex-wrap:wrap; }
    .flow-node__nums span { display:inline-flex;align-items:center;gap:4px;color:var(--cds-text-secondary); }
    .flow-node__nums i { width:8px;height:8px;display:inline-block; }
    .flow-arrow { width:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center; }
    .flow-arrow svg { width:36px;height:12px;overflow:visible; }
    .flow-arrow line { stroke:var(--cds-border-strong-01);stroke-width:2;stroke-dasharray:4 4; }
    .flow-arrow--live line { stroke:var(--cds-interactive);animation:dash .5s linear infinite; }
    .flow-arrow polygon { fill:var(--cds-border-strong-01); }
    .flow-arrow--live polygon { fill:var(--cds-interactive); }
    @keyframes dash { to { stroke-dashoffset:-8; } }

    /* Population matrix */
    .pop-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px; }
    .pop-cell {
      aspect-ratio:1;position:relative;cursor:default;
      display:flex;align-items:center;justify-content:center;
      font-family:'IBM Plex Mono',monospace;font-size:11px;
      border:1px solid transparent;user-select:none;
    }
    .pop-cell__rank { position:absolute;top:2px;left:4px;font-size:9px;opacity:.75; }
    .pop-cell__star { position:absolute;top:1px;right:3px;font-size:10px; }
    .pop-cell--pending { border:1px dashed var(--cds-border-subtle-01);color:var(--cds-text-placeholder); }
    .pop-cell--simulating { background:var(--cds-interactive);color:#fff;animation:cellPulse 1.1s ease-in-out infinite; }
    @keyframes cellPulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    .pop-cell--rejected {
      color:var(--cds-text-helper);background-color:var(--cds-layer-accent-01);
      background-image:repeating-linear-gradient(45deg, transparent 0 5px, var(--cds-border-subtle-01) 5px 6px);
    }
    .pop-cell--near { background:#ff832b;color:#161616; }
    .pop-cell--far  { background:var(--cds-support-error);color:#fff; }
    .pop-cell--feasible { background:var(--cds-support-success);color:#fff; }
    [data-theme="dark"] .pop-cell--feasible { color:#161616; }
    .pop-cell--elite { outline:2px solid var(--cds-accent-gold);outline-offset:1px; }
    .pop-cell--hover { box-shadow:0 0 0 2px var(--cds-text-primary); }
    .pop-cell .mini-spin { width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite; }
    .pop-legend { display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--cds-text-helper);letter-spacing:.32px; }
    .pop-legend span { display:inline-flex;align-items:center;gap:6px; }
    .pop-legend i { width:12px;height:12px;display:inline-block; }
    .inspector { margin-top:12px;padding:10px 12px;background:var(--cds-layer-02);border-left:3px solid var(--cds-border-strong-01);font-size:12px;min-height:58px;color:var(--cds-text-secondary); }
    .inspector strong { color:var(--cds-text-primary);font-weight:600; }
    .inspector .mono { color:var(--cds-text-primary); }

    /* Best design */
    .best-layout { display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px; }
    .engine-svg { width:100%;height:auto;display:block;background:var(--cds-grain-bg);border:1px solid var(--cds-border-subtle-00); }
    /* Feasible designs */
    .feas-head { display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px; }
    .feas-controls { display:flex;gap:12px;flex-wrap:wrap; }
    .seg { display:inline-flex;border:1px solid var(--cds-border-strong-01); }
    .seg button { height:32px;padding:0 14px;border:none;background:transparent;color:var(--cds-text-secondary);font:inherit;font-size:13px;cursor:pointer; }
    .seg button + button { border-left:1px solid var(--cds-border-strong-01); }
    .seg button.active { background:var(--cds-interactive);color:#fff; }
    .feas-empty { padding:40px;text-align:center;color:var(--cds-text-helper);font-size:13px;background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle-00); }
    .feas-table-wrap { max-height:440px;overflow:auto;border:1px solid var(--cds-border-subtle-00); }
    .feas-table thead th { position:sticky;top:0;z-index:1; }
    .feas-row { cursor:pointer; }
    .feas-row:hover td { background:var(--cds-hover-row); }
    .feas-sub { font-size:11px;color:var(--cds-text-helper); }
    .feas-gallery-bar { display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px; }
    .feas-check { display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cds-text-secondary);cursor:pointer; }
    .feas-check input { accent-color:var(--cds-interactive);width:16px;height:16px; }
    .feas-gallery { display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--cds-border-subtle-00);border:1px solid var(--cds-border-subtle-00); }
    .feas-card { text-align:left;background:var(--cds-layer-02);border:none;padding:12px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px; }
    .feas-card:hover { background:var(--cds-hover-ui);outline:2px solid var(--cds-interactive);outline-offset:-2px; }
    .feas-card__head { display:flex;align-items:center;gap:8px; }
    .feas-card__rank { font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cds-text-helper); }
    .feas-card__isp { margin-left:auto;font-size:20px;font-weight:300;color:var(--cds-text-primary); }
    .feas-card__isp small { font-size:11px;color:var(--cds-text-helper); }
    .feas-card__meta { display:flex;gap:10px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cds-text-secondary); }
    /* Modal (Carbon) */
    .modal-overlay { position:fixed;inset:0;background:rgba(22,22,22,.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .15s ease; }
    .modal { background:var(--cds-layer-01);width:100%;max-width:1080px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(0,0,0,.3); }
    .modal__header { display:flex;justify-content:space-between;gap:16px;padding:16px 16px 12px 24px; }
    .modal__label { font-size:12px;color:var(--cds-text-secondary);letter-spacing:.32px;font-family:'IBM Plex Mono',monospace; }
    .modal__title { font-size:24px;font-weight:400;color:var(--cds-text-primary);margin-top:4px;display:flex;align-items:center; }
    .modal__sub { font-size:13px;color:var(--cds-text-secondary);margin-top:4px; }
    .modal__close { width:48px;height:48px;border:none;background:transparent;color:var(--cds-text-primary);font-size:18px;cursor:pointer;flex-shrink:0; }
    .modal__close:hover { background:var(--cds-hover-ui); }
    .modal__body { padding:0 24px 16px;overflow:auto; }
    .modal__grid { display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px; }
    .modal__h { font-size:14px;font-weight:600;margin:0 0 8px;color:var(--cds-text-primary); }
    .modal__geom { display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start; }
    .modal__cons { margin-top:4px;padding:10px 12px;font-size:13px;background:var(--cds-layer-02);border-left:3px solid var(--cds-border-strong-01);color:var(--cds-text-secondary); }
    .modal__cons--ok { border-left-color:var(--cds-support-success);color:var(--cds-text-primary); }
    .modal__cons--bad { border-left-color:var(--cds-support-error);color:var(--cds-text-primary); }
    .modal__cons + .modal__h, table + .modal__h { margin-top:16px; }
    .modal__footer { display:flex;justify-content:flex-end;gap:8px;padding:12px 24px;border-top:1px solid var(--cds-border-subtle-00);background:var(--cds-layer-01); }
    @media(max-width:1200px){ .feas-gallery{grid-template-columns:repeat(2,1fr);} .modal__grid{grid-template-columns:1fr;} }
    @media(max-width:700px){ .feas-gallery{grid-template-columns:1fr;} .modal__geom{grid-template-columns:1fr;} }
    .best-actions { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px; }
    .perf-row { display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--cds-border-subtle-00);font-size:12px;color:var(--cds-text-secondary); }
    .perf-row strong { font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:14px;color:var(--cds-text-primary); }
    .perf-row em { font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;margin-left:6px; }

    /* Log */
    .sim-log { background:var(--cds-log-bg);color:var(--cds-log-text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:16px;height:180px;overflow-y:auto;white-space:pre-wrap;border-left:3px solid var(--cds-log-border); }

    /* Empty state pipeline */
    .hero { max-width:880px;margin:24px auto 0;animation:fadeInUp .5s ease both; }
    .hero h1 { font-size:32px;font-weight:300;letter-spacing:-.4px;margin-bottom:8px; }
    @media(max-width:1400px){ .kpi-row{grid-template-columns:repeat(3,1fr);} }
    @media(max-width:1200px){ .grid-2{grid-template-columns:1fr;} .best-layout{grid-template-columns:1fr;} .flow{flex-wrap:wrap;gap:8px;} .flow-arrow{display:none;} .flow-node{flex:1 1 30%;} }
    @media(max-width:900px){ .app-container{flex-direction:column;} .config-panel{width:100%;min-width:unset;height:auto;position:static;} .kpi-row{grid-template-columns:repeat(2,1fr);} .result-panel{padding:16px;} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const {
  ResponsiveContainer, ScatterChart, Scatter, XAxis, YAxis, ZAxis, CartesianGrid, Tooltip,
  ReferenceArea, ReferenceLine, ComposedChart, Line, Bar, BarChart, Cell, Legend, Area,
} = Recharts;

/* ===================================================================
   CONSTANTS
   =================================================================== */
const POLL_MS = 1000;
const HANDOFF_KEY = 'tusi-mdo-handoff';

// 테마별 차트 색 (Carbon support / data-viz 팔레트)
const PALETTE = {
  light: { ok:'#24a148', bad:'#da1e28', near:'#ff832b', blue:'#0f62fe', gold:'#b28600', past:'#a8a8a8', purple:'#8a3ffc', tick:'#525252', grid:'#e0e0e0', box:'#24a148' },
  dark:  { ok:'#42be65', bad:'#fa4d56', near:'#ff832b', blue:'#4589ff', gold:'#d2a106', past:'#6f6f6f', purple:'#a56eff', tick:'#c6c6c6', grid:'#393939', box:'#42be65' },
};

// rl/actions.py 전략 순서와 같은 색
const STRATEGY_COLORS = ['#0f62fe', '#8a3ffc', '#24a148', '#007d79', '#ff7eb6', '#b28600', '#1192e8', '#da1e28'];

// constrain.py 클래스 이름 → 표시 이름
const CONSTRAINT_LABELS = {
  ChamberThickness: '두께 < 구매 파이프 두께',
  ChamberEquality:  '탱크 = 챔버 (반지름·두께)',
  ChamberLength:    '탱크/챔버 길이 < 파이프 길이',
  OxtFill:          '산화제 충진 (ullage)',
  OxtPressure:      '탱크 초기 압력 < 산화제 임계압',
  OxtVolume:        '산화제+가압제 부피',
  Toxt:             '탱크 두께 (내압)',
  Tcc:              '챔버 두께 (내압)',
  InjectorDP:       '인젝터 차압 (Pt−Pc)/Pc',
  InjectorArea:     '인젝터 총 면적',
  MaxOri:           '오리피스 최대 길이',
  FuelArea:         '포트 면적 비율',
  FuelPort:         '포트가 연료 안에 위치',
  PortWeb:          '포트 사이 웹 두께',
  PortResolution:   '포트 격자 해상도',
  FuelLenght:       '연료 + 프리/포스트 챔버 길이',
  FuelRadius:       '연료 반지름 < 챔버',
  NozzleThroatSize: '노즐 목 < 챔버',
  NozzleExpansion:  '노즐 출구 > 목',
  NozzleExitSize:   '노즐 출구 ≤ 기체 외경',
  Impulse:          '목표 임펄스',
  ThrustAvg:        '목표 평균 추력',
  SimCompleted:     '시뮬레이션 완료',
};
const POST_SIM = new Set(['Impulse', 'ThrustAvg', 'SimCompleted', 'Tcc', 'Toxt', 'InjectorDP']);

/* ===================================================================
   HELPERS
   =================================================================== */
const fmt = (v, d=2) => (v == null || !isFinite(v)) ? '—' : Number(v).toFixed(d);
const fmtInt = (v) => (v == null || !isFinite(v)) ? '—' : Math.round(v).toLocaleString('en-US');
const mm  = (v) => fmt(v * 1000, 2);
const pct = (sim, target) => (sim == null || !target) ? null : (sim / target - 1) * 100;
const fmtTime = (s) => {
  if (s == null || !isFinite(s)) return '—';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}` : `${m}:${String(r).padStart(2,'0')}`;
};
const cellClass = (c) => {
  if (c.state === 'infeasible') return (c.violation != null && c.violation < 0.25) ? 'near' : 'far';
  return c.state;
};

/* ===================================================================
   ICONS
   =================================================================== */
const ChevronRight = () => <svg viewBox="0 0 16 16" className="cds-accordion__arrow"><path d="M11 8L6 13 5.3 12.3 9.6 8 5.3 3.7 6 3z"/></svg>;
const PlayIcon     = () => <svg viewBox="0 0 32 32"><path d="M7 28V4l22 12z"/></svg>;
const StopIcon     = () => <svg viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="16"/></svg>;
const DownloadIcon = () => <svg viewBox="0 0 16 16"><path d="M13 11v3H3v-3H2v3c0 .6.4 1 1 1h10c.6 0 1-.4 1-1v-3h-1zM7.5 11.4l-3.7-3.7.7-.7L7 9.6V1h1v8.6l2.5-2.6.7.7-3.7 3.7z"/></svg>;
const LaunchIcon   = () => <svg viewBox="0 0 32 32"><path d="M26 28H6a2 2 0 01-2-2V6a2 2 0 012-2h10v2H6v20h20V16h2v10a2 2 0 01-2 2z"/><path d="M20 2v2h6.59L18 12.59 19.41 14 28 5.41V12h2V2H20z"/></svg>;
const MoonIcon     = () => <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M13.502 5.414a15.075 15.075 0 000 21.17C17.275 30.357 22.497 32 27.502 32c1.252 0 2.5-.108 3.726-.321-6.827.674-13.019-1.49-17.488-5.96a15.065 15.065 0 010-21.305z"/></svg>;
const SunIcon      = () => <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M16 8a8 8 0 100 16A8 8 0 0016 8zm0-6a1 1 0 010 2 1 1 0 010-2zm0 24a1 1 0 010 2 1 1 0 010-2zM4 16a1 1 0 01-2 0 1 1 0 012 0zm24 0a1 1 0 01-2 0 1 1 0 012 0z"/></svg>;
const EngineIcon   = () => <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M4 11h14v10H4zM18 13l4-2v10l-4-2zM22 11l6-3v16l-6-3z" fill="none" stroke="currentColor" strokeWidth="2"/></svg>;
const DnaIcon      = () => <svg width="14" height="14" viewBox="0 0 32 32" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 3c0 9 14 9 14 18s-14 4-14 8M23 3c0 9-14 9-14 18M23 29c0-3-3-5-6-6"/><path d="M11 8h10M11 24h10M13 13h6"/></svg>;
const ChartIcon    = () => <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M4 2H2v26a2 2 0 002 2h26v-2H4z"/><path d="M30 9h-7v2h3.59L19 18.59l-4.29-4.3a1 1 0 00-1.42 0L6 21.59 7.41 23 14 16.41l4.29 4.3a1 1 0 001.42 0l8.29-8.3V16h2z"/></svg>;
const RulerIcon = () => <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M29.4 9.6 22.4 2.6a2 2 0 0 0-2.8 0L2.6 19.6a2 2 0 0 0 0 2.8l7 7a2 2 0 0 0 2.8 0l17-17a2 2 0 0 0 0-2.8zM11 28l-7-7 3-3 3.5 3.5 1.4-1.4L8.4 16.6l2.6-2.6 2 2 1.4-1.4-2-2 2.6-2.6 3.5 3.5 1.4-1.4L16.4 8.6l2.6-2.6 2 2 1.4-1.4-2-2L21 4l7 7z"/></svg>;
const BoltIcon     = () => <svg width="14" height="14" viewBox="0 0 32 32" fill="currentColor"><path d="M11.61 29.92a1 1 0 01-.6-1.07L12.83 17H8a1 1 0 01-1-1.23l3-13A1 1 0 0111 2h10a1 1 0 01.78.37 1 1 0 01.2.85L20.25 11H25a1 1 0 01.83 1.55l-12 17a1 1 0 01-1.22.37z"/></svg>;

/* ===================================================================
   SMALL COMPONENTS
   =================================================================== */
function AccordionItem({ title, defaultOpen, children, grid=true }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div className={`cds-accordion__item ${open?'cds-accordion__item--open':''}`}>
      <button className="cds-accordion__heading" onClick={()=>setOpen(o=>!o)}>
        <ChevronRight/>{title}
      </button>
      <div className={open ? '' : 'cds-accordion__content--hidden'} style={open?{}:{display:'none'}}>
        {grid ? <div className="cds-accordion__content">{children}</div> : <div style={{padding:'0 24px 16px'}}>{children}</div>}
      </div>
    </div>
  );
}

function UnitInput({ label, unit, value, onChange, helper, disabled, step, placeholder }) {
  return (
    <div className="cds-form-item">
      <label className="cds-label">{label}</label>
      <div className="input-unit-wrap">
        <input className="cds-text-input" type="number" value={value} step={step} disabled={disabled}
               placeholder={placeholder} onChange={e=>onChange(e.target.value)}/>
        {unit && <span className="input-unit">{unit}</span>}
      </div>
      {helper && <div className="cds-helper-text">{helper}</div>}
    </div>
  );
}

function ChartTooltip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const p = payload[0].payload;
  return (
    <div className="custom-tooltip">
      <div className="label">세대 {p.gen + 1}{p.feasible ? ' · 합격' : ''}</div>
      <div className="value">I {fmt(p.impulse,1)} N·s</div>
      <div className="value">F̄ {fmt(p.thrust_avg,1)} N</div>
      <div className="value">Isp {fmt(p.isp,2)} s</div>
    </div>
  );
}

/* ===================================================================
   EMPTY STATE
   =================================================================== */
function Hero() {
  return (
    <div className="hero">
      <h1>Hybrid MDO</h1>
    </div>
  );
}

/* ===================================================================
   RUN STATUS (generation track + timing)
   =================================================================== */
function RunStatus({ job }) {
  const nGen = shownGenerations(job);
  const { per: segPer, nSeg } = genBuckets(nGen);
  const histByGen = Object.fromEntries((job.history || []).map(h => [h.generation, h]));
  const pop = job.population || [];
  const evaluated = pop.filter(c => c.state !== 'pending' && c.state !== 'simulating').length;
  const frac = pop.length ? evaluated / pop.length : 0;
  const durations = job.history.map(h => h.duration);
  const avgDur = durations.length ? durations.reduce((a,b)=>a+b,0) / durations.length : null;
  const remaining = job.status === 'running' && avgDur != null
    ? avgDur * Math.max(0, nGen - job.generation - frac) : null;

  const tag = {
    running: ['cds-tag--blue', job.stop_requested ? 'STOPPING' : 'RUNNING', true],
    done:    ['cds-tag--green', 'COMPLETE', false],
    stopped: ['cds-tag--gray', 'STOPPED', false],
    error:   ['cds-tag--red', 'ERROR', false],
  }[job.status] || ['cds-tag--gray', job.status, false];

  return (
    <>
      <div className="run-status">
        <span className={`cds-tag ${tag[0]}`}><i className={`tag-dot ${tag[2]?'tag-dot--live':''}`}/>{tag[1]}</span>
        <div className="run-status__gen">
          Generation {Math.max(job.generation, 0) + 1}
          <span>/ {nGen}</span>
        </div>
        <div className="run-status__meta">
          {job.settings?.feasible_parents && <div>Parents<strong>{job.parents_feasible_from != null ? `합격만 (세대 ${job.parents_feasible_from + 1}~)` : '합격만 (대기)'}</strong></div>}
          <div>Optimizer<strong>{job.mode === 'ppo' ? `AI GA (PPO${job.argmax ? ' · argmax' : ' · 확률적'})` : job.mode === 'direct' ? `AI 직접 설계${job.argmax ? ' · 평균 행동' : ' · 확률적'}` : job.mode === 'curve' ? `AI 곡선 판단${job.argmax ? ' · 최선 이동' : ' · 확률적'}` : 'GA'} · {job.evaluator === 'surrogate' ? (job.mode === 'direct' || job.mode === 'curve' ? 'TS Surrogate' : 'Surrogate') : 'core'}</strong></div>
          <div>Target<strong>{fmt(job.targets.impulse,0)} N·s · {fmt(job.targets.thrust_avg,0)} N · ±{+((job.tolerance ?? 0.05) * 100).toFixed(2)}%</strong></div>
          <div>Elapsed<strong>{fmtTime(job.elapsed)}</strong></div>
          <div>ETA<strong>{job.status === 'running' ? (remaining != null ? `≤ ${fmtTime(remaining)}` : '계산 중') : '—'}</strong></div>
        </div>
      </div>
      <div className="gen-track" title={`세대 진행 (초록 = 합격 해 존재)${segPer > 1 ? ` · 칸 하나 = ${segPer}세대` : ''}`}>
        {Array.from({length: nSeg}).map((_, k) => {
          const g0 = k * segPer, g1 = Math.min(nGen, g0 + segPer);
          const hs = [];
          for (let g = g0; g < g1; g++) if (histByGen[g]) hs.push(histByGen[g]);
          const active = job.status === 'running' && job.generation >= g0 && job.generation < g1 && hs.length < g1 - g0;
          const cls = hs.length ? (hs.some(h => h.n_feasible > 0) ? 'gen-seg--feasible' : 'gen-seg--done') : '';
          const fill = (hs.length + frac) / (g1 - g0);
          return (
            <div key={k} className={`gen-seg ${cls} ${active?'gen-seg--active':''}`}>
              {active && <div className="gen-seg__fill" style={{width:`${Math.max(fill*100, 6)}%`}}/>}
            </div>
          );
        })}
      </div>
    </>
  );
}

/* ===================================================================
   세대 막대 공통: 표시할 세대 수 / 구간 묶기
   =================================================================== */
const MAX_SEG = 120;   // 막대 칸 수 상한. 세대가 더 많으면 여러 세대를 한 칸으로 묶는다

// 진행 중이면 계획 세대 수, 끝났거나 검증 단계면 실제로 진행한 세대까지 (조기 종료 시 빈 칸이 길게 남지 않게)
function shownGenerations(job) {
  const h = job.history || [];
  const ran = h.length ? h[h.length - 1].generation + 1 : 0;
  if (job.status !== 'running') return Math.max(ran, 1);
  // core 검증 단계: 보정 재탐색 전이면 진행한 세대까지, 보정 후면 재탐색 목표 세대까지
  if ((job.verify_n || 0) > 0) return Math.max(ran, (job.corrections || []).length ? job.n_generations : ran, 1);
  return Math.max(job.n_generations || 0, ran, 1);
}

function genBuckets(n) {
  const per = Math.max(1, Math.ceil(n / MAX_SEG));
  return { per, nSeg: Math.ceil(n / per) };
}
