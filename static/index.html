<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUSI Hybrid Rocket Engine Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/vendor/react.production.min.js" crossorigin></script>
  <script src="/vendor/react-dom.production.min.js" crossorigin></script>
  <script src="/vendor/prop-types.min.js" crossorigin></script>
  <script src="/vendor/babel.min.js"></script>
  <script src="/vendor/Recharts.js"></script>
  <style>
    /* ======================================================
       IBM Carbon Design System v11 — White Theme
       ====================================================== */
    :root, [data-theme="light"] {
      --cds-background:              #ffffff;
      --cds-layer-01:                #f4f4f4;
      --cds-layer-02:                #ffffff;
      --cds-layer-accent-01:         #e0e0e0;
      --cds-field-01:                #f4f4f4;
      --cds-border-subtle-00:        #e0e0e0;
      --cds-border-subtle-01:        #c6c6c6;
      --cds-border-strong-01:        #8d8d8d;
      --cds-text-primary:            #161616;
      --cds-text-secondary:          #525252;
      --cds-text-placeholder:        #a8a8a8;
      --cds-text-on-color:           #ffffff;
      --cds-text-on-color-disabled:  #8d8d8d;
      --cds-text-helper:             #6f6f6f;
      --cds-text-inverse:            #ffffff;
      --cds-text-warning:            #8e6a00;
      --cds-background-inverse:      #393939;
      --cds-link-primary:            #0f62fe;
      --cds-interactive:             #0f62fe;
      --cds-interactive-hover:       #0050e6;
      --cds-button-secondary:        #393939;
      --cds-button-secondary-hover:  #474747;
      --cds-button-tertiary:         #0f62fe;
      --cds-button-tertiary-hover:   #0050e6;
      --cds-button-tertiary-hover-text: #ffffff;
      --cds-button-disabled:         #c6c6c6;
      --cds-button-danger:           #da1e28;
      --cds-button-danger-hover:     #b81921;
      --cds-support-error:           #da1e28;
      --cds-support-success:         #24a148;
      --cds-support-warning:         #f1c21b;
      --cds-support-info:            #0043ce;
      --cds-accent-gold:             #b28600;
      --cds-focus:                   #0f62fe;
      --cds-highlight:               #d0e2ff;
      --cds-overlay:                 rgba(22,22,22,0.5);
      --cds-hover-ui:                #e8e8e8;
      --cds-hover-row:               #e8e8e8;
      --cds-notif-error-bg:          #fff1f1;
      --cds-notif-success-bg:        #defbe6;
      --cds-notif-warning-bg:        #fcf4d6;
      --cds-notif-info-bg:           #edf5ff;
      --cds-tag-blue-bg:             #d0e2ff;
      --cds-tag-blue-text:           #0043ce;
      --cds-tag-green-bg:            #a7f0ba;
      --cds-tag-green-text:          #0e6027;
      --cds-tag-red-bg:              #ffd7d9;
      --cds-tag-red-text:            #a2191f;
      --cds-tag-gray-bg:             #e0e0e0;
      --cds-tag-gray-text:           #161616;
      --cds-drop-bg:                 #edf5ff;
      --cds-drop-border:             #0f62fe;
      --cds-log-bg:                  #161616;
      --cds-log-text:                #6fdc8c;
      --cds-log-border:              #24a148;
      --cds-grain-bg:                #ffffff;
      --cds-grain-grid:              #e0e0e0;
      --cds-grain-casing:            #525252;
    }

    /* ======================================================
       IBM Carbon Design System v11 — Gray 100 Theme
       ====================================================== */
    [data-theme="dark"] {
      --cds-background:              #161616;
      --cds-layer-01:                #262626;
      --cds-layer-02:                #393939;
      --cds-layer-accent-01:         #393939;
      --cds-field-01:                #262626;
      --cds-border-subtle-00:        #393939;
      --cds-border-subtle-01:        #525252;
      --cds-border-strong-01:        #6f6f6f;
      --cds-text-primary:            #f4f4f4;
      --cds-text-secondary:          #c6c6c6;
      --cds-text-placeholder:        #6f6f6f;
      --cds-text-on-color:           #ffffff;
      --cds-text-on-color-disabled:  #8d8d8d;
      --cds-text-helper:             #a8a8a8;
      --cds-text-inverse:            #161616;
      --cds-text-warning:            #f1c21b;
      --cds-background-inverse:      #f4f4f4;
      --cds-link-primary:            #78a9ff;
      --cds-interactive:             #0f62fe;
      --cds-interactive-hover:       #0050e6;
      --cds-button-secondary:        #6f6f6f;
      --cds-button-secondary-hover:  #5e5e5e;
      --cds-button-tertiary:         #ffffff;
      --cds-button-tertiary-hover:   #f4f4f4;
      --cds-button-tertiary-hover-text: #161616;
      --cds-button-disabled:         #6f6f6f;
      --cds-button-danger:           #da1e28;
      --cds-button-danger-hover:     #b81921;
      --cds-support-error:           #fa4d56;
      --cds-support-success:         #42be65;
      --cds-support-warning:         #f1c21b;
      --cds-support-info:            #4589ff;
      --cds-accent-gold:             #d2a106;
      --cds-focus:                   #ffffff;
      --cds-highlight:               #001d6c;
      --cds-overlay:                 rgba(0,0,0,0.65);
      --cds-hover-ui:                #333333;
      --cds-hover-row:               #333333;
      --cds-notif-error-bg:          #262626;
      --cds-notif-success-bg:        #262626;
      --cds-notif-warning-bg:        #262626;
      --cds-notif-info-bg:           #262626;
      --cds-tag-blue-bg:             #0043ce;
      --cds-tag-blue-text:           #d0e2ff;
      --cds-tag-green-bg:            #198038;
      --cds-tag-green-text:          #a7f0ba;
      --cds-tag-red-bg:              #da1e28;
      --cds-tag-red-text:            #ffd7d9;
      --cds-tag-gray-bg:             #525252;
      --cds-tag-gray-text:           #f4f4f4;
      --cds-drop-bg:                 #262626;
      --cds-drop-border:             #78a9ff;
      --cds-log-bg:                  #262626;
      --cds-log-text:                #6fdc8c;
      --cds-log-border:              #42be65;
      --cds-grain-bg:                #161616;
      --cds-grain-grid:              #393939;
      --cds-grain-casing:            #c6c6c6;
    }
    [data-theme="dark"] .cds-btn--primary,
    [data-theme="dark"] .cds-btn--secondary,
    [data-theme="dark"] .cds-btn--danger { color: #ffffff; }

    /* ── Smooth theme transition ────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      transition: background-color .2s ease, border-color .2s ease, color .15s ease;
    }
    .cds-accordion__arrow { transition: transform .25s cubic-bezier(.25,.46,.45,.94) !important; }

    /* ======================================================
       Base
       ====================================================== */
    html { font-size:16px; -webkit-font-smoothing:antialiased; }
    body {
      font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--cds-background); color:var(--cds-text-primary);
      line-height:1.5; overflow-x:hidden;
    }

    /* ======================================================
       Animations
       ====================================================== */
    @keyframes fadeInUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn    { from{opacity:0} to{opacity:1} }
    @keyframes progressBar { 0%{width:0%} 50%{width:70%} 90%{width:95%} 100%{width:100%} }
    @keyframes spin { to{transform:rotate(360deg)} }
    .animate-fadeInUp { animation:fadeInUp .4s cubic-bezier(.25,.46,.45,.94) forwards; }
    .animate-fadeIn   { animation:fadeIn .3s ease forwards; }

    /* ======================================================
       Carbon Header (always dark)
       ====================================================== */
    .cds-header {
      position:fixed;top:0;left:0;right:0;z-index:8000;
      height:48px; background:#161616;
      display:flex;align-items:center;padding:0 16px;
      border-bottom:1px solid #393939;
    }
    .cds-header__name { color:#f4f4f4;font-size:14px;font-weight:600;letter-spacing:.16px;display:flex;align-items:center;gap:8px; }
    .cds-header__nav  { margin-left:auto;display:flex;align-items:center;gap:4px; }
    .cds-header__action {
      background:transparent;border:none;color:#c6c6c6;
      height:48px;padding:0 16px;font-family:'IBM Plex Sans',sans-serif;
      font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;
      transition:background .15s,color .15s;
    }
    .cds-header__action:hover { background:#2c2c2c;color:#f4f4f4; }
    .theme-toggle {
      background:transparent;border:1px solid #6f6f6f;
      height:32px;padding:0 12px;
      font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;
      letter-spacing:.32px;cursor:pointer;display:flex;align-items:center;gap:6px;
      color:#c6c6c6;transition:background .15s,border-color .15s,color .15s;
    }
    .theme-toggle:hover { background:#2c2c2c;border-color:#c6c6c6;color:#f4f4f4; }

    /* ======================================================
       Layout
       ====================================================== */
    .app-container { margin-top:48px;display:flex;min-height:calc(100vh - 48px); }
    .config-panel {
      width:400px;min-width:400px;background:var(--cds-layer-01);
      border-right:1px solid var(--cds-border-subtle-00);
      overflow-y:auto;height:calc(100vh - 48px);position:sticky;top:48px;
    }
    .config-panel::-webkit-scrollbar { width:4px; }
    .config-panel::-webkit-scrollbar-thumb { background:var(--cds-border-subtle-01);border-radius:2px; }
    .config-header { padding:24px 24px 16px;border-bottom:1px solid var(--cds-border-subtle-00); }
    .config-header h2 { font-size:20px;font-weight:600;color:var(--cds-text-primary);margin-bottom:4px; }
    .config-header p  { font-size:12px;color:var(--cds-text-helper);letter-spacing:.32px; }
    .config-actions { padding:12px 24px;display:flex;gap:8px;border-bottom:1px solid var(--cds-border-subtle-00);flex-wrap:wrap; }
    .result-panel  { flex:1;padding:32px;overflow-y:auto;min-width:0; }

    /* ======================================================
       Accordion
       ====================================================== */
    .cds-accordion { border-top:1px solid var(--cds-border-subtle-00); }
    .cds-accordion__item { border-bottom:1px solid var(--cds-border-subtle-00); }
    .cds-accordion__heading {
      width:100%;background:transparent;border:none;
      padding:10px 24px 10px 48px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;
      color:var(--cds-text-primary);cursor:pointer;display:flex;align-items:center;
      position:relative;text-align:left;min-height:40px;
      transition:background .15s;letter-spacing:.16px;
    }
    .cds-accordion__heading:hover { background:var(--cds-hover-ui); }
    .cds-accordion__arrow { position:absolute;left:16px;width:16px;height:16px;fill:var(--cds-text-primary); }
    .cds-accordion__item--open .cds-accordion__arrow { transform:rotate(90deg); }
    .cds-accordion__content { padding:0 24px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px; }
    .cds-accordion__content--hidden { display:none; }
    .full-width { grid-column:1/-1; }
    .field-section-label {
      grid-column:1/-1;font-size:11px;font-weight:600;letter-spacing:.64px;
      text-transform:uppercase;color:var(--cds-text-helper);
      padding-top:8px;padding-bottom:2px;
      border-top:1px solid var(--cds-border-subtle-00);
    }

    /* ======================================================
       Form / Input
       ====================================================== */
    .cds-form-item { display:flex;flex-direction:column; }
    .cds-label { font-size:12px;color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px;line-height:16px; }
    .cds-text-input {
      width:100%;height:40px;padding:0 16px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--cds-text-primary);
      background:var(--cds-field-01);border:none;border-bottom:1px solid var(--cds-border-strong-01);
      outline:none;transition:border-color .15s,box-shadow .15s,background .2s;
    }
    .cds-text-input:focus { border-bottom-color:var(--cds-focus);box-shadow:inset 0 -2px 0 0 var(--cds-focus); }
    .cds-text-input::placeholder { color:var(--cds-text-placeholder); }
    .cds-helper-text { font-size:12px;color:var(--cds-text-helper);margin-top:4px;letter-spacing:.32px; }

    /* ======================================================
       Buttons
       ====================================================== */
    .cds-btn {
      display:inline-flex;align-items:center;gap:8px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:400;letter-spacing:.16px;
      border:none;cursor:pointer;padding:11px 64px 11px 16px;min-height:40px;white-space:nowrap;
    }
    .cds-btn svg { fill:currentColor;width:16px;height:16px; }
    .cds-btn--primary  { background:var(--cds-interactive);color:#fff; }
    .cds-btn--primary:hover  { background:var(--cds-interactive-hover); }
    .cds-btn--primary:disabled { background:var(--cds-button-disabled);color:var(--cds-text-on-color-disabled);cursor:not-allowed; }
    .cds-btn--secondary { background:var(--cds-button-secondary);color:#fff; }
    .cds-btn--secondary:hover { background:var(--cds-button-secondary-hover); }
    .cds-btn--tertiary {
      background:transparent;color:var(--cds-button-tertiary);
      border:1px solid var(--cds-button-tertiary);padding:10px 63px 10px 15px;
    }
    .cds-btn--tertiary:hover { background:var(--cds-button-tertiary-hover);color:var(--cds-button-tertiary-hover-text);border-color:var(--cds-button-tertiary-hover); }
    .cds-btn--ghost { background:transparent;color:var(--cds-link-primary);padding:11px 16px; }
    .cds-btn--ghost:hover { background:var(--cds-hover-ui); }
    .cds-btn--compact { padding-right:16px; }
    .cds-btn--icon-only {
      padding:8px;min-height:32px;width:32px;
      background:transparent;border:1px solid var(--cds-border-subtle-01);
      color:var(--cds-text-secondary);cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;
      transition:background .15s,color .15s;
    }
    .cds-btn--icon-only:hover { background:var(--cds-hover-ui);color:var(--cds-text-primary); }
    .cds-btn--icon-only.active { background:var(--cds-interactive);border-color:var(--cds-interactive);color:#fff; }

    /* ======================================================
       Data Table
       ====================================================== */
    .cds-data-table-container { background:var(--cds-layer-01);border:1px solid var(--cds-border-subtle-00); }
    .cds-data-table { width:100%;border-collapse:collapse;font-size:14px; }
    .cds-data-table thead tr { background:var(--cds-layer-accent-01); }
    .cds-data-table th { padding:12px 16px;text-align:left;font-weight:600;font-size:14px;letter-spacing:.16px;color:var(--cds-text-primary);border-bottom:1px solid var(--cds-border-subtle-01); }
    .cds-data-table td { padding:12px 16px;border-bottom:1px solid var(--cds-border-subtle-00);color:var(--cds-text-secondary);font-family:'IBM Plex Mono',monospace;font-size:13px; }
    .cds-data-table tbody tr:hover { background:var(--cds-hover-row); }

    /* ======================================================
       Notifications
       ====================================================== */
    .cds-notification { display:flex;align-items:flex-start;gap:12px;padding:13px 16px;font-size:14px;border-left:3px solid;margin-bottom:16px;animation:fadeInUp .3s ease; }
    .cds-notification--error   { background:var(--cds-notif-error-bg);border-color:var(--cds-support-error); }
    .cds-notification--success { background:var(--cds-notif-success-bg);border-color:var(--cds-support-success); }
    .cds-notification--warning { background:var(--cds-notif-info-bg);border-color:var(--cds-support-warning); }
    .cds-notification__title    { font-weight:600;margin-bottom:2px;color:var(--cds-text-primary); }
    .cds-notification__subtitle { font-size:13px;color:var(--cds-text-secondary); }
    .cds-notification__close    { margin-left:auto;background:none;border:none;cursor:pointer;padding:4px;color:var(--cds-text-secondary); }

    /* ======================================================
       Loading
       ====================================================== */
    .cds-loading-overlay { position:fixed;inset:0;z-index:9000;background:var(--cds-overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeIn .2s ease; }
    .cds-loading-bar-container { width:320px;height:4px;background:#393939;overflow:hidden;margin-top:16px; }
    .cds-loading-bar { height:100%;background:var(--cds-interactive);animation:progressBar 8s ease-out forwards; }
    .cds-loading-text { color:#f4f4f4;font-size:14px;letter-spacing:.16px;margin-top:12px; }
    .cds-loading-spinner { width:48px;height:48px;border:3px solid transparent;border-top-color:var(--cds-interactive);border-radius:50%;animation:spin .8s linear infinite; }

    /* ======================================================
       Tabs
       ====================================================== */
    .cds-tabs { display:flex;border-bottom:1px solid var(--cds-border-subtle-00);margin-bottom:24px; }
    .cds-tab {
      padding:12px 16px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:400;
      color:var(--cds-text-secondary);background:transparent;border:none;cursor:pointer;
      border-bottom:2px solid transparent;letter-spacing:.16px;transition:color .15s,border-color .15s;
    }
    .cds-tab:hover { color:var(--cds-text-primary); }
    .cds-tab--selected { color:var(--cds-text-primary);font-weight:600;border-bottom-color:var(--cds-interactive); }

    /* ======================================================
       Chart Cards
       ====================================================== */
    .chart-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:32px; }
    .chart-card { background:var(--cds-layer-01);border:1px solid var(--cds-border-subtle-00);padding:20px;animation:fadeInUp .4s ease forwards;opacity:0; }
    .chart-card__title    { font-size:14px;font-weight:600;color:var(--cds-text-primary);margin-bottom:4px;letter-spacing:.16px; }
    .chart-card__subtitle { font-size:12px;color:var(--cds-text-helper);margin-bottom:16px;letter-spacing:.32px; }
    .chart-card__stats    { display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--cds-border-subtle-00); }
    .chart-card__stat     { display:flex;flex-direction:column; }
    .chart-card__stat-label { font-size:11px;color:var(--cds-text-helper);letter-spacing:.32px;text-transform:uppercase; }
    .chart-card__stat-value { font-size:14px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary); }

    /* ======================================================
       Grain Visualization
       ====================================================== */
    .grain-layout { display:flex;gap:24px;align-items:flex-start; }
    .grain-svg-wrap {
      flex:0 0 auto;
      background:var(--cds-grain-bg);
      border:1px solid var(--cds-border-subtle-00);
    }
    .grain-controls {
      display:flex;align-items:center;gap:10px;
      padding:12px 16px;
      border-top:1px solid var(--cds-border-subtle-00);
      background:var(--cds-layer-01);
    }
    /* Carbon-style range slider */
    .grain-slider {
      flex:1;-webkit-appearance:none;appearance:none;
      height:4px;background:var(--cds-layer-accent-01);
      outline:none;cursor:pointer;
      transition:background .2s;
    }
    .grain-slider::-webkit-slider-thumb {
      -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
      background:var(--cds-interactive);cursor:pointer;
      box-shadow:0 0 0 3px var(--cds-layer-01);
      transition:background .15s,box-shadow .15s;
    }
    .grain-slider::-webkit-slider-thumb:hover {
      background:var(--cds-interactive-hover);
      box-shadow:0 0 0 4px var(--cds-highlight);
    }
    .grain-slider::-moz-range-thumb {
      width:16px;height:16px;border:none;border-radius:50%;
      background:var(--cds-interactive);cursor:pointer;
    }
    .grain-stats-panel { flex:1;min-width:200px; }
    .grain-stat-card {
      background:var(--cds-layer-01);
      border:1px solid var(--cds-border-subtle-00);
      padding:16px;margin-bottom:12px;
    }
    .grain-stat-card__label {
      font-size:11px;font-weight:600;letter-spacing:.64px;text-transform:uppercase;
      color:var(--cds-text-helper);margin-bottom:6px;
    }
    .grain-stat-card__value {
      font-size:24px;font-weight:300;font-family:'IBM Plex Mono',monospace;
      color:var(--cds-text-primary);letter-spacing:-.48px;
    }
    .grain-stat-card__unit { font-size:13px;color:var(--cds-text-helper);margin-left:4px; }
    .grain-stat-card__delta { font-size:12px;color:var(--cds-support-success);margin-top:4px;font-family:'IBM Plex Mono',monospace; }
    .grain-legend {
      background:var(--cds-layer-01);border:1px solid var(--cds-border-subtle-00);
      padding:14px 16px;margin-bottom:12px;
    }
    .grain-legend__title { font-size:11px;font-weight:600;letter-spacing:.64px;text-transform:uppercase;color:var(--cds-text-helper);margin-bottom:10px; }
    .grain-legend__bar {
      height:8px;border-radius:0;
      background:linear-gradient(90deg, #f1c21b 0%, #ff832b 33%, #da1e28 66%, #750e13 100%);
      margin-bottom:4px;
    }
    .grain-legend__labels { display:flex;justify-content:space-between;font-size:11px;color:var(--cds-text-helper);font-family:'IBM Plex Mono',monospace; }
    .grain-toggle-row { display:flex;gap:8px;margin-bottom:12px; }
    .grain-toggle-btn {

/* ===================================================================
   GRAIN VISUALIZATION COMPONENT
   =================================================================== */
function GrainVisualizer({ grainData }) {
  const { snapshots, extent, port_centers } = grainData;
  const [snapIdx,   setSnapIdx]   = useState(snapshots.length - 1);
  const [showTrail, setShowTrail] = useState(true);
  const [isPlaying, setIsPlaying] = useState(false);
  const timerRef = useRef(null);

  // Cleanup on unmount
  useEffect(() => () => clearInterval(timerRef.current), []);

  // Auto-play
  useEffect(() => {
    clearInterval(timerRef.current);
    if (!isPlaying) return;
    timerRef.current = setInterval(() => {
      setSnapIdx(prev => {
        if (prev >= snapshots.length - 1) { setIsPlaying(false); return prev; }
        return prev + 1;
      });
    }, 350);
  }, [isPlaying, snapshots.length]);

  if (!snapshots || snapshots.length === 0) {
    return (
      <div className="grain-no-data">
        <div className="grain-no-data__title">No grain visualization data</div>
        <div className="grain-no-data__desc">
          Ensure your <code>Rocket</code> class exposes a <code>self.fuel</code> attribute
          with the level-set <code>Fuel</code> instance. Grain snapshots are collected
          automatically during <code>burn()</code> calls.
        </div>
      </div>
    );
  }

  // SVG coordinate system
  const SVG_W   = 400;
  const SVG_H   = 400;
  const PAD     = 28;
  const PLOT    = SVG_W - 2 * PAD;
  const CX      = PAD + PLOT / 2;
  const CY      = PAD + PLOT / 2;
  const R_OUT   = PLOT / 2;

  const sx = x  => PAD + (x / extent + 1) * 0.5 * PLOT;
  const sy = y  => PAD + (1 - y / extent) * 0.5 * PLOT;

  // Build SVG path from physical [[x,y],...] contour
  const toPath = contour => {
    if (!contour || contour.length < 2) return '';
    return contour.map(([x, y], i) =>
      `${i === 0 ? 'M' : 'L'}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`
    ).join(' ') + ' Z';
  };

  // Thermal sequential (Carbon palette): Yellow 30 → Orange 40 → Red 60 → Red 80
  const STOPS = [[241,194,27],[255,131,43],[218,30,40],[117,14,19]];
  const getColor = idx => {
    const t = idx / Math.max(1, snapshots.length - 1);
    const seg = t * (STOPS.length - 1);
    const i   = Math.min(Math.floor(seg), STOPS.length - 2);
    const f   = seg - i;
    const interp = (a, b) => Math.round(a + f * (b - a));
    const [r1,g1,b1] = STOPS[i];
    const [r2,g2,b2] = STOPS[i+1];
    return `rgb(${interp(r1,r2)},${interp(g1,g2)},${interp(b1,b2)})`;
  };

  const current  = snapshots[snapIdx];
  const initial  = snapshots[0];
  const totalGrainArea = Math.PI * extent ** 2;
  const burnedArea     = current.port_area - initial.port_area;
  const maxBurnable    = totalGrainArea - initial.port_area;
  const burnPct        = maxBurnable > 0 ? Math.min(100, (burnedArea / maxBurnable) * 100) : 0;

  const fmt = (v, dec=4) => v.toFixed(dec);

  return (
    <div className="grain-layout">
      {/* ── Left: SVG + controls ────────────────────────────── */}
      <div>
        <div className="grain-svg-wrap">
          <svg width={SVG_W} height={SVG_H} viewBox={`0 0 ${SVG_W} ${SVG_H}`}>
            <defs>
              <pattern id="gg" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="0" cy="0" r="1" fill="var(--cds-grain-grid)" opacity="0.8"/>
              </pattern>
              <clipPath id="grain-clip">
                <circle cx={CX} cy={CY} r={R_OUT}/>
              </clipPath>
            </defs>

            {/* Filled background */}
            <rect x={PAD} y={PAD} width={PLOT} height={PLOT} fill="var(--cds-grain-bg)"/>

            {/* Grid pattern, clipped to casing circle */}
            <g clipPath="url(#grain-clip)">
              <rect x={PAD} y={PAD} width={PLOT} height={PLOT} fill="url(#gg)"/>
            </g>

            {/* Solid fuel fill (phi > 0 region approximated as ring) — visual background */}
            <circle cx={CX} cy={CY} r={R_OUT - 1}
              fill="var(--cds-layer-accent-01)" opacity="0.25"
              clipPath="url(#grain-clip)"/>

            {/* Trail contours */}
            {showTrail && snapshots.slice(0, snapIdx).map((snap, i) => (
              <g key={`t${i}`} clipPath="url(#grain-clip)">
                {snap.contours.map((c, ci) => (
                  <path key={ci} d={toPath(c)}
                    fill="none"
                    stroke={getColor(i)}
                    strokeWidth="1"
                    opacity={0.15 + (i / snapshots.length) * 0.45}
                    strokeLinejoin="round"
                  />
                ))}
              </g>
            ))}

            {/* Current contour — highlighted */}
            <g clipPath="url(#grain-clip)">
              {current.contours.map((c, ci) => (
                <path key={ci} d={toPath(c)}
                  fill="none"
                  stroke={getColor(snapIdx)}
                  strokeWidth="2.5"
                  strokeLinejoin="round"
                  opacity="1"
                />
              ))}
            </g>

            {/* Port center markers */}
            {(port_centers || []).map(([px, py], i) => (
              <g key={`pc${i}`}>
                <line x1={sx(px)-5} y1={sy(py)} x2={sx(px)+5} y2={sy(py)} stroke="var(--cds-text-helper)" strokeWidth="1" opacity="0.6"/>
                <line x1={sx(px)} y1={sy(py)-5} x2={sx(px)} y2={sy(py)+5} stroke="var(--cds-text-helper)" strokeWidth="1" opacity="0.6"/>
              </g>
            ))}

            {/* Outer casing */}
            <circle cx={CX} cy={CY} r={R_OUT - 1}
              fill="none"
              stroke="var(--cds-grain-casing)"
              strokeWidth="2"
              strokeDasharray="6 4"
            />

            {/* Scale bar: 10mm */}
            {(() => {
              const scaleM  = 0.01;
              const scalePx = (scaleM / extent) * (PLOT / 2);
              const bx      = PAD + 8;
              const by      = SVG_H - PAD + 8;
              return (
                <g>
                  <line x1={bx} y1={by} x2={bx + scalePx} y2={by} stroke="var(--cds-text-helper)" strokeWidth="1.5"/>
                  <line x1={bx} y1={by-3} x2={bx} y2={by+3} stroke="var(--cds-text-helper)" strokeWidth="1.5"/>
                  <line x1={bx+scalePx} y1={by-3} x2={bx+scalePx} y2={by+3} stroke="var(--cds-text-helper)" strokeWidth="1.5"/>
                  <text x={bx + scalePx/2} y={by - 5}
                    textAnchor="middle"
                    fontFamily="'IBM Plex Mono',monospace"
                    fontSize="10"
                    fill="var(--cds-text-helper)">10mm</text>
                </g>
              );
            })()}

            {/* Time label top-right */}
            <text x={SVG_W - PAD - 2} y={PAD - 8}
              textAnchor="end"
              fontFamily="'IBM Plex Mono',monospace"
              fontSize="11"
              fill="var(--cds-text-helper)">
              t = {current.t.toFixed(2)} s
            </text>
          </svg>

          {/* Playback bar */}
          <div className="grain-controls">
            {/* Rewind */}
            <button className="cds-btn--icon-only" title="Rewind"
              onClick={() => { setIsPlaying(false); setSnapIdx(0); }}>
              <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                <path d="M1 8l6-6v4h8v4H7v4z"/>
              </svg>
            </button>
            {/* Play/Pause */}
            <button className={`cds-btn--icon-only ${isPlaying ? 'active' : ''}`}
              title={isPlaying ? 'Pause' : 'Play'}
              onClick={() => {
                if (snapIdx >= snapshots.length - 1) setSnapIdx(0);
                setIsPlaying(p => !p);
              }}>
              {isPlaying
                ? <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h3v12H4zm5 0h3v12H9z"/></svg>
                : <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M3 14V2l11 6z"/></svg>
              }
            </button>

            <input
              className="grain-slider"
              type="range"
              min="0"
              max={snapshots.length - 1}
              value={snapIdx}
              onChange={e => { setIsPlaying(false); setSnapIdx(+e.target.value); }}
            />

            <span style={{ fontSize:11, fontFamily:"'IBM Plex Mono',monospace", color:'var(--cds-text-helper)', whiteSpace:'nowrap', minWidth:50 }}>
              {snapIdx + 1} / {snapshots.length}
            </span>
          </div>
        </div>
      </div>

      {/* ── Right: stats panel ─────────────────────────────── */}
      <div className="grain-stats-panel">
        {/* Trail / Single toggle */}
        <div className="grain-toggle-row">
          <button
            className={`grain-toggle-btn ${showTrail ? 'active' : ''}`}
            onClick={() => setShowTrail(true)}>
            Trail
          </button>
          <button
            className={`grain-toggle-btn ${!showTrail ? 'active' : ''}`}

        {/* Stat cards */}
        <div className="grain-stat-card">
          <div className="grain-stat-card__label">Simulation Time</div>
          <div className="grain-stat-card__value">
            {current.t.toFixed(2)}<span className="grain-stat-card__unit">s</span>
          </div>
          <div style={{ fontSize:12, color:'var(--cds-text-helper)', marginTop:4, fontFamily:"'IBM Plex Mono'" }}>
            Step {snapIdx + 1} of {snapshots.length}
          </div>
        </div>

        <div className="grain-stat-card">
          <div className="grain-stat-card__label">Port Area</div>
          <div className="grain-stat-card__value">
            {(current.port_area * 1e4).toFixed(3)}<span className="grain-stat-card__unit">cm²</span>
          </div>
          <div className="grain-stat-card__delta">

          <div className="grain-stat-card__label">Burn Perimeter</div>

            {(current.perimeter * 1000).toFixed(2)}<span className="grain-stat-card__unit">mm</span>
          </div>
          <div style={{ fontSize:12, color:'var(--cds-text-helper)', marginTop:4, fontFamily:"'IBM Plex Mono'" }}>
            Burn area = {(current.perimeter * 1000).toFixed(2)} mm × L

        <div className="grain-stat-card">
          <div className="grain-stat-card__label">Burn Progression</div>
          <div className="grain-stat-card__value">
            {burnPct.toFixed(1)}<span className="grain-stat-card__unit">%</span>
          </div>
          {/* Progress bar */}
          <div style={{ height:6, background:'var(--cds-layer-accent-01)', marginTop:8, position:'relative', overflow:'hidden' }}>
            <div style={{
              position:'absolute', top:0, left:0, bottom:0,
              width:`${burnPct}%`,
              background: `linear-gradient(90deg, #f1c21b, ${getColor(snapIdx)})`,
              transition:'width .3s ease',
            }}/>
          </div>
        </div>

        {/* Color Legend */}
        <div className="grain-legend">
          <div className="grain-legend__title">Time Gradient</div>
          <div className="grain-legend__bar"/>
          <div className="grain-legend__labels">
            <span>t = {snapshots[0].t.toFixed(1)}s</span>
            <span>t = {snapshots[snapshots.length-1].t.toFixed(1)}s</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================
   GRAIN LIVE PREVIEW — client-side t=0 cross-section (no server call)

   core/fuel.py의 _build_port_mask / _build_fin_mask / _build_finocyl_mask와
   동일한 기하 규칙을 marching squares로 재현하여, 파라미터 변경 시 서버
   왕복 없이 즉시(React useMemo) 단면을 그린다. 격자 해상도는 실제
   시뮬레이션(config.grid_size, 기본 300)과 동일하게 맞춘다.
   =================================================================== */
function computeGrainPreview(cfg) {
  const gs = Math.max(2, parseInt(cfg.grid_size) || 300);
  const outerR = Math.max(+cfg.outter_radius || 0.05, 1e-6);
  const innerR = Math.max(+cfg.inner_radius  || 0,    0);
  const grainType = String(cfg.grain_type||'PORT').toUpperCase();

  const dx    = (2 * outerR) / (gs - 1);
  const coord = i => -outerR + i * dx;
  const idx   = (row, col) => row * gs + col;

  const solid = new Uint8Array(gs * gs).fill(1); // 1=solid, 0=gas

  const carveCircle = (cx, cy, r) => {
    if (r <= 0) return;
    for (let row = 0; row < gs; row++) {
      const y = coord(row);
      const dy2 = (y - cy) ** 2;
      if (dy2 > r * r) continue;
      for (let col = 0; col < gs; col++) {
        const x = coord(col);
        if ((x - cx) ** 2 + dy2 <= r * r) solid[idx(row, col)] = 0;
      }
    }
  };

  let portCenters = [[0, 0]];

  if (grainType === 'FIN' || grainType === 'FINOCYL') {
    carveCircle(0, 0, innerR);
    const finNum = Math.max(1, parseInt(cfg.fin_num) || 6);
    const finLen = Math.max(+cfg.fin_length || 0, 1e-9);
    const rootW  = Math.max(+cfg.fin_width || 0, 0);
    const tipRaw = cfg.fin_tip_width;
    const tipW   = (tipRaw === null || tipRaw === undefined || tipRaw === '') ? rootW : Math.max(+tipRaw, 0);
    const halfRoot = rootW / 2, halfTip = tipW / 2;
    const isFinocyl = grainType === 'FINOCYL';
    const straightLen = isFinocyl ? Math.max(finLen - halfTip, 0) : finLen;
    const rectEnd = innerR + straightLen;

    for (let k = 0; k < finNum; k++) {
      const ang = 2 * Math.PI * k / finNum;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      for (let row = 0; row < gs; row++) {
        const y = coord(row);
        for (let col = 0; col < gs; col++) {
          const x = coord(col);
          const xr =  x * ca + y * sa;
          const yr = -x * sa + y * ca;
          if (xr < innerR) continue;
          if (!isFinocyl) {
            if (xr > innerR + finLen) continue;
            const frac  = Math.min(Math.max((xr - innerR) / finLen, 0), 1);
            const halfW = halfRoot + (halfTip - halfRoot) * frac;
            if (Math.abs(yr) <= halfW) solid[idx(row, col)] = 0;
          } else if (xr <= rectEnd) {
            const frac  = straightLen > 1e-12 ? Math.min(Math.max((xr - innerR) / straightLen, 0), 1) : 1;
            const halfW = halfRoot + (halfTip - halfRoot) * frac;
            if (Math.abs(yr) <= halfW) solid[idx(row, col)] = 0;
          } else {
            const ddx = xr - rectEnd;
            if (ddx * ddx + yr * yr <= halfTip * halfTip) solid[idx(row, col)] = 0;
          }
        }
      }
    }
  } else {
    // PORT: 단일 또는 원형 배치 다중 포트
    const portNum = Math.max(1, parseInt(cfg.port_num) || 1);
    if (portNum === 1) {
      portCenters = [[0, 0]];
    } else {
      const pcrRaw = cfg.port_center_radius;
      const rc = (pcrRaw === null || pcrRaw === undefined || pcrRaw === '') ? outerR * 0.5 : +pcrRaw;
      portCenters = Array.from({ length: portNum }, (_, k) => {
        const a = 2 * Math.PI * k / portNum;
        return [rc * Math.cos(a), rc * Math.sin(a)];
      });
    }
    portCenters.forEach(([cx, cy]) => carveCircle(cx, cy, innerR));
  }

  // ── Marching squares (binary, edge-midpoint) → 독립 선분 목록 ─────────
  const EDGE_TABLE = {
    1: [['L', 'B']],  2: [['B', 'R']],  3: [['L', 'R']],
    4: [['T', 'R']],  5: [['L', 'T'], ['B', 'R']],  6: [['T', 'B']],
    7: [['L', 'T']],  8: [['T', 'L']],  9: [['T', 'B']],
    10: [['T', 'R'], ['L', 'B']], 11: [['T', 'R']],
    12: [['L', 'R']], 13: [['B', 'R']], 14: [['L', 'B']],
  };
  const segments = [];
  for (let row = 0; row < gs - 1; row++) {
    const y0 = coord(row), y1 = coord(row + 1);
    for (let col = 0; col < gs - 1; col++) {
      const tl = solid[idx(row, col)],     tr = solid[idx(row, col + 1)];
      const bl = solid[idx(row + 1, col)], br = solid[idx(row + 1, col + 1)];
      const c = tl * 8 + tr * 4 + br * 2 + bl * 1;
      if (c === 0 || c === 15) continue;
      const x0 = coord(col), x1 = coord(col + 1);
      const mid = { T: [(x0 + x1) / 2, y0], B: [(x0 + x1) / 2, y1], L: [x0, (y0 + y1) / 2], R: [x1, (y0 + y1) / 2] };
      for (const [a, b] of EDGE_TABLE[c]) segments.push([mid[a], mid[b]]);
    }
  }

  let gasCells = 0;
  for (let i = 0; i < solid.length; i++) if (solid[i] === 0) gasCells++;
  const portArea  = gasCells * dx * dx;
  const perimeter = segments.reduce((acc, [[x1, y1], [x2, y2]]) => acc + Math.hypot(x2 - x1, y2 - y1), 0);

  return { extent: outerR, portCenters, segments, portArea, perimeter };
}

function GrainLivePreview({ config }) {
  const preview = useMemo(() => {
    try { return computeGrainPreview(config); }
    catch { return null; }
  }, [
    config.grain_type, config.inner_radius, config.outter_radius,
    config.port_num, config.port_center_radius,
    config.fin_num, config.fin_length, config.fin_width, config.fin_tip_width,
    config.grid_size,
  ]);

  if (!preview) return null;

  const SVG_W = 320, SVG_H = 320, PAD = 24;
  const PLOT = SVG_W - 2 * PAD, CX = PAD + PLOT / 2, CY = PAD + PLOT / 2, R_OUT = PLOT / 2;
  const { extent, portCenters, segments, portArea, perimeter } = preview;
  const sx = x => PAD + (x / extent + 1) * 0.5 * PLOT;
  const sy = y => PAD + (1 - y / extent) * 0.5 * PLOT;

  const pathD = segments.map(([[x1, y1], [x2, y2]]) => `M${sx(x1).toFixed(1)},${sy(y1).toFixed(1)} L${sx(x2).toFixed(1)},${sy(y2).toFixed(1)}`).join(' ');

  return (
    <div className="grain-layout">
      <div className="grain-svg-wrap">
        <svg width={SVG_W} height={SVG_H} viewBox={`0 0 ${SVG_W} ${SVG_H}`}>
          <defs>
            <clipPath id="gp-clip"><circle cx={CX} cy={CY} r={R_OUT} /></clipPath>
          </defs>
          <rect x={PAD} y={PAD} width={PLOT} height={PLOT} fill="var(--cds-grain-bg)" />
          <circle cx={CX} cy={CY} r={R_OUT - 1} fill="var(--cds-layer-accent-01)" opacity="0.25" clipPath="url(#gp-clip)" />
          <g clipPath="url(#gp-clip)">
            <path d={pathD} fill="none" stroke="var(--cds-support-error)" strokeWidth="1.8" strokeLinejoin="round" />
          </g>
          {portCenters.map(([px, py], i) => (
            <g key={i}>
              <line x1={sx(px) - 5} y1={sy(py)} x2={sx(px) + 5} y2={sy(py)} stroke="var(--cds-text-helper)" strokeWidth="1" opacity="0.6" />
              <line x1={sx(px)} y1={sy(py) - 5} x2={sx(px)} y2={sy(py) + 5} stroke="var(--cds-text-helper)" strokeWidth="1" opacity="0.6" />
            </g>
          ))}
          <circle cx={CX} cy={CY} r={R_OUT - 1} fill="none" stroke="var(--cds-grain-casing)" strokeWidth="2" strokeDasharray="6 4" />
        </svg>
      </div>
      <div className="grain-stats-panel">
        <div className="grain-stat-card">
          <div className="grain-stat-card__label">Port Area (t=0)</div>
          <div className="grain-stat-card__value">{(portArea * 1e4).toFixed(3)}<span className="grain-stat-card__unit">cm²</span></div>
        </div>
        <div className="grain-stat-card">
          <div className="grain-stat-card__label">Burn Perimeter (t=0)</div>
          <div className="grain-stat-card__value">{(perimeter * 1000).toFixed(2)}<span className="grain-stat-card__unit">mm</span></div>
        </div>
        <div style={{ fontSize: 12, color: 'var(--cds-text-helper)', lineHeight: 1.6 }}>
          클라이언트에서 실제 시뮬레이션과 동일한 해상도({config.grid_size||300}×{config.grid_size||300})로 즉시 계산한 값입니다. 연소 진행 애니메이션은 시뮬레이션 실행 후 Grain Visualization 탭에서 확인하세요.
        </div>
      </div>
    </div>
  );
}
