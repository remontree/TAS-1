/* ===================================================================
   ENGINE CROSS-SECTION SVG
   =================================================================== */
function EngineSection({ config }) {
  const SVG_W = 860, SVG_H = 290;
  const CY = SVG_H / 2;
  const PAD_X = 12, PAD_Y = 36;

  const Rc  = +(config.combution_chamber_radius) || 0.06;
  const Ro  = +(config.outter_radius)            || 0.05;
  const Ri  = +(config.inner_radius)             || 0.01;
  const Rth = +(config.nozzle_throat_radius)     || 0.009;
  const Re  = +(config.nozzle_exit_radius)       || 0.02;
  const Lf  = +(config.fuel_length)              || 0.15;

  const Lpre  = 0.5 * Ro;
  const Lpost = 1.5 * Ro;
  const Lcon  = Math.max((Rc - Rth) / Math.tan(40 * Math.PI / 180), 0.005);
  const Ldiv  = Math.max((Re - Rth) / Math.tan(15 * Math.PI / 180), 0.010);
  const Lnoz  = Lcon + Ldiv;

  const L_total = Lpre + Lf + Lpost + Lnoz;
  const R_max   = Math.max(Rc, Ro, Re);
  const avail_w = SVG_W - 2 * PAD_X - 80; // 80px right margin for R labels
  const avail_h = CY - PAD_Y - 4;
  const sl = avail_w / L_total;
  const sr = avail_h / (R_max * 1.1);

  const x0 = PAD_X;
  const x1 = x0 + Lpre  * sl;
  const x2 = x1 + Lf    * sl;
  const x3 = x2 + Lpost * sl;
  const x4 = x3 + Lcon  * sl;
  const x5 = x4 + Ldiv  * sl;

  const ry = r => CY - r * sr;
  const ly = r => CY + r * sr;

  const stroke  = 'var(--cds-border-strong-01)';
  const mono    = "'IBM Plex Mono',monospace";
  const sans    = "'IBM Plex Sans',sans-serif";
  const textCol = 'var(--cds-text-secondary)';

  // Nozzle paths
  const nozPath = `M${x3},${ry(Rc)} L${x4},${ry(Rth)} L${x5},${ry(Re)} L${x5},${ly(Re)} L${x4},${ly(Rth)} L${x3},${ly(Rc)} Z`;

  // Section vertical guides
  const guides = [x1, x2, x3];

  return (
    <div style={{ marginTop:24, background:'var(--cds-layer-01)', border:'1px solid var(--cds-border-subtle-00)', padding:'8px 4px 4px' }}>
      <div style={{ fontSize:11, fontWeight:600, letterSpacing:'.64px', textTransform:'uppercase', color:'var(--cds-text-helper)', padding:'0 12px 8px' }}>
        Engine Longitudinal Cross-Section (Axial Half-Section · Not to scale)
      </div>
      <svg width="100%" viewBox={`0 0 ${SVG_W} ${SVG_H}`} style={{ display:'block' }}>

        {/* Nozzle (draw first) */}
        <path d={nozPath} fill="var(--cds-layer-accent-01)" stroke={stroke} strokeWidth="1.5"/>

        {/* Chamber outer wall (spans pre + post, same radius Rc) */}
        <rect x={x0} y={ry(Rc)} width={x3-x0} height={Rc*2*sr}
          fill="var(--cds-layer-02)" stroke={stroke} strokeWidth="1.5"/>

        {/* Pre-combustion chamber gas fill */}
        <rect x={x0} y={ry(Rc)} width={x1-x0} height={Rc*2*sr}
          fill="var(--cds-notif-info-bg)" stroke="none"/>

        {/* Grain outer casing fill */}
        <rect x={x1} y={ry(Rc)} width={x2-x1} height={Rc*2*sr}
          fill="var(--cds-layer-02)" stroke="none"/>

        {/* Grain fuel annulus */}
        <rect x={x1} y={ry(Ro)} width={x2-x1} height={Ro*2*sr}
          fill="var(--cds-accent-gold)" fillOpacity="0.13" stroke="none"/>

        {/* Port (gas void) */}
        <rect x={x1} y={ry(Ri)} width={x2-x1} height={Ri*2*sr}
          fill="var(--cds-background)" stroke="none"/>

        {/* Grain outer wall dashed boundary */}
        <rect x={x1} y={ry(Ro)} width={x2-x1} height={Ro*2*sr}
          fill="none" stroke={stroke} strokeWidth="1.2" strokeDasharray="5 3"/>

        {/* Burn surface (port perimeter) */}
        <rect x={x1} y={ry(Ri)} width={x2-x1} height={Ri*2*sr}
          fill="none" stroke="var(--cds-interactive)" strokeWidth="1.5" strokeDasharray="4 2"/>

        {/* Post-combustion gas fill */}
        <rect x={x2} y={ry(Rc)} width={x3-x2} height={Rc*2*sr}
          fill="var(--cds-notif-success-bg)" stroke="none"/>

        {/* Chamber bore lines */}
        <line x1={x0} y1={ry(Rc)} x2={x3} y2={ry(Rc)} stroke={stroke} strokeWidth="1.5"/>
        <line x1={x0} y1={ly(Rc)} x2={x3} y2={ly(Rc)} stroke={stroke} strokeWidth="1.5"/>

        {/* Centerline */}
        <line x1={x0-8} y1={CY} x2={x5+12} y2={CY}
          stroke="var(--cds-support-error)" strokeWidth="1" strokeDasharray="8 4" opacity="0.65"/>

        {/* Throat */}
        <line x1={x4} y1={ry(Rth)} x2={x4} y2={ly(Rth)}
          stroke="var(--cds-support-error)" strokeWidth="1" strokeDasharray="4 2" opacity="0.5"/>

        {/* Section dividers */}
        {guides.map((x,i) => (
          <line key={i} x1={x} y1={PAD_Y-22} x2={x} y2={SVG_H-10}
            stroke="var(--cds-border-subtle-01)" strokeWidth="1" strokeDasharray="4 3" opacity="0.7"/>
        ))}

        {/* Section labels */}
        {[
          [x0, x1, 'Pre-Combustion', `L=${(Lpre*1e3).toFixed(0)} mm`, 'var(--cds-support-info)'],
          [x1, x2, 'Fuel Grain',     `L=${(Lf*1e3).toFixed(0)} mm`,   'var(--cds-accent-gold)'],
          [x2, x3, 'Post-Combustion',`L=${(Lpost*1e3).toFixed(0)} mm`,'var(--cds-support-success)'],
          [x3, x5, 'Nozzle',         `L=${(Lnoz*1e3).toFixed(0)} mm`, 'var(--cds-text-helper)'],
        ].map(([xa, xb, lbl, dim, col]) => (
          <g key={lbl}>
            <text x={(xa+xb)/2} y={PAD_Y-14} textAnchor="middle" fontSize="9" fontWeight="600"
              fill={col} fontFamily={sans}>{lbl}</text>
            <text x={(xa+xb)/2} y={PAD_Y-4} textAnchor="middle" fontSize="8"
              fill="var(--cds-text-helper)" fontFamily={mono}>{dim}</text>
          </g>
        ))}

        {/* Radius dimension lines on right */}
        {[
          [Rc, `Rc=${(Rc*1e3).toFixed(1)}`, 'var(--cds-interactive)'],
          [Ro, `Ro=${(Ro*1e3).toFixed(1)}`, 'var(--cds-accent-gold)'],
          [Ri, `Ri=${(Ri*1e3).toFixed(1)}`, 'var(--cds-support-error)'],
        ].map(([r, lbl, col]) => (
          <g key={lbl}>
            <line x1={x5+8} y1={CY} x2={x5+28} y2={CY - r*sr}
              stroke={col} strokeWidth="0.75" opacity="0.7"/>
            <text x={x5+30} y={CY - r*sr + 3} fontSize="9" fill={col} fontFamily={mono}>{lbl}</text>
          </g>
        ))}
        {/* Throat */}
        <text x={x4} y={ly(Rth)+16} textAnchor="middle" fontSize="8"
          fill="var(--cds-text-helper)" fontFamily={mono}>Rth={( Rth*1e3).toFixed(1)}</text>
        {/* Exit */}
        <text x={x5+2} y={ly(Re)+14} textAnchor="start" fontSize="8"
          fill="var(--cds-text-helper)" fontFamily={mono}>Re={( Re*1e3).toFixed(1)}</text>

        {/* Legend */}
        {[
          ['var(--cds-interactive)', 'Port (burn surface)', x0+4, SVG_H-8],
          ['var(--cds-accent-gold)', 'Solid fuel',          x0+130, SVG_H-8],
          ['var(--cds-border-strong-01)', 'Chamber wall', x0+240, SVG_H-8],
        ].map(([col, lbl, lx, ly2]) => (
          <g key={lbl}>
            <rect x={lx} y={ly2-7} width={10} height={6} fill={col} opacity="0.7"/>
            <text x={lx+14} y={ly2-1} fontSize="8" fill="var(--cds-text-helper)" fontFamily={sans}>{lbl}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

/* ===================================================================
   DESIGN TAB (Tank / Pressure Vessel Designer)
   =================================================================== */
function DesignTab({ config, simResults }) {
  // Find peak combustion pressure from simulation stats
  const statKeys  = simResults?.stats ? Object.keys(simResults.stats) : [];
  const pressKey  = statKeys.find(k => k.toLowerCase().includes('combustion') && k.toLowerCase().includes('pressure'));
  const simMaxP   = pressKey ? simResults.stats[pressKey].max : null;

  const [comp,      setComp]      = useState('chamber');
  const [useSimP,   setUseSimP]   = useState(true);
  const [manualP,   setManualP]   = useState(String(+(config.combution_chamber_pressure) || 3e6));
  const [material,  setMaterial]  = useState('Al 6061-T6');
  const [sf,        setSf]        = useState('2.0');
  const [headType,  setHeadType]  = useState('hemispherical');
  const [boltKey,   setBoltKey]   = useState('M8 · 10.9');
  const [manualBCD, setManualBCD] = useState('');
  const [manualN,   setManualN]   = useState('');

  const P   = useSimP && simMaxP ? simMaxP : (parseFloat(manualP) || 0);
  const SF  = Math.max(parseFloat(sf) || 1.5, 1.0);
  const mat = MATERIALS_DB[material] || MATERIALS_DB['Al 6061-T6'];
  const blt = BOLT_DB[boltKey]       || BOLT_DB['M8 · 10.9'];

  let r_inner, L_cyl, t_config, compLabel;
  if (comp === 'chamber') {
    r_inner    = +(config.combution_chamber_radius) || 0.06;
    L_cyl      = +(config.combution_chamber_length) || 0.25;
    t_config   = null;
    compLabel  = 'Combustion Chamber';
  } else {
    r_inner    = +(config.oxidizer_tank_radius)     || 0.05;
    L_cyl      = +(config.oxidizer_tank_length)     || 1.3;
    t_config   = +(config.oxidizer_tank_tickness)   || 0.005;
    compLabel  = 'Oxidizer Tank';
  }

  const sigma_allow = mat.Sy / SF;

  // Thin-wall minimum hoop thickness
  const t_thin  = P * r_inner / sigma_allow;
  // Thick-wall Lamé (when t_thin > D/20 → r_inner/10)
  const needThick = t_thin > r_inner / 10;
  const t_thick = needThick ? r_inner * (Math.sqrt((sigma_allow + P) / Math.max(sigma_allow - P, 1e-9)) - 1) : t_thin;
  const t_req   = needThick ? t_thick : t_thin;

  // Head thickness
  let t_head;
  if (headType === 'hemispherical') {
    t_head = P * r_inner / (2 * sigma_allow);
  } else if (headType === 'ellipsoidal') {
    t_head = P * r_inner / sigma_allow;                          // 2:1 ASME simplified
  } else {
    t_head = r_inner * Math.sqrt(3 * P / sigma_allow);          // flat plate clamped
  }

  // Stress check at actual (config) or required thickness
  const t_chk   = t_config || t_req;
  const sig_h   = P * r_inner / t_chk;
  const sig_a   = P * r_inner / (2 * t_chk);
  const sig_vm  = Math.sqrt(sig_h**2 - sig_h*sig_a + sig_a**2);
  const FOS     = isFinite(sig_vm) && sig_vm > 0 ? mat.Sy / sig_vm : 999;
  const fos_ok  = FOS >= SF;

  // Mass estimate (cylinder + 2 heads)
  const cylVol  = 2 * Math.PI * r_inner * t_req * L_cyl;
  let headVol;
  if (headType === 'hemispherical') headVol = 4 * Math.PI * r_inner**2 * t_head; // 2 × 2πr²t_head
  else if (headType === 'ellipsoidal') headVol = 2 * Math.PI * r_inner**2 * t_head * 1.14; // approx surface factor
  else headVol = 2 * Math.PI * r_inner**2 * t_head;
  const mass = mat.rho * (cylVol + headVol);

  // Bolt analysis
  const F_ax    = P * Math.PI * r_inner**2;
  const BCD     = parseFloat(manualBCD) || (r_inner + t_req + 0.018) * 2;
  const F_bolt  = 0.7 * blt.Sp * blt.As;                       // 70% proof load
  const n_load  = Math.ceil(F_ax / Math.max(F_bolt, 1e-9));
  const n_circ  = Math.ceil(Math.PI * BCD / (3 * blt.d));
  const n_auto  = Math.max(n_load, n_circ, 4);
  const n_act   = parseInt(manualN) || n_auto;
  const blt_fos = n_act > 0 ? (n_act * F_bolt) / Math.max(F_ax, 1e-9) : 0;

  const mm  = v => isFinite(v) && v >= 0 ? (v*1e3).toFixed(2)+' mm' : '—';
  const mpa = v => isFinite(v)           ? (v/1e6).toFixed(2)+' MPa' : '—';
  const fmtFos = v => !isFinite(v)||v>999 ? '>999' : v.toFixed(2);
  const kn  = v => isFinite(v)           ? (v/1e3).toFixed(2)+' kN'  : '—';

  const Row = ({ label, val, ok, warn }) => {
    const col = ok === true ? 'var(--cds-support-success)'
              : ok === false ? 'var(--cds-support-error)'
              : warn ? 'var(--cds-text-warning)'
              : 'var(--cds-text-primary)';
    return (
      <tr>
        <td style={{ color:'var(--cds-text-secondary)', fontFamily:"'IBM Plex Sans',sans-serif", fontSize:12, padding:'6px 12px' }}>{label}</td>
        <td style={{ textAlign:'right', fontFamily:"'IBM Plex Mono',monospace", fontSize:12, color:col, padding:'6px 12px', fontWeight: ok===true||ok===false ? 600 : 400 }}>{val}</td>
      </tr>
    );
  };

  return (
    <div className="animate-fadeInUp" style={{ paddingBottom:32 }}>
      <div className="section-title">Structural Design Calculator</div>
      <div className="section-subtitle" style={{ marginBottom:20 }}>
        시뮬레이션 결과 기반 실시간 구조 해석 — 재료/볼트 변경 시 즉시 반영됩니다
        {simMaxP ? <span style={{ marginLeft:8, fontFamily:"'IBM Plex Mono',monospace", color:'var(--cds-support-error)', fontSize:13 }}>
          · 시뮬레이션 최대 압력: {(simMaxP/1e6).toFixed(3)} MPa
        </span> : <span style={{ marginLeft:8, fontSize:12, color:'var(--cds-text-helper)' }}>(시뮬레이션 실행 후 최대 압력이 자동 반영됩니다)</span>}
      </div>

      <div className="td-designer-grid" style={{ display:'grid', gridTemplateColumns:'320px 1fr', gap:16, alignItems:'start' }}>

        {/* ── LEFT: Inputs ─────────────────────────────────────── */}
        <div>

          {/* Component selector */}
          <div className="td-card">
            <div className="td-section-hdr">해석 대상</div>
            <div style={{ display:'flex', gap:6 }}>
              {[['chamber','🔥 연소실'],['oxidizer','💧 산화제 탱크']].map(([id, lbl]) => (
                <button key={id} onClick={() => setComp(id)} style={{
                  flex:1, height:34, fontSize:12, fontWeight:500, cursor:'pointer',
                  fontFamily:"'IBM Plex Sans',sans-serif",
                  background: comp===id ? 'var(--cds-interactive)' : 'var(--cds-layer-02)',
                  color: comp===id ? '#fff' : 'var(--cds-text-secondary)',
                  border: `1px solid ${comp===id ? 'var(--cds-interactive)' : 'var(--cds-border-subtle-01)'}`,
                  transition:'all .15s',
                }}>{lbl}</button>
              ))}
            </div>
          </div>

          {/* Design pressure */}
          <div className="td-card">
            <div className="td-section-hdr">설계 압력</div>
            {simMaxP && (
              <div style={{ display:'flex', gap:6, marginBottom:10 }}>
                {[[true,`시뮬 최대 ${(simMaxP/1e6).toFixed(2)} MPa`],[false,'직접 입력']].map(([v, lbl]) => (
                  <button key={String(v)} onClick={() => setUseSimP(v)} style={{
                    flex:1, height:28, fontSize:11, fontWeight:500, cursor:'pointer',
                    fontFamily:"'IBM Plex Sans',sans-serif",
                    background: useSimP===v ? 'var(--cds-interactive)' : 'var(--cds-layer-02)',
                    color: useSimP===v ? '#fff' : 'var(--cds-text-secondary)',
                    border: `1px solid ${useSimP===v ? 'var(--cds-interactive)' : 'var(--cds-border-subtle-01)'}`,
                    transition:'all .15s',
                  }}>{lbl}</button>
                ))}
              </div>
            )}
            {(!useSimP || !simMaxP) && (
              <div className="cds-form-item">
                <label className="cds-label">압력 (Pa)</label>
                <input className="cds-text-input" type="number" step="10000" value={manualP}
                  onChange={e => setManualP(e.target.value)}/>
              </div>
            )}
            {useSimP && simMaxP && (
              <div style={{ fontSize:12, fontFamily:"'IBM Plex Mono',monospace", color:'var(--cds-text-helper)', padding:'4px 0' }}>
                P = {(simMaxP/1e6).toFixed(4)} MPa ({simMaxP.toFixed(0)} Pa)
              </div>
            )}
          </div>

          {/* Material */}
          <div className="td-card">
            <div className="td-section-hdr">재료</div>
            <div className="cds-form-item" style={{ marginBottom:10 }}>
              <label className="cds-label">재료 선택</label>
              <select className="cds-text-input" value={material} onChange={e => setMaterial(e.target.value)}>
                {Object.keys(MATERIALS_DB).map(k => <option key={k}>{k}</option>)}
              </select>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:4, marginBottom:10 }}>
              {[['Sy', mpa(mat.Sy)],['Su', mpa(mat.Su)],['ρ', mat.rho+' kg/m³'],['E', (mat.E/1e9).toFixed(0)+' GPa']].map(([l,v]) => (
                <div key={l} style={{ fontSize:11 }}>
                  <span style={{ fontFamily:"'IBM Plex Mono',monospace", fontWeight:600, color:'var(--cds-text-primary)' }}>{l} </span>
                  <span style={{ color:'var(--cds-text-helper)' }}>{v}</span>
                </div>
              ))}
            </div>
            <div className="cds-form-item">
              <label className="cds-label">안전계수 (SF)</label>
              <input className="cds-text-input" type="number" step="0.1" min="1.0" value={sf}
                onChange={e => setSf(e.target.value)}/>
            </div>
          </div>

          {/* Head type */}
          <div className="td-card">
            <div className="td-section-hdr">엔드캡 형상</div>
            {[
              ['hemispherical','반구형 (Hemispherical)','t = PR / 2σ_allow'],
              ['ellipsoidal',  '2:1 타원형 (Ellipsoidal)','t = PR / σ_allow'],
              ['flat',         '평판 (Flat Plate)','t = R√(3P/σ_allow)'],
            ].map(([id, lbl, formula]) => (
              <label key={id} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8, cursor:'pointer' }}>
                <input type="radio" checked={headType===id} onChange={() => setHeadType(id)}
                  style={{ accentColor:'var(--cds-interactive)', flexShrink:0 }}/>
                <span style={{ fontSize:12, color:'var(--cds-text-primary)', flex:1 }}>{lbl}</span>
                <span style={{ fontSize:10, color:'var(--cds-text-helper)', fontFamily:"'IBM Plex Mono',monospace" }}>{formula}</span>
              </label>
            ))}
          </div>

          {/* Bolt */}
          <div className="td-card">
            <div className="td-section-hdr">플랜지 볼트</div>
            <div className="cds-form-item" style={{ marginBottom:10 }}>
              <label className="cds-label">볼트 규격</label>
              <select className="cds-text-input" value={boltKey} onChange={e => setBoltKey(e.target.value)}>
                {Object.keys(BOLT_DB).map(k => <option key={k}>{k}</option>)}
              </select>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              <div className="cds-form-item">
                <label className="cds-label">볼트 원 지름 BCD (m)</label>
                <input className="cds-text-input" type="number" step="0.001" min="0"
                  placeholder={((r_inner+t_req+0.018)*2).toFixed(3)+' (자동)'}
                  value={manualBCD} onChange={e => setManualBCD(e.target.value)}/>
              </div>
              <div className="cds-form-item">
                <label className="cds-label">볼트 수 (빈칸=자동)</label>
                <input className="cds-text-input" type="number" step="1" min="4"
                  placeholder={n_auto+' (자동)'}
                  value={manualN} onChange={e => setManualN(e.target.value)}/>
              </div>
            </div>
          </div>
        </div>

        {/* ── RIGHT: Results ───────────────────────────────────── */}
        <div>

          {/* Wall thickness & stress */}
          <div className="td-card">
            <div className="td-section-hdr">실린더 벽 해석 — {compLabel}</div>
            <div style={{ fontSize:11, fontFamily:"'IBM Plex Mono',monospace", color:'var(--cds-text-helper)', marginBottom:10 }}>
              r_i = {(r_inner*1e3).toFixed(1)} mm · P = {(P/1e6).toFixed(3)} MPa · SF = {SF.toFixed(1)}
              {needThick && <span style={{ color:'var(--cds-support-info)', marginLeft:8 }}>⚠ 두꺼운 벽 → Lamé 방정식 사용</span>}
            </div>
            <table className="td-result-table" style={{ width:'100%' }}>
              <thead>
                <tr>
                  <th style={{ padding:'6px 12px', fontSize:11 }}>항목</th>
                  <th style={{ padding:'6px 12px', fontSize:11, textAlign:'right' }}>결과</th>
                </tr>
              </thead>
              <tbody>
                <Row label="최소 벽 두께 (후프 지배)" val={mm(t_req)} ok={isFinite(t_req)&&t_req>0}/>
                <Row label="엔드캡 두께" val={mm(t_head)}/>
                {t_config && <Row label={`현재 설정 두께 (config)`} val={mm(t_config)} ok={t_config>=t_req} warn={t_config<t_req}/>}
                <Row label="후프 응력 σ_θ" val={mpa(sig_h)} ok={sig_h<=sigma_allow}/>
                <Row label="축방향 응력 σ_a" val={mpa(sig_a)}/>
                <Row label="Von Mises 응력 σ_vm" val={mpa(sig_vm)} ok={fos_ok} warn={FOS>=1&&!fos_ok}/>
                <Row label="안전계수 FOS" val={fmtFos(FOS)} ok={fos_ok} warn={FOS>=1&&!fos_ok}/>
                <Row label="허용 응력 σ_allow" val={mpa(sigma_allow)}/>
                <Row label="질량 추정 (실린더 + 헤드 2개)" val={isFinite(mass) ? mass.toFixed(3)+' kg' : '—'}/>
              </tbody>
            </table>
          </div>

          {/* Bolt analysis */}
          <div className="td-card">
            <div className="td-section-hdr">플랜지 볼트 해석</div>
            <div style={{ fontSize:11, fontFamily:"'IBM Plex Mono',monospace", color:'var(--cds-text-helper)', marginBottom:10 }}>
              F_axial = {kn(F_ax)} · 볼트당 허용력 = {kn(F_bolt)}
            </div>
            <table className="td-result-table" style={{ width:'100%' }}>
              <thead>
                <tr>
                  <th style={{ padding:'6px 12px', fontSize:11 }}>항목</th>
                  <th style={{ padding:'6px 12px', fontSize:11, textAlign:'right' }}>결과</th>
                </tr>
              </thead>
              <tbody>
                <Row label="압력 축방향 하중" val={kn(F_ax)}/>
                <Row label="필요 볼트 수 (하중 기준)" val={n_load}/>
                <Row label="필요 볼트 수 (3d 피치 기준)" val={n_circ}/>
                <Row label="최소 필요 볼트 수" val={n_auto}/>
                <Row label="볼트 원 지름 BCD" val={mm(BCD)}/>
                <Row label="볼트 피치 (간격)" val={mm(Math.PI*BCD/n_act)} ok={Math.PI*BCD/n_act>=3*blt.d}/>
                <Row label="볼트 그룹 FOS" val={fmtFos(blt_fos)} ok={blt_fos>=1.5} warn={blt_fos>=1&&blt_fos<1.5}/>
              </tbody>
            </table>
          </div>

          {/* Geometry reference */}
          <div className="td-card">
            <div className="td-section-hdr">형상 참조 (Config)</div>
            <div style={{ fontSize:11, color:'var(--cds-text-helper)', lineHeight:1.8, fontFamily:"'IBM Plex Mono',monospace" }}>
              {comp === 'chamber' ? <>
                R_chamber = {(r_inner*1e3).toFixed(1)} mm · L = {(L_cyl*1e3).toFixed(0)} mm<br/>
                목표 연소실 압력 = {((+(config.combution_chamber_pressure)||0)/1e6).toFixed(2)} MPa<br/>
                목 반지름 = {((+(config.nozzle_throat_radius)||0)*1e3).toFixed(2)} mm<br/>
                면적비 = {(((+(config.nozzle_exit_radius)||0.02)**2) / ((+(config.nozzle_throat_radius)||0.009)**2)).toFixed(2)}
              </> : <>
                R_tank = {(r_inner*1e3).toFixed(1)} mm · L = {(L_cyl*1e3).toFixed(0)} mm<br/>
                Config 두께 = {((+(config.oxidizer_tank_tickness)||0)*1e3).toFixed(2)} mm<br/>
                산화제 종류 = {config.oxidizer || '—'} · 질량 = {config.oxidizer_M||'—'} kg
              </>}
            </div>
          </div>
        </div>
      </div>

      {/* Engine cross-section visualization */}
      <EngineSection config={config}/>
    </div>
  );
}

/* ===================================================================
   CUSTOM TOOLTIP
   =================================================================== */
function CustomTooltip({ active, payload, label }) {
  if (active && payload && payload.length) {
    return (
      <div className="custom-tooltip">
        <div className="label">Time: {Number(label).toFixed(3)}s</div>
        <div className="value">{payload[0].name}: {Number(payload[0].value).toFixed(6)}</div>
      </div>
    );
  }
  return null;
}

/* ===================================================================
   ACCORDION ITEM
   =================================================================== */
function AccordionItem({ group, config, onChange, defaultOpen }) {
  const [open, setOpen] = useState(defaultOpen || false);
  return (
    <div className="cds-accordion__item">
      <button
        className={`cds-accordion__heading ${open ? 'cds-accordion__item--open' : ''}`}
        onClick={() => setOpen(!open)}
        style={open ? { background:'var(--cds-hover-ui)' } : {}}
      >
        <ChevronRight />
        <span style={{ marginRight:8, opacity:0.7 }}>{group.icon}</span>
        {group.label}
        <span style={{ marginLeft:'auto', fontSize:12, color:'var(--cds-text-helper)' }}>{group.fields.length} fields</span>
      </button>
      <div className={`cds-accordion__content ${!open ? 'cds-accordion__content--hidden' : ''}`}>
        {group.fields.map(field => (
          <React.Fragment key={field.key}>
            {field.divider && <div className="field-section-label">{field.divider}</div>}
            <div className={`cds-form-item ${field.fullWidth ? 'full-width' : ''}`}>
              <label className="cds-label">
                {field.label}
                {field.unit && <span style={{ color:'var(--cds-text-placeholder)' }}> ({field.unit})</span>}
              </label>
              {field.type === 'select' ? (
                <select
                  className="cds-text-input"
                  value={config[field.key] ?? ''}
                  onChange={e => onChange(field.key, e.target.value)}
                >
                  {field.options.map(opt => (
                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                  ))}
                </select>
              ) : (
                <input
                  className="cds-text-input"
                  type={field.type === 'text' ? 'text' : 'number'}
                  step={field.step || 'any'}
                  value={config[field.key] ?? ''}
                  onChange={e => {
                    const v = field.type === 'text' ? e.target.value
                      : field.type === 'integer' ? parseInt(e.target.value) || 0
                      : parseFloat(e.target.value) || 0;
                    onChange(field.key, v);
                  }}
                />
              )}
              {field.helper && <div className="cds-helper-text">{field.helper}</div>}
            </div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ===================================================================
   THEME TOGGLE
   =================================================================== */
function ThemeToggle({ theme, onToggle }) {
  return (
    <button className="theme-toggle" onClick={onToggle}>
      {theme === 'dark' ? <SunIcon /> : <MoonIcon />}
      {theme === 'dark' ? 'Light' : 'Dark'}
    </button>
  );
}

/* ===================================================================
   MAIN APP
   =================================================================== */
function App() {
  const [config,
    setConfig]     = useState({...DEFAULT_CONFIG});
  const [rocketName, setRocketName] = useState('TAS-I');
  const [results,    setResults]    = useState(null);
  const [loading,    setLoading]    = useState(false);
  const [error,      setError]      = useState(null);
  const [success,    setSuccess]    = useState(null);
  const [termination, setTermination] = useState(null);
  const [preTab,      setPreTab]      = useState('structure');
  const [grainSubTab, setGrainSubTab] = useState('result');
  const [simulatedConfig, setSimulatedConfig] = useState(null);
  const [activeTab,  setActiveTab]  = useState('charts');
  const [simLog,     setSimLog]     = useState('');
  const [theme,      setTheme]      = useState(() => {
    try { return localStorage.getItem('tusi-theme')||'light'; } catch { return 'light'; }
  });
  const fileInputRef = useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('tusi-theme', theme); } catch {}
  }, [theme]);

  useEffect(() => {
    // MDO 페이지의 "Open in Simulator" 로 넘어온 최적 형상이 있으면 그것을 우선 로드
    let handoff = null;
    try { handoff = JSON.parse(localStorage.getItem('tusi-mdo-handoff') || 'null'); localStorage.removeItem('tusi-mdo-handoff'); } catch {}
    const handoffName = handoff && Object.keys(handoff)[0];
    if (handoffName && handoff[handoffName]) {
      setRocketName(handoffName);
      setConfig({...DEFAULT_CONFIG, ...handoff[handoffName]});
      setSuccess('MDO 최적 형상을 불러왔습니다');
      return;
    }
    fetch('/api/default-config', { credentials: 'same-origin' })
      .then(r=>{ if(!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        const name = Object.keys(data)[0];
        if (name && data[name]) { setRocketName(name); setConfig({...DEFAULT_CONFIG,...data[name]}); }
      }).catch(()=>{});
  }, []);

  const handleConfigChange = useCallback((key, value) => setConfig(prev=>({...prev,[key]:value})), []);

  const handleSimulate = useCallback(async () => {
    setLoading(true); setError(null); setSuccess(null); setResults(null); setSimLog(''); setTermination(null);
    // 시뮬레이션은 그레인/유량 설정에 따라 수 분까지 걸릴 수 있다.
    // fetch()는 기본적으로 타임아웃이 없어서, 중간의 어떤 네트워크 장비가
    // 유휴 연결을 조용히 끊더라도 사용자에게는 원인 불명의 실패로 보인다 —
    // 서버(gunicorn --timeout)와 맞춰 최대 5분까지는 명시적으로 기다리고,
    // 초과 시 타임아웃임을 분명히 알리도록 AbortController를 사용한다.
    const SIMULATE_TIMEOUT_MS = 5 * 60 * 1000;
    const controller = new AbortController();
    const timeoutId  = setTimeout(() => controller.abort(), SIMULATE_TIMEOUT_MS);
    try {
      const res  = await fetch('/api/simulate', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({[rocketName]:config}), signal: controller.signal });
      const data = await res.json();
      if (!res.ok || data.error) { setError(data.error||'Simulation failed'); if(data.stderr)setSimLog(data.stderr); return; }
      setResults(data);
      setSimulatedConfig(config);
      setGrainSubTab('result');
      const impulseSuffix = data.total_impulse != null ? ` · 총 임펄스 ${data.total_impulse.toFixed(2)} N·s` : '';
      setSuccess(`완료 — ${data.row_count}개 데이터 포인트, ${data.grain?.snapshots?.length||0}개 그레인 스냅샷${impulseSuffix}`);
      if(data.termination?.code) setTermination(data.termination);
      if(data.stdout) setSimLog(data.stdout);
      setActiveTab('charts');
    } catch(err) {
      if (err.name === 'AbortError') setError('시뮬레이션이 5분 제한 시간을 초과했습니다. dt를 늘리거나 simt를 줄여서 다시 시도해보세요.');
      else setError(err.message||'Network error');
    } finally { clearTimeout(timeoutId); setLoading(false); }
  }, [config, rocketName]);

  const handleDownloadJSON = useCallback(() => {
    const blob = new Blob([JSON.stringify({[rocketName]:config},null,4)], {type:'application/json'});
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='rocket.json'; a.click(); URL.revokeObjectURL(url);
  }, [config, rocketName]);

  const handleUploadJSON = useCallback(e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const name = Object.keys(data)[0];
        if(name && data[name]) { setRocketName(name); setConfig(prev=>({...prev,...data[name]})); setSuccess(`"${file.name}" 로드 완료`); }
        else setError('Invalid JSON format');
      } catch { setError('JSON 파싱 실패'); }
    };
    reader.readAsText(file); e.target.value='';
  }, []);

  // 보고서: 실행한 형상 + 결과를 넘기고 새 탭에서 인쇄(PDF 저장) — 그래프용 데이터는 최대 1200점으로 줄임
  const openReport = () => {
    if (!results) return;
    const n = results.row_count || (results.data['Time (s)'] || []).length;
    const step = Math.max(1, Math.ceil(n / 1200));
    const data = {};
    for (const c of results.columns) data[c] = (results.data[c] || []).filter((_, i) => i % step === 0 || i === n - 1);
    const payload = {
      name: rocketName, config: simulatedConfig || config, generated: Date.now(),
      groups: FIELD_GROUPS.map(g => ({ label: g.label, fields: g.fields.map(f => ({ key: f.key, label: f.label, unit: f.unit || '' })) })),
      results: { columns: results.columns, data, stats: results.stats, total_impulse: results.total_impulse,
                 steady_state: results.steady_state, injector_dp: results.injector_dp, termination: results.termination,
                 row_count: results.row_count },
    };
    try { localStorage.setItem('tusi-report', JSON.stringify(payload)); }
    catch (e) { alert('보고서 데이터를 저장하지 못했습니다: ' + e.message); return; }
    window.open('/report?print=1', '_blank');
  };

  const chartData = results ? (() => {
    const time = results.data['Time (s)']||[];
    return { time, columns: results.columns.filter(c=>c!=='Time (s)') };
  })() : null;

  const tickFill   = theme==='dark' ? '#c6c6c6' : '#525252';
  const gridStroke = theme==='dark' ? '#393939' : '#e0e0e0';
  const hasGrain   = results?.grain?.snapshots?.length > 0;

  const TabBtn = ({id, icon, label, badge}) => (
    <button className={`cds-tab ${activeTab===id?'cds-tab--selected':''}`} onClick={()=>setActiveTab(id)}>
      <span style={{display:'inline-flex',alignItems:'center',gap:6}}>
        {icon} {label}
        {badge != null && (
          <span style={{background:'var(--cds-interactive)',color:'#fff',fontSize:10,fontWeight:600,padding:'1px 6px',borderRadius:10,fontFamily:"'IBM Plex Mono',monospace"}}>{badge}</span>
        )}
      </span>
    </button>
  );

  return (
    <>
      <header className="cds-header">
        <div className="cds-header__name">
          <img src="/static/logo.png" alt="" style={{height:24,opacity:0.9}}/>
          TUSI Hybrid Rocket Engine Simulator
        </div>
        <nav className="cds-header__nav">
          <span style={{color:'#c6c6c6',fontSize:12,marginRight:8,fontFamily:"'IBM Plex Mono',monospace"}}>{rocketName}</span>
          {results && (
            <button className="cds-header__action" onClick={()=>window.open('/api/download-csv','_blank')}>
              <DownloadIcon/> CSV
            </button>
          )}
          {results && (
            <button className="cds-header__action" onClick={openReport} title="형상 개요 · 통계 · 결과 그래프 · 도면 PDF (화이트 테마)">
              <ReportIcon/> Report
            </button>
          )}
          <a className="theme-toggle" href="/mdo" style={{textDecoration:'none',marginRight:0}}><DnaIcon/> MDO</a>
          <a className="theme-toggle" href="/surrogate" style={{textDecoration:'none',marginRight:8}}><BoltIcon/> Surrogate</a>
          <a className="theme-toggle" href="/training" style={{textDecoration:'none',marginRight:8}}><ChartIcon/> Training</a>
          <a className="theme-toggle" href="/drawing" style={{textDecoration:'none',marginRight:8}}
             onClick={()=>{ try { localStorage.setItem('tusi-drawing-config', JSON.stringify({[rocketName]:config})); } catch {} }}><RulerIcon/> Drawing</a>
          <button className="theme-toggle" onClick={()=>setTheme(t=>t==='light'?'dark':'light')}>
            {theme==='dark'?<SunIcon/>:<MoonIcon/>}
            {theme==='dark'?'Light':'Dark'}
          </button>
        </nav>
      </header>

      <div className="app-container">
        <aside className="config-panel">
          <div className="config-header">
            <h2>Engine Configuration</h2>
            <p>하이브리드 로켓 엔진 파라메터 설정</p>
          </div>
          <div style={{padding:'16px 24px 0'}}>
            <div className="cds-form-item">
              <label className="cds-label">Rocket Designation</label>
              <input className="cds-text-input" type="text" value={rocketName} onChange={e=>setRocketName(e.target.value)}/>
            </div>
          </div>
          <div className="config-actions">
            <button className="cds-btn cds-btn--primary cds-btn--compact" onClick={handleSimulate} disabled={loading}><PlayIcon/> Run Simulation</button>
            <button className="cds-btn cds-btn--tertiary cds-btn--compact" onClick={handleDownloadJSON}><DownloadIcon/> Save JSON</button>
            <button className="cds-btn cds-btn--ghost cds-btn--compact" onClick={()=>fileInputRef.current?.click()}><UploadIcon/> Load JSON</button>
            <input ref={fileInputRef} type="file" accept=".json" className="file-input-hidden" onChange={handleUploadJSON}/>
          </div>
          <div className="cds-accordion">
            {FIELD_GROUPS.map((g,i)=><AccordionItem key={g.id} group={g} config={config} onChange={handleConfigChange} defaultOpen={i===0}/>)}
          </div>
        </aside>

        <main className="result-panel">
          {error && (
            <div className="cds-notification cds-notification--error animate-fadeInUp">
              <div><div className="cds-notification__title">오류</div><div className="cds-notification__subtitle">{error}</div></div>
              <button className="cds-notification__close" onClick={()=>setError(null)}>✕</button>
            </div>
          )}
          {success && (
            <div className="cds-notification cds-notification--success animate-fadeInUp">
              <div><div className="cds-notification__title">완료</div><div className="cds-notification__subtitle">{success}</div></div>
              <button className="cds-notification__close" onClick={()=>setSuccess(null)}>✕</button>
            </div>
          )}
          {termination && (
            <div className={`cds-notification ${termination.code === 'TIME_LIMIT_REACHED' ? 'cds-notification--success' : 'cds-notification--warning'} animate-fadeInUp`}>
              <div>
                <div className="cds-notification__title">
                  {termination.code === 'TIME_LIMIT_REACHED' ? '종료 사유 · 정상 종료' : '종료 사유 · 조기 종료'}
                </div>
                <div className="cds-notification__subtitle">
                  [{termination.code}] {termination.message}
                </div>
              </div>
              <button className="cds-notification__close" onClick={()=>setTermination(null)}>✕</button>
            </div>
          )}
          {results?.injector_dp && (
            <div className={`cds-notification ${results.injector_dp.ok ? 'cds-notification--success' : 'cds-notification--warning'} animate-fadeInUp`}>
              <div>
                <div className="cds-notification__title">
                  {results.injector_dp.ok ? '인젝터 차압 · 기준 만족' : '인젝터 차압 · 기준 미달 (역류 위험)'}
                </div>
                <div className="cds-notification__subtitle">
                  연소 중 최소 (Pt−Pc)/Pc = {(results.injector_dp.min_ratio * 100).toFixed(1)}% @ {results.injector_dp.min_time.toFixed(2)} s
                  · 평균 {(results.injector_dp.avg_ratio * 100).toFixed(1)}% · 기준 ≥ {(results.injector_dp.limit * 100).toFixed(0)}%
                  {!results.injector_dp.ok && ' — 인젝터 면적을 줄이거나 노즐 목을 키워 챔버압을 낮추세요'}
                </div>
              </div>
            </div>
          )}
          {simLog && <div className="sim-log">{simLog}</div>}

          {!results && !loading && (
            <>
              <div className="cds-tabs">
                <button className={`cds-tab ${preTab==='structure'?'cds-tab--selected':''}`} onClick={()=>setPreTab('structure')}>
                  <span style={{display:'inline-flex',alignItems:'center',gap:6}}><WrenchIcon/> Structure</span>
                </button>
                <button className={`cds-tab ${preTab==='grain'?'cds-tab--selected':''}`} onClick={()=>setPreTab('grain')}>
                  <span style={{display:'inline-flex',alignItems:'center',gap:6}}><GrainIcon/> Grain Preview</span>
                </button>
              </div>

              {preTab === 'grain' && (
                <div className="animate-fadeIn" style={{paddingTop:24}}>
                  <div className="section-title">Grain Shape Preview (t=0)</div>
                  <div className="section-subtitle" style={{marginBottom:24}}>
                    {(config.grain_type||'PORT')} 타입 · 파라미터를 바꾸면 실시간으로 반영됩니다
                  </div>
                  <GrainLivePreview config={config}/>
                </div>
              )}

              {preTab === 'structure' && (
                <div className="animate-fadeIn" style={{paddingTop:24}}>
                  <DesignTab config={config} simResults={null}/>
                </div>
              )}
            </>
          )}

          {results && chartData && (
            <div className="animate-fadeIn">
              <div className="cds-tabs">
                <TabBtn id="charts" icon={<ChartIcon/>} label="Performance Charts"/>
                <TabBtn id="table"  icon={<TableIcon/>} label="Statistics Table"/>
                <TabBtn id="grain"  icon={<GrainIcon/>} label="Grain Visualization" badge={hasGrain?results.grain.snapshots.length:null}/>
                <TabBtn id="design" icon={<WrenchIcon/>} label="Tank Design"/>
              </div>

              {/* Charts tab */}
              {activeTab==='charts' && (
                <div className="chart-grid">
                  {chartData.columns.map((col,idx) => {
                    const values = results.data[col]||[];
                    const data   = chartData.time.map((t,i)=>({time:t,value:values[i] ?? (col.startsWith('Injector') ? null : 0)}));
                    const stat   = results.stats[col];
                    const palette = theme==='dark' ? CHART_COLORS_DARK : CHART_COLORS_LIGHT;
                    const color  = palette[idx%palette.length];
                    const unit   = col.match(/\(([^)]+)\)/)?.[1]||'';
                    // 추력·Isp 차트에는 정상상태 구간을 음영으로 표시하고 그 구간 평균을 함께 보여준다
                    const ss     = results.steady_state;
                    const ssVal  = !ss ? null : col.startsWith('Thrust (') ? ss.thrust_avg_ss : col.startsWith('Isp') ? ss.isp_ss : null;
                    return (
                      <div key={col} className="chart-card" style={{animationDelay:`${idx*.05}s`}}>
                        <div className="chart-card__title">{col.split('(')[0].trim()}</div>
                        {unit && <div className="chart-card__subtitle">Unit: {unit}</div>}
                        <ResponsiveContainer width="100%" height={200}>
                          <LineChart data={data} margin={{top:5,right:10,left:10,bottom:5}}>
                            <CartesianGrid strokeDasharray="3 3" stroke={gridStroke}/>
                            <XAxis dataKey="time" type="number" domain={['dataMin','dataMax']} tick={{fontSize:11,fill:tickFill,fontFamily:"'IBM Plex Mono',monospace"}} tickFormatter={v=>Number(v).toFixed(1)} stroke={gridStroke}/>
                            {ssVal != null && <ReferenceArea x1={ss.ss_start} x2={ss.ss_end} fill={color} fillOpacity={0.08} stroke="none"
                              label={{ value:'정상상태', position:'insideTopLeft', fontSize:10, fill:tickFill }}/>}
                            <YAxis tick={{fontSize:11,fill:tickFill,fontFamily:"'IBM Plex Mono',monospace"}} tickFormatter={v=>{
                              if(Math.abs(v)>=1e6)return(v/1e6).toFixed(1)+'M';
                              if(Math.abs(v)>=1e3)return(v/1e3).toFixed(1)+'k';
                              if(Math.abs(v)<.01&&v!==0)return v.toExponential(1);
                              return v.toFixed(2);
                            }} stroke={gridStroke} width={60}/>
                            <Tooltip content={<CustomTooltip/>}/>
                            <Line type="monotone" dataKey="value" stroke={color} strokeWidth={2} dot={false} name={col} activeDot={{r:4,fill:color,stroke:theme==='dark'?'#161616':'#ffffff',strokeWidth:2}}/>
                          </LineChart>
                        </ResponsiveContainer>
                        {stat && (
                          <div className="chart-card__stats">
                            {[['Min',stat.min],['Max',stat.max],['Avg',stat.avg], ...(ssVal != null ? [['정상상태 Avg', ssVal]] : [])].map(([l,v])=>(
                              <div className="chart-card__stat" key={l}>
                                <span className="chart-card__stat-label">{l}</span>
                                <span className="chart-card__stat-value">{formatVal(v)}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Table tab */}
              {activeTab==='table' && (
                <div className="animate-fadeInUp">
                  <div className="section-title">Performance Statistics</div>
                  <div className="section-subtitle">{results.row_count}개 타임스텝 기준 요약</div>

                  <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:20}}>
                    {results.total_impulse != null && (
                      <div className="grain-stat-card" style={{width:280}}>
                        <div className="grain-stat-card__label">Total Impulse</div>
                        <div className="grain-stat-card__value">
                          {formatVal(results.total_impulse)}<span className="grain-stat-card__unit">N·s</span>
                        </div>
                      </div>
                    )}
                    {results.steady_state && (
                      <>
                        <div className="grain-stat-card" style={{width:280}}>
                          <div className="grain-stat-card__label">정상상태 평균 추력</div>
                          <div className="grain-stat-card__value">
                            {formatVal(results.steady_state.thrust_avg_ss)}<span className="grain-stat-card__unit">N</span>
                          </div>
                        </div>
                        <div className="grain-stat-card" style={{width:280}}>
                          <div className="grain-stat-card__label">정상상태 평균 비추력 Isp</div>
                          <div className="grain-stat-card__value">
                            {results.steady_state.isp_ss != null ? results.steady_state.isp_ss.toFixed(2) : '—'}<span className="grain-stat-card__unit">s</span>
                          </div>
                        </div>
                        <div className="grain-stat-card" style={{width:280}}>
                          <div className="grain-stat-card__label">정상상태 구간</div>
                          <div className="grain-stat-card__value">
                            {results.steady_state.ss_start.toFixed(2)}–{results.steady_state.ss_end.toFixed(2)}<span className="grain-stat-card__unit">s ({results.steady_state.ss_duration.toFixed(2)} s)</span>
                          </div>
                        </div>
                      </>
                    )}
                    {results.injector_dp && (
                      <div className="grain-stat-card" style={{width:280}}>
                        <div className="grain-stat-card__label">Min Injector Δp / Pc (연소 중)</div>
                        <div className="grain-stat-card__value" style={{color: results.injector_dp.ok ? undefined : 'var(--cds-support-error)'}}>
                          {(results.injector_dp.min_ratio * 100).toFixed(1)}<span className="grain-stat-card__unit">% (기준 ≥ {(results.injector_dp.limit * 100).toFixed(0)}%)</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="cds-data-table-container">
                    <table className="cds-data-table">
                      <thead><tr><th>Parameter</th><th style={{textAlign:'right'}}>Min</th><th style={{textAlign:'right'}}>Max</th><th style={{textAlign:'right'}}>Avg</th></tr></thead>
                      <tbody>
                        {Object.entries(results.stats).map(([col,stat],i)=>(
                          <tr key={col} className="animate-fadeInUp" style={{animationDelay:`${i*.03}s`}}>
                            <td style={{fontFamily:"'IBM Plex Sans',sans-serif",fontWeight:500,color:'var(--cds-text-primary)'}}>{col}</td>
                            <td style={{textAlign:'right'}}>{formatVal(stat.min)}</td>
                            <td style={{textAlign:'right'}}>{formatVal(stat.max)}</td>
                            <td style={{textAlign:'right'}}>{formatVal(stat.avg)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* Grain tab */}
              {activeTab==='grain' && (
                <div className="animate-fadeInUp">
                  <div className="section-title">Grain Burn-back Visualization</div>
                  <div className="section-subtitle" style={{marginBottom:16}}>
                    Level-set 기반 횡단면 변화{hasGrain&&` · ${results.grain.snapshots.length}개 스냅샷 · ±${(results.grain.extent*1000).toFixed(1)} mm`}
                  </div>

                  <div className="grain-toggle-row" style={{maxWidth:420}}>
                    <button className={`grain-toggle-btn ${grainSubTab==='result'?'active':''}`} onClick={()=>setGrainSubTab('result')}>
                      Simulated Result
                    </button>
                    <button className={`grain-toggle-btn ${grainSubTab==='preview'?'active':''}`} onClick={()=>setGrainSubTab('preview')}>
                      Current Config Preview
                    </button>
                  </div>

                  {grainSubTab==='result' && <GrainVisualizer grainData={results.grain}/>}

                  {grainSubTab==='preview' && (
                    <div className="animate-fadeIn">
                      {simulatedConfig && JSON.stringify(simulatedConfig) !== JSON.stringify(config) && (
                        <div className="cds-notification cds-notification--warning" style={{marginBottom:16}}>
                          <div>
                            <div className="cds-notification__title">설정이 변경됨</div>
                            <div className="cds-notification__subtitle">실행된 시뮬레이션 이후 파라미터가 바뀌었습니다. 아래는 현재(미실행) 설정 기준 t=0 단면이며, 반영하려면 다시 실행하세요.</div>
                          </div>
                        </div>
                      )}
                      <GrainLivePreview config={config}/>
                    </div>
                  )}
                </div>
              )}

              {/* Design tab */}
              {activeTab==='design' && (
                <DesignTab config={config} simResults={results}/>
              )}
            </div>
          )}
        </main>
      </div>

      {loading && (
        <div className="cds-loading-overlay">
          <div className="cds-loading-spinner"/>
          <div className="cds-loading-bar-container"><div className="cds-loading-bar"/></div>
          <div className="cds-loading-text">시뮬레이션 실행 중…</div>
        </div>
      )}
    </>
  );
}

function formatVal(v) {
  if(v==null||isNaN(v)) return '—';
  if(Math.abs(v)>=1e6) return (v/1e6).toFixed(4)+' M';
  if(Math.abs(v)>=1e3) return (v/1e3).toFixed(4)+' k';
  if(Math.abs(v)<0.001&&v!==0) return v.toExponential(4);
  return v.toFixed(6);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</html>
