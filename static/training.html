<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUSI — Training Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/vendor/react.production.min.js" crossorigin></script>
  <script src="/vendor/react-dom.production.min.js" crossorigin></script>
  <script src="/vendor/prop-types.min.js" crossorigin></script>
  <script src="/vendor/babel.min.js"></script>
  <script src="/vendor/Recharts.js"></script>
  <style>
    /* ======================================================
       IBM Carbon Design System v11 — White Theme
       ====================================================== */
    :root, [data-theme="light"] {
      --cds-background:              #ffffff;
      --cds-layer-01:                #f4f4f4;
      --cds-layer-02:                #ffffff;
      --cds-layer-accent-01:         #e0e0e0;
      --cds-field-01:                #f4f4f4;
      --cds-border-subtle-00:        #e0e0e0;
      --cds-border-subtle-01:        #c6c6c6;
      --cds-border-strong-01:        #8d8d8d;
      --cds-text-primary:            #161616;
      --cds-text-secondary:          #525252;
      --cds-text-placeholder:        #a8a8a8;
      --cds-text-on-color:           #ffffff;
      --cds-text-on-color-disabled:  #8d8d8d;
      --cds-text-helper:             #6f6f6f;
      --cds-text-inverse:            #ffffff;
      --cds-text-warning:            #8e6a00;
      --cds-background-inverse:      #393939;
      --cds-link-primary:            #0f62fe;
      --cds-interactive:             #0f62fe;
      --cds-interactive-hover:       #0050e6;
      --cds-button-secondary:        #393939;
      --cds-button-secondary-hover:  #474747;
      --cds-button-tertiary:         #0f62fe;
      --cds-button-tertiary-hover:   #0050e6;
      --cds-button-tertiary-hover-text: #ffffff;
      --cds-button-disabled:         #c6c6c6;
      --cds-button-danger:           #da1e28;
      --cds-button-danger-hover:     #b81921;
      --cds-support-error:           #da1e28;
      --cds-support-success:         #24a148;
      --cds-support-warning:         #f1c21b;
      --cds-support-info:            #0043ce;
      --cds-accent-gold:             #b28600;
      --cds-focus:                   #0f62fe;
      --cds-highlight:               #d0e2ff;
      --cds-overlay:                 rgba(22,22,22,0.5);
      --cds-hover-ui:                #e8e8e8;
      --cds-hover-row:               #e8e8e8;
      --cds-notif-error-bg:          #fff1f1;
      --cds-notif-success-bg:        #defbe6;
      --cds-notif-warning-bg:        #fcf4d6;
      --cds-notif-info-bg:           #edf5ff;
      --cds-tag-blue-bg:             #d0e2ff;
      --cds-tag-blue-text:           #0043ce;
      --cds-tag-green-bg:            #a7f0ba;
      --cds-tag-green-text:          #0e6027;
      --cds-tag-red-bg:              #ffd7d9;
      --cds-tag-red-text:            #a2191f;
      --cds-tag-gray-bg:             #e0e0e0;
      --cds-tag-gray-text:           #161616;
      --cds-drop-bg:                 #edf5ff;
      --cds-drop-border:             #0f62fe;
      --cds-log-bg:                  #161616;
      --cds-log-text:                #6fdc8c;
      --cds-log-border:              #24a148;
      --cds-grain-bg:                #ffffff;
      --cds-grain-grid:              #e0e0e0;
      --cds-grain-casing:            #525252;
    }

    /* ======================================================
       IBM Carbon Design System v11 — Gray 100 Theme
       ====================================================== */
    [data-theme="dark"] {
      --cds-background:              #161616;
      --cds-layer-01:                #262626;
      --cds-layer-02:                #393939;
      --cds-layer-accent-01:         #393939;
      --cds-field-01:                #262626;
      --cds-border-subtle-00:        #393939;
      --cds-border-subtle-01:        #525252;
      --cds-border-strong-01:        #6f6f6f;
      --cds-text-primary:            #f4f4f4;
      --cds-text-secondary:          #c6c6c6;
      --cds-text-placeholder:        #6f6f6f;
      --cds-text-on-color:           #ffffff;
      --cds-text-on-color-disabled:  #8d8d8d;
      --cds-text-helper:             #a8a8a8;
      --cds-text-inverse:            #161616;
      --cds-text-warning:            #f1c21b;
      --cds-background-inverse:      #f4f4f4;
      --cds-link-primary:            #78a9ff;
      --cds-interactive:             #0f62fe;
      --cds-interactive-hover:       #0050e6;
      --cds-button-secondary:        #6f6f6f;
      --cds-button-secondary-hover:  #5e5e5e;
      --cds-button-tertiary:         #ffffff;
      --cds-button-tertiary-hover:   #f4f4f4;
      --cds-button-tertiary-hover-text: #161616;
      --cds-button-disabled:         #6f6f6f;
      --cds-button-danger:           #da1e28;
      --cds-button-danger-hover:     #b81921;
      --cds-support-error:           #fa4d56;
      --cds-support-success:         #42be65;
      --cds-support-warning:         #f1c21b;
      --cds-support-info:            #4589ff;
      --cds-accent-gold:             #d2a106;
      --cds-focus:                   #ffffff;
      --cds-highlight:               #001d6c;
      --cds-overlay:                 rgba(0,0,0,0.65);
      --cds-hover-ui:                #333333;
      --cds-hover-row:               #333333;
      --cds-notif-error-bg:          #262626;
      --cds-notif-success-bg:        #262626;
      --cds-notif-warning-bg:        #262626;
      --cds-notif-info-bg:           #262626;
      --cds-tag-blue-bg:             #0043ce;
      --cds-tag-blue-text:           #d0e2ff;
      --cds-tag-green-bg:            #198038;
      --cds-tag-green-text:          #a7f0ba;
      --cds-tag-red-bg:              #da1e28;
      --cds-tag-red-text:            #ffd7d9;
      --cds-tag-gray-bg:             #525252;
      --cds-tag-gray-text:           #f4f4f4;
      --cds-drop-bg:                 #262626;
      --cds-drop-border:             #78a9ff;
      --cds-log-bg:                  #262626;
      --cds-log-text:                #6fdc8c;
      --cds-log-border:              #42be65;
      --cds-grain-bg:                #161616;
      --cds-grain-grid:              #393939;
      --cds-grain-casing:            #c6c6c6;
    }

    /* ── Smooth theme transition ────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      transition: background-color .2s ease, border-color .2s ease, color .15s ease;
    }
    .cds-accordion__arrow { transition: transform .25s cubic-bezier(.25,.46,.45,.94) !important; }

    html { font-size:16px; -webkit-font-smoothing:antialiased; }
    body {
      font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--cds-background); color:var(--cds-text-primary);
      line-height:1.5; overflow-x:hidden;
    }

    @keyframes fadeInUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn    { from{opacity:0} to{opacity:1} }
    @keyframes spin { to{transform:rotate(360deg)} }
    .animate-fadeInUp { animation:fadeInUp .4s cubic-bezier(.25,.46,.45,.94) forwards; }
    .animate-fadeIn   { animation:fadeIn .3s ease forwards; }

    /* ======================================================
       Carbon Header (always dark) — 시뮬레이터 페이지와 동일
       ====================================================== */
    .cds-header {
      position:fixed;top:0;left:0;right:0;z-index:8000;
      height:48px; background:#161616;
      display:flex;align-items:center;padding:0 16px;
      border-bottom:1px solid #393939;
    }
    .cds-header__name { color:#f4f4f4;font-size:14px;font-weight:600;letter-spacing:.16px;display:flex;align-items:center;gap:8px; }
    .cds-header__divider { color:#6f6f6f;font-weight:300;margin:0 2px; }
    .cds-header__page { color:#c6c6c6;font-weight:400; }
    .cds-header__nav  { margin-left:auto;display:flex;align-items:center;gap:8px; }
    .theme-toggle {
      background:transparent;border:1px solid #6f6f6f;
      height:32px;padding:0 12px;text-decoration:none;
      font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;
      letter-spacing:.32px;cursor:pointer;display:flex;align-items:center;gap:6px;
      color:#c6c6c6;transition:background .15s,border-color .15s,color .15s;
    }
    .theme-toggle:hover { background:#2c2c2c;border-color:#c6c6c6;color:#f4f4f4; }
    .theme-toggle--active { background:#0f62fe;border-color:#0f62fe;color:#ffffff; }
    .theme-toggle--active:hover { background:#0050e6;border-color:#0050e6;color:#ffffff; }

    /* ======================================================
       Layout
       ====================================================== */
    .app-container { margin-top:48px;display:flex;min-height:calc(100vh - 48px); }
    .config-panel {
      width:400px;min-width:400px;background:var(--cds-layer-01);
      border-right:1px solid var(--cds-border-subtle-00);
      overflow-y:auto;height:calc(100vh - 48px);position:sticky;top:48px;
    }
    .config-panel::-webkit-scrollbar { width:4px; }
    .config-panel::-webkit-scrollbar-thumb { background:var(--cds-border-subtle-01);border-radius:2px; }
    .config-header { padding:24px 24px 16px;border-bottom:1px solid var(--cds-border-subtle-00); }
    .config-header h2 { font-size:20px;font-weight:600;color:var(--cds-text-primary);margin-bottom:4px; }
    .config-header p  { font-size:12px;color:var(--cds-text-helper);letter-spacing:.32px; }
    .config-actions { padding:12px 24px;display:flex;gap:8px;border-bottom:1px solid var(--cds-border-subtle-00);flex-wrap:wrap; }
    .result-panel  { flex:1;padding:32px;overflow-y:auto;min-width:0; }

    /* ======================================================
       Accordion
       ====================================================== */
    .cds-accordion { border-top:1px solid var(--cds-border-subtle-00); }
    .cds-accordion__item { border-bottom:1px solid var(--cds-border-subtle-00); }
    .cds-accordion__heading {
      width:100%;background:transparent;border:none;
      padding:10px 24px 10px 48px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;
      color:var(--cds-text-primary);cursor:pointer;display:flex;align-items:center;
      position:relative;text-align:left;min-height:40px;
      transition:background .15s;letter-spacing:.16px;
    }
    .cds-accordion__heading:hover { background:var(--cds-hover-ui); }
    .cds-accordion__arrow { position:absolute;left:16px;width:16px;height:16px;fill:var(--cds-text-primary); }
    .cds-accordion__item--open .cds-accordion__arrow { transform:rotate(90deg); }
    .cds-accordion__content { padding:0 24px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px; }
    .full-width { grid-column:1/-1; }

    /* ======================================================
       Form / Input
       ====================================================== */
    .cds-form-item { display:flex;flex-direction:column; }
    .cds-label { font-size:12px;color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px;line-height:16px; }
    .cds-text-input {
      width:100%;height:40px;padding:0 16px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--cds-text-primary);
      background:var(--cds-field-01);border:none;border-bottom:1px solid var(--cds-border-strong-01);
      outline:none;transition:border-color .15s,box-shadow .15s,background .2s;
    }
    .cds-text-input:focus { border-bottom-color:var(--cds-focus);box-shadow:inset 0 -2px 0 0 var(--cds-focus); }
    .cds-text-input:disabled { color:var(--cds-text-placeholder);cursor:not-allowed; }
    .cds-helper-text { font-size:12px;color:var(--cds-text-helper);margin-top:4px;letter-spacing:.32px; }
    .config-panel .cds-text-input { background:var(--cds-layer-02); }
    .input-unit-wrap { position:relative; }
    .input-unit-wrap .cds-text-input { padding-right:56px;font-family:'IBM Plex Mono',monospace; }
    .input-unit { position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--cds-text-helper);font-family:'IBM Plex Mono',monospace;pointer-events:none; }
    .target-block { padding:16px 24px;display:flex;flex-direction:column;gap:16px; }
    .target-derived {
      display:flex;justify-content:space-between;align-items:center;
      padding:10px 12px;background:var(--cds-layer-02);border-left:3px solid var(--cds-interactive);
      font-size:12px;color:var(--cds-text-secondary);letter-spacing:.32px;
    }
    .target-derived strong { font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary);font-weight:500;font-size:13px; }

    /* ======================================================
       Buttons
       ====================================================== */
    .cds-btn {
      display:inline-flex;align-items:center;gap:8px;
      font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:400;letter-spacing:.16px;
      border:none;cursor:pointer;padding:11px 64px 11px 16px;min-height:40px;white-space:nowrap;
    }
    .cds-btn svg { fill:currentColor;width:16px;height:16px; }
    .cds-btn--primary  { background:var(--cds-interactive);color:#fff; }
    .cds-btn--primary:hover  { background:var(--cds-interactive-hover); }
    .cds-btn--primary:disabled { background:var(--cds-button-disabled);color:var(--cds-text-on-color-disabled);cursor:not-allowed; }
    .cds-btn--danger { background:var(--cds-button-danger);color:#fff; }
    .cds-btn--danger:hover { background:var(--cds-button-danger-hover); }
    .cds-btn--danger:disabled { background:var(--cds-button-disabled);color:var(--cds-text-on-color-disabled);cursor:not-allowed; }
    .cds-btn--tertiary {
      background:transparent;color:var(--cds-button-tertiary);
      border:1px solid var(--cds-button-tertiary);padding:10px 63px 10px 15px;
    }
    .cds-btn--tertiary:hover { background:var(--cds-button-tertiary-hover);color:var(--cds-button-tertiary-hover-text);border-color:var(--cds-button-tertiary-hover); }
    .cds-btn--ghost { background:transparent;color:var(--cds-link-primary);padding:11px 16px; }
    .cds-btn--ghost:hover { background:var(--cds-hover-ui); }
    .cds-btn--compact { padding-right:16px; }

    /* ======================================================
       Data Table / Notifications / Tags
       ====================================================== */
    .cds-data-table { width:100%;border-collapse:collapse;font-size:13px; }
    .cds-data-table th { padding:8px 12px;text-align:left;font-weight:600;font-size:12px;letter-spacing:.16px;color:var(--cds-text-primary);border-bottom:1px solid var(--cds-border-subtle-01);background:var(--cds-layer-accent-01); }
    .cds-data-table td { padding:7px 12px;border-bottom:1px solid var(--cds-border-subtle-00);color:var(--cds-text-secondary);font-family:'IBM Plex Mono',monospace;font-size:12px; }
    .cds-data-table td.num { text-align:right;color:var(--cds-text-primary); }
    .cds-data-table td.label { font-family:'IBM Plex Sans',sans-serif; }
    .cds-data-table tbody tr:hover { background:var(--cds-hover-row); }

    .cds-notification { display:flex;align-items:flex-start;gap:12px;padding:13px 16px;font-size:14px;border-left:3px solid;margin-bottom:16px;animation:fadeInUp .3s ease; }
    .cds-notification--error   { background:var(--cds-notif-error-bg);border-color:var(--cds-support-error); }
    .cds-notification--success { background:var(--cds-notif-success-bg);border-color:var(--cds-support-success); }
    .cds-notification--warning { background:var(--cds-notif-warning-bg);border-color:var(--cds-support-warning); }
    .cds-notification__title    { font-weight:600;margin-bottom:2px;color:var(--cds-text-primary); }
    .cds-notification__subtitle { font-size:13px;color:var(--cds-text-secondary); }
    .cds-notification__close    { margin-left:auto;background:none;border:none;cursor:pointer;padding:4px;color:var(--cds-text-secondary); }

    .cds-tag { display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;letter-spacing:.32px; }
    .cds-tag--blue  { background:var(--cds-tag-blue-bg);color:var(--cds-tag-blue-text); }
    .cds-tag--green { background:var(--cds-tag-green-bg);color:var(--cds-tag-green-text); }
    .cds-tag--red   { background:var(--cds-tag-red-bg);color:var(--cds-tag-red-text); }
    .cds-tag--gray  { background:var(--cds-tag-gray-bg);color:var(--cds-tag-gray-text); }
    .tag-dot { width:8px;height:8px;border-radius:50%;background:currentColor; }
    .tag-dot--live { animation:livePulse 1.2s ease-in-out infinite; }
    @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.7)} }

    /* ======================================================
       Cards / sections
       ====================================================== */
    .chart-card { background:var(--cds-layer-01);border:1px solid var(--cds-border-subtle-00);padding:20px;min-width:0;animation:fadeInUp .4s ease both; }
    .chart-card__title    { font-size:14px;font-weight:600;color:var(--cds-text-primary);margin-bottom:4px;letter-spacing:.16px;display:flex;align-items:center;gap:8px; }
    .chart-card__subtitle { font-size:12px;color:var(--cds-text-helper);margin-bottom:16px;letter-spacing:.32px; }
    .grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px; }
    .section-title    { font-size:20px;font-weight:600;color:var(--cds-text-primary);margin-bottom:8px; }
    .section-subtitle { font-size:14px;color:var(--cds-text-secondary);margin-bottom:24px; }
    .mono { font-family:'IBM Plex Mono',monospace; }
    .recharts-tooltip-wrapper { z-index:100; }
    .custom-tooltip { background:var(--cds-background-inverse);color:var(--cds-text-inverse);padding:10px 14px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3); }
    .custom-tooltip .label { font-weight:600;margin-bottom:4px; }
    .custom-tooltip .value { font-family:'IBM Plex Mono',monospace; }

    /* ======================================================
       MDO — run status
       ====================================================== */
    .run-status { display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px; }
    .run-status__gen { font-size:28px;font-weight:300;letter-spacing:-.4px;color:var(--cds-text-primary); }
    .run-status__gen span { font-size:14px;color:var(--cds-text-helper);margin-left:4px;font-weight:400; }
    .run-status__meta { margin-left:auto;display:flex;gap:24px;font-size:12px;color:var(--cds-text-helper);letter-spacing:.32px; }
    .run-status__meta strong { display:block;font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary);font-size:16px;font-weight:400; }
    .gen-track { display:flex;gap:2px;height:8px;margin-bottom:24px; }
    .cds-select {
      width:100%;height:40px;padding:0 12px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--cds-text-primary);
      background:var(--cds-layer-02);border:none;border-bottom:1px solid var(--cds-border-strong-01);outline:none;cursor:pointer;
    }
    .cds-select:disabled { color:var(--cds-text-placeholder);cursor:not-allowed; }
    .mode-switch { display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--cds-border-strong-01); }
    .mode-switch button {
      height:40px;border:none;background:transparent;color:var(--cds-text-secondary);font:inherit;font-size:13px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .mode-switch button + button { border-left:1px solid var(--cds-border-strong-01); }
    .mode-switch button.active { background:var(--cds-interactive);color:#fff; }
    .mode-switch button:disabled { cursor:not-allowed;opacity:.6; }
    .strat-track { display:flex;gap:2px;height:28px;margin:4px 0 12px; }
    .strat-seg { flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden; }
    .strat-seg > div { display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-family:'IBM Plex Mono',monospace;min-height:0; }
    .strat-seg--empty { background:var(--cds-layer-accent-01); }
    .strat-legend { display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--cds-text-secondary); }
    .strat-legend i { display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px; }
    .strat-legend strong { font-family:'IBM Plex Mono',monospace;color:var(--cds-text-primary);font-weight:500;margin-left:4px; }
    .gen-seg { flex:1;background:var(--cds-layer-accent-01);position:relative;overflow:hidden; }
    .gen-seg--done { background:var(--cds-interactive); }
    .gen-seg--feasible { background:var(--cds-support-success); }
    .gen-seg__fill { position:absolute;inset:0 auto 0 0;background:var(--cds-interactive);transition:width .4s ease; }
    .gen-seg--active .gen-seg__fill {
      background-image:repeating-linear-gradient(-45deg, rgba(255,255,255,.28) 0 6px, transparent 6px 12px);
      background-size:17px 17px;animation:stripes .6s linear infinite;
    }
    @keyframes stripes { to { background-position:17px 0; } }

    /* KPI tiles */
    .kpi-row { display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--cds-border-subtle-00);border:1px solid var(--cds-border-subtle-00);margin-bottom:16px; }
    .kpi { background:var(--cds-layer-01);padding:16px;min-width:0; }
    .kpi__label { font-size:11px;font-weight:600;letter-spacing:.64px;text-transform:uppercase;color:var(--cds-text-helper);margin-bottom:6px; }

/* ===================================================================

   =================================================================== */
function ChartTip({ active, payload, label, unit, digits = 3, xLabel = '스텝' }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="tip">
      <div className="tip__x">{xLabel} {fmtInt(label)}</div>
      {payload.filter(p => p.value != null && !String(p.dataKey).startsWith('_raw')).map(p => (
        <div key={p.dataKey} className="tip__row">
          <i style={{ background: p.color }}/>{p.name}
          <strong>{typeof p.value === 'number' ? fmt(p.value, digits) : p.value}{unit ? ` ${unit}` : ''}</strong>
        </div>
      ))}
    </div>
  );
}

// 지표 하나짜리 소형 차트 (원값은 연하게, 이동 평균은 진하게). ref: 기준선 {y, label}
function MetricChart({ rows, k, title, desc, unit, digits = 3, colors, refLine, height = 150, smoothK = 7, yDomain, transform }) {
  const data = useMemo(() => {
    const vals = rows.map(r => r[k] == null ? null : (transform ? transform(r[k]) : r[k]));
    const tmp = rows.map((r, i) => ({ step: r.step, v: vals[i] }));
    const sm = smooth(tmp, 'v', smoothK);
    return tmp.map((r, i) => ({ step: r.step, _raw: r.v, v: sm[i] }));
  }, [rows, k]);
  const cur = data.length ? data[data.length - 1].v : null;
  return (
    <div className="mini">
      <div className="mini__head">
        <div className="mini__title">{title}</div>
        <div className="mini__value">{fmt(cur, digits)}{unit && <span>{unit}</span>}</div>
      </div>
      <div className="mini__desc">{desc}</div>
      <ResponsiveContainer width="100%" height={height}>
        <LineChart data={data} margin={{ top: 6, right: 8, bottom: 0, left: 0 }}>
          <CartesianGrid stroke={colors.grid} vertical={false}/>
          <XAxis dataKey="step" type="number" domain={['dataMin', 'dataMax']} tickFormatter={fmtK}
                 tick={{ fontSize: 11, fill: colors.tick }} stroke={colors.grid} tickLine={false}/>
          <YAxis domain={yDomain || ['auto', 'auto']} width={44} tick={{ fontSize: 11, fill: colors.tick }}
                 stroke={colors.grid} tickLine={false} tickFormatter={tickFmt}/>
          {refLine && <ReferenceLine y={refLine.y} stroke={colors.ref} strokeWidth={1}
                                     label={{ value: refLine.label, position: 'insideTopRight', fontSize: 10, fill: colors.tick }}/>}
          <Tooltip content={<ChartTip unit={unit} digits={digits}/>} cursor={{ stroke: colors.tick, strokeWidth: 1 }}/>
          <Line dataKey="_raw" stroke={colors.main} strokeOpacity={0.22} strokeWidth={1} dot={false} isAnimationActive={false}/>
          <Line dataKey="v" name="이동 평균" stroke={colors.main} strokeWidth={2} dot={false} isAnimationActive={false}/>
        </LineChart>
      </ResponsiveContainer>
    </div>
  );
}

/* ===================================================================
   TRAINING HEALTH — 지표별 정상/주의/위험 판정
   =================================================================== */
function healthChecks(live, evals, status) {
  const cfg = status?.config || {};
  const tkl = cfg.target_kl || 0.02;
  const checks = [];
  const kl = meanLast(live, 'train/approx_kl', 5);
  if (kl != null) checks.push(kl <= tkl * 1.5
    ? ['ok', '정책 변화 폭', `KL ${fmt(kl, 4)} — 업데이트당 정책이 적당히 바뀜 (목표 ≤ ${tkl})`]
    : ['warn', '정책 변화 폭', `KL ${fmt(kl, 4)} — 목표 ${tkl} 초과. 학습률을 낮추면 안정됨`]);
  const ev = meanLast(live, 'train/explained_variance', 5);
  if (ev != null) checks.push(ev >= 0.5
    ? ['ok', '가치함수', `설명 분산 ${fmt(ev, 2)} — 보상을 잘 예측함`]
    : ev >= 0 ? ['warn', '가치함수', `설명 분산 ${fmt(ev, 2)} — 아직 보상 예측이 약함 (초반에는 정상)`]
              : ['bad', '가치함수', `설명 분산 ${fmt(ev, 2)} — 예측이 평균보다도 나쁨`]);
  const std = meanLast(live, 'direct/action_std', 3);
  if (status?.kind === 'direct') {
    if (std != null) checks.push(std >= 0.08
      ? ['ok', '탐색 (행동 표준편차)', `${fmt(std, 3)} — 이동량을 아직 다양하게 시도 중 (시작 ${fmt(Math.exp(-0.5), 2)})`]
      : ['warn', '탐색 (행동 표준편차)', `${fmt(std, 3)} — 행동이 거의 결정적으로 굳음. 조기 수렴 주의`]);
  }
  const ent = status?.kind === 'direct' ? null : meanLast(live, 'train/entropy_loss', 3);
  if (ent != null) {
    const h = -ent, max = Math.log(8);
    checks.push(h >= 0.5
      ? ['ok', '탐색 (엔트로피)', `${fmt(h, 2)} / 최대 ${fmt(max, 2)} — 여러 전략을 계속 시도 중`]
      : ['warn', '탐색 (엔트로피)', `${fmt(h, 2)} / 최대 ${fmt(max, 2)} — 전략이 거의 하나로 굳음. 조기 수렴 주의`]);
  }
  const cf = meanLast(live, 'train/clip_fraction', 5);
  if (cf != null) checks.push(cf <= 0.3
    ? ['ok', '클리핑 비율', `${fmt(cf * 100, 1)}% — 정상 범위 (≤ 30%)`]
    : ['warn', '클리핑 비율', `${fmt(cf * 100, 1)}% — 업데이트가 자주 잘림`]);
  if (evals.length >= 3) {
    const g = evals.map(e => e.isp_gain).filter(v => v != null);
    const recent = g.slice(-3), prev = g.slice(-6, -3);
    const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
    if (prev.length) {
      const d = avg(recent) - avg(prev);
      checks.push(d >= -0.5
        ? ['ok', '평가 추세', `최근 3회 평균 ${fmtSigned(avg(recent))} s (이전 3회 대비 ${fmtSigned(d)} s)`]
        : ['warn', '평가 추세', `최근 3회 평균 ${fmtSigned(avg(recent))} s — 이전보다 ${fmtSigned(d)} s 하락`]);
    }
  } else {
    checks.push(['info', '평가 추세', `평가 ${evals.length}회 — 3회 이상 쌓이면 추세를 판단합니다`]);
  }
  return checks;
}

function HealthPanel({ checks, colors }) {
  const icon = { ok: <OkIcon c={colors.ok}/>, warn: <WarnIcon c={colors.warn}/>, bad: <BadIcon c={colors.bad}/>, info: <InfoIcon c={colors.main}/> };
  const label = { ok: '정상', warn: '주의', bad: '위험', info: '대기' };
  return (
    <div className="health">
      {checks.map(([lvl, name, text]) => (
        <div key={name} className={`health__row health__row--${lvl}`}>
          {icon[lvl]}
          <div className="health__name">{name}<span>{label[lvl]}</span></div>

        </div>
      ))}
    </div>
  );
}

        <div className="mini-grid">
          <MetricChart rows={rows} k="sur/total" title="총손실" desc="0.3·실패 분류 + 0.2·종료 유형 + 3·곡선 + 요약값 + 일관성" digits={3} colors={colors} smoothK={1}/>
          <MetricChart rows={rows} k="sur/series" title="곡선 손실" desc="추력·챔버압·탱크압·질량유량 시계열 (고 Isp 설계 가중 ×3)" digits={4} colors={colors} smoothK={1}/>
          <MetricChart rows={rows} k="sur/scalar" title="요약값 손실" desc="Isp·임펄스·평균 추력·연소 시간·최대 압력·차압비·종료 시각 (Huber)" digits={4} colors={colors} smoothK={1}/>
          <MetricChart rows={rows} k="sur/cons" title="일관성 손실" desc="곡선에서 계산한 임펄스·추진제 질량·Isp 가 정답과 맞는지" digits={3} colors={colors} smoothK={1}/>
          <MetricChart rows={rows} k="sur/ok" title="실패 분류 손실" desc="core 가 오류로 끝날 설계인지 (BCE)" digits={3} colors={colors} smoothK={1}/>
          <MetricChart rows={rows} k="sur/term" title="종료 유형 손실" desc="산화제 소진 / 연료 소진 / 시간 제한 (CE)" digits={3} colors={colors} smoothK={1}/>
        </div>
      ) : <div className="empty">첫 검증 전입니다 (10 에폭마다)</div>}

      <h3 className="section-title">MDO 기준 정확도 — 테스트 1,700개 (시뮬레이션 20 s)</h3>
      <p className="section-subtitle">학습이 끝나면 표시 · 비교 = 이전 모델 v2 (같은 테스트 분할)</p>
      {res ? (
        <div className="chart-card">
          <table className="cds-data-table">
            <thead><tr><th>지표</th><th style={{ textAlign: 'right' }}>v2 (이전)</th><th style={{ textAlign: 'right' }}>이번 모델</th><th style={{ textAlign: 'right' }}>변화</th></tr></thead>
            <tbody>
              {SUR_ROWS.map(([name, f, unit, d, higher]) => {
                const a = ref ? f(ref) : null, b = f(res);
                const better = a == null || b == null || higher == null ? null : (higher ? b > a : Math.abs(b) < Math.abs(a));
                return (
                  <tr key={name}>
                    <td className="label">{name}</td>
                    <td className="num">{fmt(a, d)} {unit}</td>
                    <td className="num">{fmt(b, d)} {unit}</td>
                    <td className="num" style={{ color: better == null ? undefined : better ? colors.ok : colors.bad }}>
                      {a != null && b != null ? fmtSigned(b - a, d) : '—'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ) : <div className="empty">{status.state === 'done' ? '결과 없음' : '학습 중 — 모든 모델이 끝나면 테스트 지표를 계산합니다'}</div>}

      <div className="grid-2" style={{ marginTop: 24 }}>
        <div className="chart-card">
          <div className="chart-card__title">Console Log</div>
          <div className="chart-card__subtitle">optimizer/rl/runs/{status.id}.log (마지막 40줄)</div>
          <div className="sim-log" ref={logRef}>{log.join('\n') || '로그 없음'}</div>
        </div>
        <div className="chart-card">
          <div className="chart-card__title">Configuration</div>
          <div className="chart-card__subtitle">python -m rl.ts_surrogate --run {status.id}</div>
          <table className="cds-data-table">
            <tbody>
              {[
                ['앙상블 / 에폭', `${cfg.models} × ${cfg.epochs}`],
                ['Transformer', `d ${cfg.d} · ${cfg.layers}층 · head ${cfg.heads} · FF ${cfg.ff}`],
                ['학습률', cfg.lr], ['일관성 손실 가중치', cfg.w_cons],
                ['저장', `rl/${cfg.out}`], ['장치', cfg.device],
              ].map(([k, v]) => <tr key={k}><td className="label">{k}</td><td className="num">{v ?? '—'}</td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

/* ===================================================================
   DATA — 시계열 대리모델 학습 데이터 생성 (rl/ts_data.py, rl/data_monitor.py)
   =================================================================== */
const KIND_KO = { uniform: '독립 균등', random: '무작위 설계', burn: '연소 시간 분산', archive: '기존 MDO 설계 + 섭동',
                  archive_he: '기존 설계 + 슈퍼차징 재추출', walk: '에이전트식 이동 궤적', active: '능동 학습' };
const MIX_TOTAL = (mix) => Object.values(mix || {}).reduce((a, b) => a + b, 0) || 1;

function HBar({ v, max, color }) {
  const w = max > 0 && v != null ? Math.max(0, Math.min(100, v / max * 100)) : 0;
  return <div style={{ background: 'var(--cds-layer-accent, rgba(128,128,128,.15))', height: 8, width: '100%', minWidth: 60 }}>
    <div style={{ width: `${w}%`, height: '100%', background: color }}/></div>;
}

function BinTable({ bins, head, label, colors }) {
  const maxN = Math.max(1, ...bins.map(b => b.n));
  return (
    <div className="chart-card">
      <table className="cds-data-table">
        <thead><tr><th>{head}</th><th style={{ textAlign: 'right' }}>개수</th><th style={{ width: '18%' }}></th>
          <th style={{ textAlign: 'right' }}>정상 종료</th><th style={{ textAlign: 'right' }}>차압 통과</th><th style={{ width: '18%' }}></th>
          <th style={{ textAlign: 'right' }}>평균 최소 차압</th><th style={{ textAlign: 'right' }}>평균 Isp</th></tr></thead>
        <tbody>
          {bins.map(b => (
            <tr key={b.lo}>
              <td className="label">{label(b)}</td>
              <td className="num">{fmtInt(b.n)}</td>
              <td><HBar v={b.n} max={maxN} color={colors.main}/></td>
              <td className="num">{b.n ? fmt(b.ok / b.n * 100, 0) + ' %' : '—'}</td>
              <td className="num">{b.dp_pass != null ? fmt(b.dp_pass * 100, 0) + ' %' : '—'}</td>
              <td><HBar v={b.dp_pass} max={1} color={colors.ok}/></td>
              <td className="num">{fmt(b.dp_mean, 3)}</td>
              <td className="num">{fmt(b.isp_mean, 1)} s</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function DataView({ status, live, log, logRef, colors }) {
  const cfg = status.config || {};
  const st = status.stats || {};
  const done = status.done ?? 0, nOk = status.n_ok ?? status.step ?? 0;
  const bins = st.p_bins || [];
  const maxN = Math.max(1, ...bins.map(b => b.n));
  const hist = st.isp_hist || { edges: [], counts: [] };
  const maxH = Math.max(1, ...hist.counts);
  const kinds = st.kinds || {};
  const kindsDone = status.kinds_done || {};
  const mixT = MIX_TOTAL(cfg.mix);
  const lastRow = live.length ? live[live.length - 1] : null;
  const nStat = bins.reduce((a, b) => a + b.n, 0);
  const collecting = status.state === 'running' && status.phase && !status.done;
  return (
    <>
      {status.phase && (
        <div style={{ margin: '12px 0', padding: '10px 14px', border: '1px solid var(--cds-border-subtle-01)', fontSize: 13 }}>
          <b>현재 단계</b> · {status.phase}
          {collecting && status.phase_total ? (
            <span> — {fmtInt(status.phase_step)} / {fmtInt(status.phase_total)} 설계
              {status.phase_iter != null ? ` · ${fmtInt(status.phase_iter)} 걸음` : ''}
              <span style={{ display: 'block', marginTop: 6 }}><HBar v={status.phase_step} max={status.phase_total} color={colors.main}/></span>
            </span>) : null}
        </div>)}
      <div className="kpi-row">
        <div className="kpi kpi--accent">
          <div className="kpi__label">정상 종료 시뮬레이션</div>
          <div className="kpi__value">{fmtInt(nOk)}<span className="kpi__unit">/ {fmtInt(status.total_steps)}</span></div>
          <div className="kpi__sub">core 오류 설계도 '실패' 로 함께 저장 (전체 {fmtInt(done)}회)</div>
        </div>
        <div className="kpi">
          <div className="kpi__label">생성 속도</div>
          <div className="kpi__value">{fmt(status.rate, 2)}<span className="kpi__unit">개/s</span></div>
          <div className="kpi__sub">{status.cpu ? `CPU ${fmt(status.cpu.util * 100, 0)}% · 동시 실행 ${status.cpu.active}/${status.cpu.limit} (목표 ${fmt(status.cpu.target * 100, 0)}%)` : `워커 ${cfg.workers ?? '—'}`} · simt {cfg.simt ?? '—'} s</div>
        </div>
        <div className="kpi">
          <div className="kpi__label">core 오류 비율</div>
          <div className="kpi__value">{fmt(done ? (done - nOk) / done * 100 : null, 1)}<span className="kpi__unit">%</span></div>
          <div className="kpi__sub">탱크 초임계 · 과충진 등 — 실패 분류기가 배움</div>
        </div>
        <div className="kpi">
          <div className="kpi__label">차압 제약 통과 (정상 종료 중)</div>
          <div className="kpi__value">{fmt(lastRow?.['data/dp_pass'] != null ? lastRow['data/dp_pass'] * 100 : null, 0)}<span className="kpi__unit">%</span></div>
          <div className="kpi__sub">연소 중 최소 (Pt−Pc)/Pc ≥ 20%</div>
        </div>
        <div className="kpi">
          <div className="kpi__label">평균 Isp (정상 종료)</div>
          <div className="kpi__value">{fmt(lastRow?.['data/isp_mean'], 1)}<span className="kpi__unit">s</span></div>
          <div className="kpi__sub">통계 반영 {fmtInt(nStat)}개 {status.shards != null ? `(저장된 shard ${status.shards}개 기준)` : ''}</div>
        </div>
      </div>

      <h3 className="section-title">헬륨 슈퍼차징 압력별 결과</h3>
      <p className="section-subtitle">탱크 초기 압력 구간마다 생성 개수 · core 정상 종료율 · 차압 제약 통과율 · 평균 최소 차압 · 평균 Isp — 슈퍼차징이 차압에 주는 효과를 대리모델이 배울 수 있게 범위 전체를 고르게 채운다</p>
      <BinTable bins={bins} head="압력 [MPa]" label={b => `${fmt(b.lo / 1e6, 2)} – ${fmt(b.hi / 1e6, 2)}`} colors={colors}/>

      {(st.t_bins || []).some(b => b.n) && (<>
        <h3 className="section-title">초기 온도별 결과</h3>
        <p className="section-subtitle">범용 온도 대리모델 (−15 ~ 35 °C) — 온도가 오를수록 N2O 포화압이 올라 (−15 °C 2.07 → 35 °C 7.0 MPa) 슈퍼차징 여유가 줄어든다</p>
        <BinTable bins={st.t_bins} head="온도 [°C]" label={b => `${fmt(b.lo - 273.15, 0)} – ${fmt(b.hi - 273.15, 0)}`} colors={colors}/>
      </>)}

      <div className="grid-2" style={{ marginTop: 24 }}>
        <div className="chart-card">
          <div className="chart-card__title">설계 종류별 생성</div>
          <div className="chart-card__subtitle">목표 비율 대비 실제 개수 · 정상 종료</div>
          <table className="cds-data-table">
            <thead><tr><th>종류</th><th style={{ textAlign: 'right' }}>목표</th><th style={{ textAlign: 'right' }}>생성</th><th style={{ textAlign: 'right' }}>정상</th></tr></thead>
            <tbody>
              {Object.keys(cfg.mix || kindsDone).map(k => (
                <tr key={k}>
                  <td className="label">{KIND_KO[k] || k} <span className="mono" style={{ opacity: .6 }}>{k}</span></td>
                  <td className="num">{cfg.mix ? fmt(cfg.mix[k] / mixT * 100, 0) + ' %' : '—'}</td>
                  <td className="num">{fmtInt(kindsDone[k] ?? kinds[k]?.[0])}</td>
                  <td className="num">{kinds[k] ? `${fmtInt(kinds[k][1])} (${fmt(kinds[k][1] / Math.max(1, kinds[k][0]) * 100, 0)}%)` : '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="chart-card">
          <div className="chart-card__title">Isp 분포 (정상 종료)</div>
          <div className="chart-card__subtitle">10 s 구간 · 최적화가 가는 고 Isp 영역(170 s↑)이 충분한지</div>
          <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 150, paddingTop: 8 }}>
            {hist.counts.map((c, i) => (
              <div key={i} title={`${hist.edges[i]}–${hist.edges[i + 1]} s: ${c}`}
                   style={{ flex: 1, height: `${c / maxH * 100}%`, minHeight: c ? 2 : 0,
                            background: hist.edges[i] >= 170 ? colors.ok : colors.main }}/>
            ))}
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, opacity: .7, marginTop: 4 }}>
            <span>0 s</span><span>130 s</span><span>260 s</span>
          </div>
        </div>
      </div>

      <h3 className="section-title">진행</h3>
      {live.length > 1 ? (
        <div className="mini-grid">
          <MetricChart rows={live} k="data/rate" title="생성 속도" desc="정상 종료 시뮬레이션 / s (누적 평균)" unit=" 개/s" digits={2} colors={colors} smoothK={1}/>
          <MetricChart rows={live} k="data/err_rate" title="core 오류 비율" desc="누적" digits={3} colors={colors} smoothK={1}/>
          <MetricChart rows={live} k="data/dp_pass" title="차압 통과 비율" desc="정상 종료 중 최소 차압 ≥ 0.2" digits={3} colors={colors} smoothK={1}/>
          <MetricChart rows={live} k="data/isp_mean" title="평균 Isp" desc="정상 종료" unit=" s" digits={1} colors={colors} smoothK={1}/>
        </div>
      ) : <div className="empty">기록 대기 중</div>}

      <h3 className="section-title">최근 시뮬레이션</h3>
      <div className="chart-card">
        <table className="cds-data-table">
          <thead><tr><th>종류</th><th style={{ textAlign: 'right' }}>온도</th><th style={{ textAlign: 'right' }}>슈퍼차징</th><th style={{ textAlign: 'right' }}>헬륨</th><th>종료</th>
            <th style={{ textAlign: 'right' }}>Isp</th><th style={{ textAlign: 'right' }}>임펄스</th><th style={{ textAlign: 'right' }}>평균 추력</th>
            <th style={{ textAlign: 'right' }}>연소</th><th style={{ textAlign: 'right' }}>최소 차압</th></tr></thead>
          <tbody>
            {(st.recent || []).map((r, i) => (
              <tr key={i}>
                <td className="label">{KIND_KO[r.kind] || r.kind}</td>
                <td className="num">{r.T != null ? fmt(r.T - 273.15, 1) + ' °C' : '—'}</td>
                <td className="num">{fmt(r.p / 1e6, 2)} MPa</td>
                <td className="num">{fmt(r.he * 1e3, 1)} g</td>
                <td className="label" style={{ color: r.ok ? undefined : colors.bad }}>{r.term}</td>
                <td className="num">{fmt(r.isp, 1)}</td>
                <td className="num">{fmtInt(r.impulse)}</td>
                <td className="num">{fmtInt(r.thrust_avg)}</td>
                <td className="num">{fmt(r.burn_time, 1)} s</td>
                <td className="num" style={{ color: r.dp == null ? undefined : r.dp >= 0.2 ? colors.ok : colors.bad }}>{fmt(r.dp, 3)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        {status.shards != null && <div className="cds-helper-text" style={{ marginTop: 8 }}>실행 중에 붙은 감시라 표·분포는 저장된 shard(500개 단위) 기준입니다. 진행 개수·속도는 실시간.</div>}
      </div>

      <div className="grid-2" style={{ marginTop: 24 }}>
        <div className="chart-card">
          <div className="chart-card__title">Console Log</div>
          <div className="chart-card__subtitle">optimizer/rl/runs/{status.id}.log</div>
          <div className="sim-log" ref={logRef}>{log.join('\n') || '로그 없음'}</div>
        </div>
        <div className="chart-card">
          <div className="chart-card__title">Configuration</div>
          <div className="chart-card__subtitle">python -m rl.ts_data --n {cfg.n_target}</div>
          <table className="cds-data-table">
            <tbody>
              {[
                ['저장 위치', `rl/${cfg.data_dir || status.data_dir}`],
                ['목표 (정상 종료)', fmtInt(cfg.n_target)],
                ['시뮬레이션 시간', `${cfg.simt} s`],
                ['슈퍼차징 범위', cfg.pressure_bounds ? `${fmt(cfg.pressure_bounds[0] / 1e6, 1)} – ${fmt(cfg.pressure_bounds[1] / 1e6, 1)} MPa` : '—'],
                ['워커', cfg.workers],
              ].map(([k, v]) => <tr key={k}><td className="label">{k}</td><td className="num">{v ?? '—'}</td></tr>)}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

/* ===================================================================
   CURVE AGENT — 곡선을 보고 판단하는 설계 에이전트 (rl/train_curve.py)
   =================================================================== */
const CURVE_MAGS = ['−33%', '−14%', '−5%', '−2%', '+2%', '+5%', '+16%', '+49%'];
const PHASES = [
  ['baseline', '기준선', '같은 대리모델 위 기본 GA 32 × 100세대 + core 검증'],
  ['teacher', '한 걸음 앞 보기', '상태마다 이동 115가지를 대리모델로 모두 시도'],
  ['pretrain', '사전학습', '앞 보기 결과를 정책으로 증류'],
  ['running', 'PPO 미세 조정', '여러 걸음 계획 · 주기적 core 검증'],
];

function PhaseBar({ status }) {
  const order = PHASES.map(p => p[0]);
  const st = status.state === 'verify' ? 'running' : status.state;
  const cur = order.indexOf(st);
  const done = ['done', 'stopped'].includes(status.state);
  return (
    <div className="phase-row" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1, background: 'var(--cds-border-subtle-01)', margin: '16px 0' }}>
      {PHASES.map(([key, name, desc], i) => {
        const active = i === cur && !done, past = done || (cur >= 0 && i < cur);
        const pct = active && status.phase_total ? Math.min(100, status.phase_step / status.phase_total * 100) : past ? 100 : 0;
        return (
          <div key={key} style={{ background: 'var(--cds-layer-01)', padding: '12px 16px', borderTop: `3px solid ${active ? 'var(--cds-interactive)' : past ? 'var(--cds-support-success)' : 'transparent'}` }}>
            <div style={{ fontSize: 12, color: 'var(--cds-text-secondary)' }}>{i + 1}단계{active ? ' · 진행 중' : past ? ' · 완료' : ''}</div>
            <div style={{ fontWeight: 600, margin: '2px 0 4px' }}>{name}</div>
            <div style={{ fontSize: 12, color: 'var(--cds-text-secondary)' }}>{desc}</div>
            {active && key !== 'running' && status.phase_total ? (
              <div style={{ fontSize: 12, marginTop: 6 }} className="mono">
                {fmtInt(status.phase_step)} / {fmtInt(status.phase_total)}{status.phase_eta != null ? ` · 남은 ${fmtTime(status.phase_eta)}` : ''}
                <div style={{ height: 4, background: 'var(--cds-border-subtle-01)', marginTop: 4 }}><div style={{ width: `${pct}%`, height: 4, background: 'var(--cds-interactive)' }}/></div>
              </div>) : null}
            {active && status.state === 'verify' && <div style={{ fontSize: 12, marginTop: 6 }}>core 검증 중…</div>}
          </div>
        );
      })}
    </div>
  );
}

function CoreChart({ evals, gaCore, colors }) {
  const data = evals.filter(e => e.core_score != null).map(e => ({ step: e.step, ok: e.core_ok * 100, isp: e.core_isp }));
  if (!data.length) return <div className="empty">첫 core 검증 전입니다 (사전학습 직후 1회, 이후 core_freq 마다)</div>;
  return (
    <div className="grid-2">
      <div className="chart-card">
        <div className="chart-card__title">core 검증 합격률</div>
        <div className="chart-card__subtitle">에피소드마다 에이전트 최고 설계를 진짜 시뮬레이터로 · 회색 선 = 기본 GA {fmt((gaCore?.core_ok ?? 0) * 100, 0)}%</div>
        <ResponsiveContainer width="100%" height={220}>
          <LineChart data={data} margin={{ top: 12, right: 16, bottom: 0, left: 0 }}>
            <CartesianGrid stroke={colors.grid} vertical={false}/>

}

function VarChoiceGrid({ live, colors }) {
  const rows = live.filter(r => r['curve/var_none'] != null);
  if (!rows.length) return <div className="empty">PPO 단계부터 기록됩니다</div>;
  const labels = { ...VAR_LABELS, pipe: ['파이프 변경', 'pipe ±'], none: ['유지', 'no move'] };
  const last = rows[rows.length - 1], first = rows[0];
  return (
    <div className="action-grid">
      {Object.entries(labels).map(([v, [name, code]]) => {
        const key = `curve/var_${v}`;
        const data = rows.map(r => ({ step: r.step, v: (r[key] ?? 0) * 100 }));
        const sm = smooth(data, 'v', 5);
        const cur = (last[key] ?? 0) * 100, d = cur - (first[key] ?? 0) * 100;
        return (
          <div key={v} className="action-card">
            <div className="action-card__head">
              <div><div className="action-card__name">{name}</div><div className="action-card__desc mono">{code}</div></div>
              <div className="action-card__value">{fmt(cur, 1)}<span>%</span></div>
            </div>
            <ResponsiveContainer width="100%" height={56}>
              <LineChart data={data.map((r, i) => ({ ...r, s: sm[i] }))} margin={{ top: 4, right: 0, bottom: 0, left: 0 }}>
                <YAxis hide domain={[0, 'dataMax']}/>
                <XAxis dataKey="step" hide type="number" domain={['dataMin', 'dataMax']}/>
                <Tooltip content={<ChartTip unit="%" digits={1}/>}/>
                <Line dataKey="s" name={name} stroke={colors.main} strokeWidth={2} dot={false} isAnimationActive={false}/>
              </LineChart>
            </ResponsiveContainer>
            <div className="action-card__delta">시작 대비 {fmtSigned(d, 1)}%p</div>
          </div>
        );
      })}
    </div>
  );
}

/* ===================================================================
   MAIN APP
   =================================================================== */
function App() {
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('tusi-theme') || 'light'; } catch { return 'light'; } });
  const [runs, setRuns] = useState([]);
  const [selected, setSelected] = useState(null);
  const [status, setStatus] = useState(null);
  const [live, setLive] = useState([]);
  const [evals, setEvals] = useState([]);
  const [log, setLog] = useState([]);
  const [error, setError] = useState(null);
  const [updatedAt, setUpdatedAt] = useState(null);
  const liveRef = useRef([]);
  const selRef = useRef(null);
  const logRef = useRef(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('tusi-theme', theme); } catch {}
  }, [theme]);
  const colors = PALETTE[theme] || PALETTE.light;

  // 실행 목록
  const loadRuns = useCallback(async () => {
    try {
      const r = await fetch('/api/rl/runs', { credentials: 'same-origin' });
      const d = await r.json();
      setRuns(d.runs || []);
      if (!selRef.current && d.runs?.length) {
        const running = d.runs.find(x => LIVE_STATES.includes(x.state));
        select((running || d.runs[0]).id);
      }
    } catch { setError('실행 목록을 불러오지 못했습니다.'); }
  }, []);

  const select = (id) => {
    selRef.current = id;
    liveRef.current = [];
    setSelected(id); setLive([]); setEvals([]); setStatus(null); setLog([]);
    try { history.replaceState(null, '', `#${id}`); } catch {}
  };

  // 선택한 실행 상세 (live.jsonl 은 받은 줄 이후만)
  const loadRun = useCallback(async () => {
    const id = selRef.current;
    if (!id) return null;
    try {
      const r = await fetch(`/api/rl/runs/${encodeURIComponent(id)}?since=${liveRef.current.length}`, { credentials: 'same-origin' });
      const d = await r.json();
      if (id !== selRef.current) return null;
      if (d.error) { setError(d.error); return null; }
      liveRef.current = liveRef.current.concat(d.live);
      setLive(liveRef.current); setEvals(d.evals || []); setStatus(d.status); setLog(d.log || []);
      setUpdatedAt(new Date()); setError(null);
      return d.status;
    } catch { setError('학습 상태를 불러오지 못했습니다.'); return null; }
  }, []);

  useEffect(() => {
    const fromHash = decodeURIComponent((location.hash || '').slice(1));
    if (fromHash) select(fromHash);
    loadRuns();
    const t = setInterval(loadRuns, RUNS_POLL_MS);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!selected) return;
    let alive = true, timer = null;
    const loop = async () => {
      const st = await loadRun();
      if (alive && st && LIVE_STATES.includes(st.state)) timer = setTimeout(loop, POLL_MS);
    };
    loop();
    return () => { alive = false; clearTimeout(timer); };
  }, [selected]);

  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [log.length]);

  const stop = async () => {
    if (!selected) return;
    const r = await fetch(`/api/rl/runs/${encodeURIComponent(selected)}/stop`, { method: 'POST', credentials: 'same-origin' });
    const d = await r.json();
    if (!r.ok) setError(d.error || '중단 실패');
    loadRun(); loadRuns();
  };

  // 파생 값
  const running = status && LIVE_STATES.includes(status.state);
  const total = status?.total_steps || 0, step = status?.step || 0;
  const pct = total ? Math.min(100, step / total * 100) : 0;
  const fps = lastVal(live, 'time/fps') ?? status?.fps;
  const elapsed = status?.started ? ((status.finished || (running ? Date.now() / 1000 : status.started)) - status.started) : null;
  const isSur = status?.kind === 'surrogate';
  const isData = status?.kind === 'data';
  const eta = running && (isSur || isData) && step > 0 && elapsed ? (total - step) * elapsed / step
            : running && fps ? (total - step) / fps : null;
  const lastEval = evals.length ? evals[evals.length - 1] : null;
  const bestEval = evals.reduce((b, e) => (e.isp_gain != null && (!b || e.score > b.score)) ? e : b, null);
  const baseline = status?.baseline ? { ...status.baseline, n: status.eval_episodes } : null;
  const ent = lastVal(live, 'train/entropy_loss');
  const rew = meanLast(live, 'rollout/ep_rew_mean', 5);
  const checks = useMemo(() => healthChecks(live, evals, status || {}), [live, evals, status]);
  const tag = STATE_TAG[status?.state] || ['cds-tag--gray', status?.state || '—', false];
  const cfg = status?.config || {};
  const trainRows = live.filter(r => r['train/approx_kl'] != null);
  const isDirect = status?.kind === 'direct';
  const who = isDirect ? '에이전트' : 'PPO';
  const stdNow = lastVal(live, 'direct/action_std');
  const rollRows = live.filter(r => r['rollout/ep_rew_mean'] != null);

  return (
    <>
      <header className="cds-header">
        <div className="cds-header__name">
          <img src="/static/logo.png" alt="" style={{ height: 24, opacity: 0.9 }}/>
          TUSI Hybrid Rocket Engine Simulator
          <span className="cds-header__divider">/</span>
          <span className="cds-header__page">Training</span>
        </div>
        <nav className="cds-header__nav">
          <a className="theme-toggle" href="/"><EngineIcon/> Simulator</a>
          <a className="theme-toggle" href="/mdo"><DnaIcon/> MDO</a>
          <a className="theme-toggle" href="/surrogate"><BoltIcon/> Surrogate</a>
          <a className="theme-toggle theme-toggle--active" href="/training"><ChartIcon/> Training</a>
          <a className="theme-toggle" href="/drawing"><RulerIcon/> Drawing</a>
          <button className="theme-toggle" onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')}>
            {theme === 'dark' ? <SunIcon/> : <MoonIcon/>}{theme === 'dark' ? 'Light' : 'Dark'}
          </button>
        </nav>
      </header>

      <div className="app-container">
        <aside className="config-panel">
          <div className="config-header">
            <h2>Training Runs</h2>
            <p>optimizer/rl/runs · 실행 중인 학습은 {POLL_MS / 1000}초마다 갱신됩니다</p>
          </div>
          <RunList runs={runs} selected={selected} onSelect={select}/>
          <div className="cds-helper-text" style={{ padding: '12px 24px 24px' }}>
            새 학습: optimizer 폴더에서 <span className="mono">python -m rl.train_curve</span> (곡선 판단), <span className="mono">python -m rl.train_direct</span> (직접 설계) 또는 <span className="mono">python -m rl.train_ppo</span> (GA 전략 선택)
          </div>
        </aside>

        <main className="result-panel">
          {error && (
            <div className="cds-notification cds-notification--error">
              <div><div className="cds-notification__title">오류</div><div className="cds-notification__subtitle">{error}</div></div>
              <button className="cds-notification__close" onClick={() => setError(null)}>✕</button>
            </div>
          )}
          {!status ? <div className="hero"><h1>{runs.length ? '불러오는 중…' : '학습 기록이 없습니다'}</h1></div> : (
            <div className="animate-fadeIn">
              {/* 진행 상태 */}
              <div className="run-status">
                <span className={`cds-tag ${tag[0]}`}><i className={`tag-dot ${tag[2] ? 'tag-dot--live' : ''}`}/>{tag[1]}</span>
                <div className="run-status__gen">{status.id}</div>
                <div className="run-status__meta">
                  <div>Step<strong>{fmtInt(step)} / {fmtInt(total)}</strong></div>
                  <div>Elapsed<strong>{fmtTime(elapsed)}</strong></div>
                  <div>ETA<strong>{running ? (eta != null ? fmtTime(eta) : '계산 중') : '—'}</strong></div>
                  <div>Speed<strong>{isData ? (status.rate ? `${fmt(status.rate, 2)} 개/s` : '—') : isSur ? (elapsed && step ? `${fmt(step / elapsed * 60, 1)} 에폭/분` : '—') : fps ? `${fmtInt(fps)} /s` : '—'}</strong></div>
                </div>
                {running && <button className="cds-btn cds-btn--danger cds-btn--compact" onClick={stop}><StopIcon/> Stop</button>}
              </div>
              <div className="progress"><div className="progress__fill" style={{ width: `${pct}%` }}/></div>
              <div className="progress__label">
                <span>{fmt(pct, 1)}% · {status.state === 'baseline' ? '기준선(기본 GA) 평가 중' : running ? (isData ? '데이터 생성 중' : '학습 중') : status.state === 'done' ? '완료' : status.state}</span>
                <span>{updatedAt ? `갱신 ${updatedAt.toLocaleTimeString('ko-KR')}` : ''}</span>
              </div>
              {status.legacy && (
                <div className="cds-notification cds-notification--warning">
                  <div><div className="cds-notification__title">이전 형식의 실행</div>
                  <div className="cds-notification__subtitle">실시간 학습 지표(live.jsonl)가 없어 평가 결과만 표시합니다.</div></div>
                </div>
              )}
              {status.error && (
                <div className="cds-notification cds-notification--error">
                  <div><div className="cds-notification__title">학습 오류</div><div className="cds-notification__subtitle">{status.error}</div></div>
                </div>
              )}

              {isData ? <DataView status={status} live={live} log={log} logRef={logRef} colors={colors}/>
               : isSur ? <SurrogateView status={status} live={live} log={log} logRef={logRef} colors={colors}/>
               : status.kind === 'curve' ? <CurveView status={status} live={live} evals={evals} log={log} logRef={logRef} colors={colors}/> : (<>
              {/* KPI */}
              <div className="kpi-row">
                <div className="kpi kpi--accent">
                  <div className="kpi__label">기본 GA 대비 Isp (최근 평가)</div>
                  <div className="kpi__value">{fmtSigned(lastEval?.isp_gain)}<span className="kpi__unit">s</span></div>
                  <div className="kpi__sub">{bestEval ? `최고 ${fmtSigned(bestEval.isp_gain)} s @ ${fmtK(bestEval.step)} (best_model)` : '평가 대기'}</div>
                </div>
                <div className="kpi">
                  <div className="kpi__label">승률 (최근 평가)</div>
                  <div className="kpi__value">{lastEval?.win_rate != null ? fmt(lastEval.win_rate * 100, 0) : '—'}<span className="kpi__unit">%</span></div>
                  <div className="kpi__sub">50% 초과 = 기본 GA 보다 자주 이김</div>
                </div>
                <div className="kpi">
                  <div className="kpi__label">합격률 (최근 평가)</div>
                  <div className="kpi__value">{lastEval ? fmt(lastEval.success * 100, 0) : '—'}<span className="kpi__unit">%</span></div>
                  <div className="kpi__sub">기본 GA {baseline ? fmt(baseline.success * 100, 0) : '—'}% · 평가 {fmtInt(status.eval_episodes)}개 × {cfg.eval_gens ?? '—'}세대{isDirect ? ' × 에이전트 32' : ''}</div>
                </div>
                <div className="kpi">
                  <div className="kpi__label">에피소드 보상 (최근 5회)</div>
                  <div className="kpi__value">{fmt(rew, 2)}</div>
                  <div className="kpi__sub">학습 에피소드 {cfg.gen_min ?? '—'}–{cfg.gen_max ?? '—'}{isDirect ? '스텝' : '세대'} · 높을수록 Isp 상승</div>
                </div>
                {isDirect ? (
                  <div className="kpi">
                    <div className="kpi__label">행동 표준편차</div>
                    <div className="kpi__value">{fmt(stdNow, 3)}</div>
                    <div className="kpi__sub">16차원 연속 행동 (변수 14 · 스텝 · 파이프) · 작을수록 결정적</div>
                  </div>
                ) : (
                  <div className="kpi">
                    <div className="kpi__label">정책 엔트로피</div>
                    <div className="kpi__value">{ent != null ? fmt(-ent, 2) : '—'}<span className="kpi__unit">/ {fmt(Math.log(8), 2)}</span></div>
                    <div className="kpi__sub">최대 = 8개 전략을 균등하게 시도</div>
                  </div>
                )}
              </div>

              {/* 안정성 진단 */}
              <h3 className="section-title">학습 안정성 진단</h3>
              <p className="section-subtitle">최근 업데이트 기준 자동 판정 · 주의/위험이 계속되면 학습률이나 엔트로피 계수를 조정하세요</p>
              <HealthPanel checks={checks} colors={colors}/>

              {/* 평가 */}
              <h3 className="section-title">평가 — 기본 GA 와 비교</h3>
              <p className="section-subtitle">{fmtInt(cfg.eval_freq)} 스텝마다 같은 목표·시드 {fmtInt(status.eval_episodes)}개로 {isDirect ? '에이전트 32명 × ' + (cfg.eval_gens ?? 100) + '걸음(평균 행동)' : 'PPO(결정적)'}와 기본 GA 를 비교{isDirect ? ' · 둘 다 시계열 대리모델로 평가, 평가 수 동일' : ''} · 점에 마우스를 올리면 값</p>
              {evals.length ? (
                <>
                  <div className="grid-2">
                    <EvalGainChart evals={evals} colors={colors}/>
                    <EvalIspChart evals={evals} baseline={baseline} colors={colors}/>
                  </div>
                  <EvalRateChart evals={evals} baseline={baseline} colors={colors}/>
                </>
              ) : <div className="empty">첫 평가 전입니다 ({fmtInt(cfg.eval_freq)} 스텝마다 평가)</div>}

              {/* 학습 지표 */}
              {trainRows.length > 0 && (
                <>
                  <h3 className="section-title">학습 지표</h3>
                  <p className="section-subtitle">연한 선 = 업데이트별 원값, 진한 선 = 이동 평균 (업데이트 1회 = {fmtInt((cfg.n_steps || 0) * (cfg.n_envs || 0))} 스텝)</p>
                  <div className="mini-grid">
                    <MetricChart rows={rollRows} k="rollout/ep_rew_mean" title="에피소드 보상" desc="학습 에피소드의 평균 누적 보상 — 우상향이면 학습 중" digits={2} colors={colors}/>
                    <MetricChart rows={rollRows} k="ga/best_isp" title="학습 에피소드 Isp" desc="학습 중 에피소드의 평균 최종 Isp" unit="s" digits={1} colors={colors}/>
                    {isDirect
                      ? <MetricChart rows={rollRows.filter(r => r['direct/action_std'] != null)} k="direct/action_std" title="행동 표준편차" desc="정책이 이동량을 얼마나 무작위로 시도하는지 (작을수록 결정적)" digits={3} colors={colors}/>
                      : <MetricChart rows={trainRows} k="train/entropy_loss" title="정책 엔트로피" desc="높을수록 여러 전략을 시도 (최대 2.08)" digits={2} colors={colors} transform={v => -v}
                                     refLine={{ y: 0.5, label: '0.5 미만 = 수렴' }}/>}
                    <MetricChart rows={trainRows} k="train/explained_variance" title="가치함수 설명 분산" desc="1 에 가까울수록 보상 예측이 정확" digits={2} colors={colors}
                                 refLine={{ y: 0.5, label: '0.5' }}/>
                    <MetricChart rows={trainRows} k="train/approx_kl" title="KL (정책 변화 폭)" desc={`업데이트당 정책 변화량 — target_kl ${cfg.target_kl ?? '—'} 넘으면 중단`} digits={4} colors={colors}
                                 refLine={cfg.target_kl ? { y: cfg.target_kl, label: 'target_kl' } : null}/>
                    <MetricChart rows={trainRows} k="train/clip_fraction" title="클리핑 비율" desc="업데이트가 잘린 비율 — 30% 이하가 정상" digits={3} colors={colors}/>
                    <MetricChart rows={trainRows} k="train/value_loss" title="가치 손실" desc="가치함수 오차 (보상 정규화 단위)" digits={3} colors={colors}/>
                    <MetricChart rows={trainRows} k="train/learning_rate" title="학습률" desc="시작값에서 선형으로 감소" digits={6} colors={colors} smoothK={1}/>
                    <MetricChart rows={rollRows} k="ga/success_rate" title="학습 에피소드 합격률" desc={isDirect ? '에피소드 중 한 번이라도 모든 제약을 만족한 비율' : '모든 제약을 만족한 에피소드 비율'} digits={2} colors={colors} yDomain={[0, 1]}/>
                    {isDirect && <MetricChart rows={rollRows.filter(r => r['ga/final_feasible'] != null)} k="ga/final_feasible" title="마지막 설계 합격률" desc="에피소드가 끝날 때 서 있는 설계가 합격인 비율 — 합격 영역에 머무는 능력" digits={2} colors={colors} yDomain={[0, 1]}/>}
                    {isDirect && <MetricChart rows={rollRows.filter(r => r['direct/step_mean'] != null)} k="direct/step_mean" title="평균 이동 스텝" desc="한 걸음 크기 (탐색 범위 대비, 0.2%–10%) — 수렴하면 작아짐" digits={4} colors={colors}/>}
                    {isDirect && <MetricChart rows={rollRows.filter(r => r['direct/pipe_change'] != null)} k="direct/pipe_change" title="파이프 변경 비율" desc="걸음당 파이프를 바꾼 비율" digits={3} colors={colors}/>}
                  </div>
                </>
              )}

              {/* 전략 / 변수 이동 */}
              {isDirect ? (
                <>
                  <h3 className="section-title">설계 변수별 조정 강도</h3>
                  <p className="section-subtitle">업데이트별 평균 |행동| (0 = 거의 안 움직임, 1 = 매 걸음 최대로 움직임) · 실제 이동량 = 강도 × 스텝 × 탐색 범위</p>
                  <MoveGrid live={live} colors={colors}/>
                </>
              ) : (
                <>
                  <h3 className="section-title">전략 사용 비율</h3>
                  <p className="section-subtitle">학습 중(확률적 선택) 업데이트별 전략 선택 비율 · 균등하면 각 12.5%</p>
                  <ActionGrid live={live} colors={colors}/>
                </>
              )}

              {/* 로그 · 설정 */}
              <div className="grid-2" style={{ marginTop: 24 }}>
                <div className="chart-card">
                  <div className="chart-card__title">Console Log</div>
                  <div className="chart-card__subtitle">optimizer/rl/runs/{status.id}.log (마지막 40줄)</div>
                  <div className="sim-log" ref={logRef}>{log.join('\n') || '로그 없음'}</div>
                </div>
                <div className="chart-card">
                  <div className="chart-card__title">Configuration</div>
                  <div className="chart-card__subtitle">config.json · 기준선(기본 GA) 평가 결과 포함</div>
                  <table className="cds-data-table">
                    <tbody>
                      {[
                        ['총 스텝', fmtInt(cfg.steps)], ['병렬 환경', cfg.n_envs], ['롤아웃 / 배치', `${cfg.n_steps} × ${cfg.n_envs} / ${cfg.batch_size}`],
                        ['학습률', cfg.lr != null ? `${cfg.lr} → ${(cfg.lr * (cfg.lr_end_frac ?? 1)).toPrecision(2)}` : '—'],
                        ['γ / target_kl', `${cfg.gamma ?? 0.99} / ${cfg.target_kl ?? '—'}`], ['엔트로피 계수', cfg.ent_coef],
                        ['보상 정규화', cfg.no_norm_reward ? '끔' : (cfg.gamma ? '켬' : '—')],
                        ['방식', isDirect ? '에이전트 직접 설계 (연속 행동 16 · 관측 ' + (cfg.obs_dim ?? '—') + ')' : 'GA 전략 선택 (8종)'],
                        [isDirect ? '에피소드 길이 (걸음)' : '에피소드 세대 수', cfg.gen_min ? `${cfg.gen_min}–${cfg.gen_max}` : '30'],
                        ['보상', isDirect ? `점수 증가량 · Isp ${cfg.isp_scale ?? 20} s 당 +1` : `Isp ${cfg.isp_scale ?? 20} s 당 +1 · 시뮬 비용 ${cfg.sim_cost ?? 0}`],
                        ['환경', isDirect ? '시계열 대리모델 (rl/ts_surrogate.pt)' : '대리모델 (rl/surrogate.pt)'],
                        ['기준선 Isp / 합격률', baseline ? `${fmt(baseline.best_isp, 2)} s / ${fmt(baseline.success * 100, 0)}%` : '—'],
                        ['장치', cfg.device],
                      ].map(([k, v]) => <tr key={k}><td className="label">{k}</td><td className="num">{v ?? '—'}</td></tr>)}
                    </tbody>
                  </table>
                </div>
              </div>
              </>)}
            </div>
          )}
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
